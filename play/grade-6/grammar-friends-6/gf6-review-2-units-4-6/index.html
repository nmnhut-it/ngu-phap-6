u003e S + have/has + been + V-ing\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ePhủ định:\u003c/strong\u003e S + haven't/hasn't + been + V-ing\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eNghi vấn:\u003c/strong\u003e Have/Has + S + been + V-ing?\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eDùng với:\u003c/strong\u003e for (khoảng thời gian), since (mốc thời gian)\u003c/p\u003e\r\n          \u003cp\u003e\u003cem\u003eVí dụ: We've been listening to some music. / Has Karl been playing football?\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2. Passive Voice (Câu bị động)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003ePresent simple:\u003c/strong\u003e am/is/are + past participle → \u003cem\u003ePaper is made from trees.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ePast simple:\u003c/strong\u003e was/were + past participle → \u003cem\u003eThose carvings were discovered.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ePresent continuous:\u003c/strong\u003e am/is/are + being + past participle → \u003cem\u003eQuestions are being asked.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eFuture:\u003c/strong\u003e will be + past participle → \u003cem\u003eYou will be asked questions later.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ePresent perfect:\u003c/strong\u003e have/has + been + past participle → \u003cem\u003eThey've been given the wrong information.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-review-2-units-4-6\",\"title\":\"Review 2: Units 4-6\",\"grammarTopics\":[\"Present perfect continuous\",\"Passive: present/past simple\",\"Passive: present continuous\",\"Passive: future\",\"Passive: present perfect\"],\"theory\":{\"brief\":\"Ôn tập các cấu trúc ngữ pháp Units 4-6: Thì hiện tại hoàn thành tiếp diễn (have/has been + V-ing), câu bị động ở các thì khác nhau.\",\"examples\":[\"Present perfect continuous: We've been listening to some music.\",\"Passive (past simple): Those carvings were discovered by an archaeologist.\",\"Passive (present continuous): Questions are being asked.\",\"Passive (future): You will be asked questions later.\",\"Passive (present perfect): They've been given the wrong information.\"]},\"exercises\":[{\"id\":1,\"type\":\"sentence-build\",\"prompt\":\"Judy / ice skating / a lot\",\"instructions\":\"Write a sentence using the present perfect continuous.\",\"answer\":\"Judy has been ice skating a lot.\",\"acceptedAnswers\":[\"Judy has been ice skating a lot.\",\"Judy has been ice skating a lot\",\"Judy's been ice skating a lot.\",\"Judy's been ice skating a lot\"],\"hints\":[\"Use has been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Hiện tại hoàn thành tiếp diễn diễn tả hành động kéo dài đến hiện tại: \u003cstrong\u003ehas/have been + V-ing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Judy' số ít → \u003cstrong\u003ehas been ice skating\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Judy đã trượt băng rất nhiều dạo gần đây.\"},{\"id\":2,\"type\":\"sentence-build\",\"prompt\":\"Our team / not play / very well\",\"instructions\":\"Write a sentence using the present perfect continuous.\",\"answer\":\"Our team hasn't been playing very well.\",\"acceptedAnswers\":[\"Our team hasn't been playing very well.\",\"Our team hasn't been playing very well\",\"Our team has not been playing very well.\",\"Our team has not been playing very well\"],\"hints\":[\"Use hasn't been + V-ing for negative\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phủ định hiện tại hoàn thành tiếp diễn: \u003cstrong\u003ehasn't/haven't been + V-ing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Our team' số ít → \u003cstrong\u003ehasn't been playing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Đội của chúng tôi đã chơi không tốt lắm.\"},{\"id\":3,\"type\":\"sentence-build\",\"prompt\":\"Lewis and I / paint / our tree house\",\"instructions\":\"Write a sentence using the present perfect continuous.\",\"answer\":\"Lewis and I have been painting our tree house.\",\"acceptedAnswers\":[\"Lewis and I have been painting our tree house.\",\"Lewis and I have been painting our tree house\",\"Lewis and I've been painting our tree house.\",\"Lewis and I've been painting our tree house\"],\"hints\":[\"Use have been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Hiện tại hoàn thành tiếp diễn: \u003cstrong\u003ehas/have been + V-ing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Lewis and I' số nhiều → \u003cstrong\u003ehave been painting\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Lewis và tôi đã và đang sơn nhà trên cây.\"},{\"id\":4,\"type\":\"sentence-build\",\"prompt\":\"I / search / the Internet / for two hours\",\"instructions\":\"Write a sentence using the present perfect continuous.\",\"answer\":\"I have been searching the Internet for two hours.\",\"acceptedAnswers\":[\"I have been searching the Internet for two hours.\",\"I have been searching the Internet for two hours\",\"I've been searching the Internet for two hours.\",\"I've been searching the Internet for two hours\"],\"hints\":[\"Use have been + V-ing, 'for' indicates duration\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng hiện tại hoàn thành tiếp diễn nhấn vào khoảng thời gian kéo dài: \u003cstrong\u003ehave been + V-ing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'I' → \u003cstrong\u003ehave been searching\u003c/strong\u003e (for two hours).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã tìm trên mạng suốt hai tiếng đồng hồ.\"},{\"id\":5,\"type\":\"sentence-build\",\"prompt\":\"My sister / talk / since she arrived\",\"instructions\":\"Write a sentence using the present perfect continuous.\",\"answer\":\"My sister has been talking since she arrived.\",\"acceptedAnswers\":[\"My sister has been talking since she arrived.\",\"My sister has been talking since she arrived\",\"My sister's been talking since she arrived.\",\"My sister's been talking since she arrived\"],\"hints\":[\"Use has been + V-ing, 'since' for a point in time\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Hành động bắt đầu trong quá khứ và còn tiếp tục dùng \u003cstrong\u003ehas/have been + V-ing\u003c/strong\u003e với 'since'.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'My sister' số ít → \u003cstrong\u003ehas been talking\u003c/strong\u003e (since she arrived).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chị tôi đã nói chuyện liên tục từ lúc đến.\"},{\"id\":6,\"type\":\"sentence-build\",\"prompt\":\"Mum / read a lot / recently ✓\",\"instructions\":\"Write a question and short answer using the present perfect continuous. ✓ = Yes\",\"answer\":\"Has Mum been reading a lot recently? Yes, she has.\",\"acceptedAnswers\":[\"Has Mum been reading a lot recently? Yes, she has.\",\"Has Mum been reading a lot recently? Yes, she has\"],\"hints\":[\"Has + subject + been + V-ing? Yes, she has.\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu hỏi hiện tại hoàn thành tiếp diễn: \u003cstrong\u003eHas/Have + S + been + V-ing?\u003c/strong\u003e; trả lời ngắn Yes, S + has/have.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Mum' số ít → Has...? và ✓ → Yes, she has.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Dạo này mẹ có đọc nhiều không? — Có.\"},{\"id\":7,\"type\":\"sentence-build\",\"prompt\":\"Dad / wash the car ✗\",\"instructions\":\"Write a question and short answer using the present perfect continuous. ✗ = No\",\"answer\":\"Has Dad been washing the car? No, he hasn't.\",\"acceptedAnswers\":[\"Has Dad been washing the car? No, he hasn't.\",\"Has Dad been washing the car? No, he hasn't\",\"Has Dad been washing the car? No, he has not.\"],\"hints\":[\"Has + subject + been + V-ing? No, he hasn't.\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu hỏi/đáp hiện tại hoàn thành tiếp diễn; phủ định ngắn No, S + hasn't.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Dad' số ít → Has...? và ✗ → No, he hasn't.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bố có đang rửa xe không? — Không.\"},{\"id\":8,\"type\":\"fill-blank\",\"question\":\"Cara: Hi Tina, I haven't seen you for a few days. What _______ (you do)?\",\"answer\":\"have you been doing\",\"acceptedAnswers\":[\"have you been doing\"],\"hints\":[\"Present perfect continuous question form\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu hỏi hiện tại hoàn thành tiếp diễn: \u003cstrong\u003eWhat have/has + S + been + V-ing?\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'you' → \u003cstrong\u003ehave you been doing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mấy hôm không gặp, bạn đã làm gì thế?\"},{\"id\":9,\"type\":\"fill-blank\",\"question\":\"Tina: I _______ (visit) my grandparents. They live in Scotland now.\",\"answer\":\"have been visiting\",\"acceptedAnswers\":[\"have been visiting\",\"'ve been visiting\"],\"hints\":[\"Present perfect continuous: have been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Hiện tại hoàn thành tiếp diễn: \u003cstrong\u003ehave/has been + V-ing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'I' → \u003cstrong\u003ehave been visiting\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mình đã đi thăm ông bà.\"},{\"id\":10,\"type\":\"fill-blank\",\"question\":\"Cara: How long _______ (they live) there?\",\"answer\":\"have they been living\",\"acceptedAnswers\":[\"have they been living\"],\"hints\":[\"Question form: How long + have + subject + been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e 'How long' + hiện tại hoàn thành tiếp diễn để hỏi khoảng thời gian.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'they' → \u003cstrong\u003ehave they been living\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ông bà đã sống ở đó bao lâu rồi?\"},{\"id\":11,\"type\":\"fill-blank\",\"question\":\"Those carvings _______ (discover) by an Egyptian archaeologist.\",\"answer\":\"were discovered\",\"acceptedAnswers\":[\"were discovered\"],\"hints\":[\"Past simple passive: was/were + past participle\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Bị động quá khứ đơn: \u003cstrong\u003ewas/were + V3\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'carvings' số nhiều, hành động trong quá khứ → \u003cstrong\u003ewere discovered\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Những bức chạm khắc đó được một nhà khảo cổ Ai Cập phát hiện.\"},{\"id\":12,\"type\":\"fill-blank\",\"question\":\"The two buildings _______ (connect) by a tunnel.\",\"answer\":\"are connected\",\"acceptedAnswers\":[\"are connected\"],\"hints\":[\"Present simple passive: am/is/are + past participle\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Bị động hiện tại đơn: \u003cstrong\u003eam/is/are + V3\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'two buildings' số nhiều → \u003cstrong\u003eare connected\u003c/strong\u003e.\u003cb
