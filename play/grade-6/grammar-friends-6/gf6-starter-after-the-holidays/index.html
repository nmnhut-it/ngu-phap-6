003ch3 class=\"theory-panel__heading\"\u003e1 Thì Hiện Tại Đơn (Present Simple)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng để diễn tả thói quen, sự thật hiển nhiên, lịch trình cố định.\u003c/p\u003e\r\n\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Khẳng định: S + V(s/es) + O \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003eShe \u003cstrong\u003eplays\u003c/strong\u003e tennis every day.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Phủ định: S + don't/doesn't + V + O \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003eHe \u003cstrong\u003edoesn't like\u003c/strong\u003e coffee.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Nghi vấn: Do/Does + S + V + O? \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003e\u003cstrong\u003eDo\u003c/strong\u003e you \u003cstrong\u003espeak\u003c/strong\u003e English?\u003c/em\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ Bobby \u003cstrong\u003ealways plays\u003c/strong\u003e in the school football team.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Bobby luôn chơi trong đội bóng đá của trường.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ The sun \u003cstrong\u003erises\u003c/strong\u003e in the east.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Mặt trời mọc ở phía đông — sự thật.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ My family \u003cstrong\u003erecycles\u003c/strong\u003e rubbish every week.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Gia đình tôi tái chế rác mỗi tuần — thói quen.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e\u003cbr\u003e\r\n            always, usually, often, sometimes, never, every day/week/month, on Mondays, twice a week\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lưu ý thêm -s/-es:\u003c/strong\u003e\u003cbr\u003e\r\n            • He/She/It + V\u003cstrong\u003es\u003c/strong\u003e: He play\u003cstrong\u003es\u003c/strong\u003e, she go\u003cstrong\u003ees\u003c/strong\u003e, it work\u003cstrong\u003es\u003c/strong\u003e\u003cbr\u003e\r\n            • Động từ tận cùng -s, -sh, -ch, -x, -o → thêm \u003cstrong\u003e-es\u003c/strong\u003e: watches, goes, misses\u003cbr\u003e\r\n            • Động từ tận cùng phụ âm + y → đổi y thành \u003cstrong\u003e-ies\u003c/strong\u003e: studies, carries\u003cbr\u003e\r\n            He play tennis. → He play\u003cstrong\u003es\u003c/strong\u003e tennis.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Present Continuous --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 Thì Hiện Tại Tiếp Diễn (Present Continuous)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng để diễn tả hành động đang xảy ra ngay lúc nói, hoặc tình huống tạm thời.\u003c/p\u003e\r\n\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Khẳng định: S + am/is/are + V-ing + O \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003eShe \u003cstrong\u003eis reading\u003c/strong\u003e a book.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Phủ định: S + am/is/are + not + V-ing \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003eHe \u003cstrong\u003eisn't sleeping\u003c/strong\u003e.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Nghi vấn: Am/Is/Are + S + V-ing? \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003e\u003cstrong\u003eAre\u003c/strong\u003e you \u003cstrong\u003elistening\u003c/strong\u003e?\u003c/em\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ Julia\u003cstrong\u003e's listening\u003c/strong\u003e to her new MP3 player.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Julia đang nghe máy nghe nhạc MP3 mới.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ Look! It \u003cstrong\u003eis raining\u003c/strong\u003e outside.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nhìn kìa! Trời đang mưa bên ngoài.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ Our cousins \u003cstrong\u003eare staying\u003c/strong\u003e with us at the moment.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Anh chị em họ đang ở cùng chúng tôi lúc này — tạm thời.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e\u003cbr\u003e\r\n            now, right now, at the moment, at present, Look!, Listen!, today, this week\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Quy tắc thêm -ing:\u003c/strong\u003e\u003cbr\u003e\r\n            • Thông thường: play → play\u003cstrong\u003eing\u003c/strong\u003e, read → read\u003cstrong\u003eing\u003c/strong\u003e\u003cbr\u003e\r\n            • Bỏ -e cuối: make → mak\u003cstrong\u003eing\u003c/strong\u003e, write → writ\u003cstrong\u003eing\u003c/strong\u003e\u003cbr\u003e\r\n            • Gấp đôi phụ âm cuối (1 nguyên âm + 1 phụ âm): run → ru\u003cstrong\u003enn\u003c/strong\u003eing, swim → swi\u003cstrong\u003emm\u003c/strong\u003eing, sit → si\u003cstrong\u003ett\u003c/strong\u003eing\u003cbr\u003e\r\n            • -ie → -ying: die → d\u003cstrong\u003eying\u003c/strong\u003e, lie → l\u003cstrong\u003eying\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Present Simple vs Continuous --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 Phân Biệt: Present Simple vs Present Continuous\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e So sánh nhanh:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePresent Simple (thói quen, lặp lại):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ He \u003cstrong\u003eplays\u003c/strong\u003e football every Saturday.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Anh ấy chơi bóng đá mỗi thứ Bảy.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePresent Continuous (đang xảy ra):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ He \u003cstrong\u003eis playing\u003c/strong\u003e football right now.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Anh ấy đang chơi bóng đá ngay bây giờ.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\" style=\"margin-top: 1rem;\"\u003e\r\n            \u003cstrong\u003eThêm ví dụ phân biệt:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003eusually walk\u003c/strong\u003e to school. (thói quen → Simple)\u003cbr\u003e\r\n            ✓ Today I \u003cstrong\u003eam walking\u003c/strong\u003e to school. (hôm nay, tạm thời → Continuous)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003edoesn't eat\u003c/strong\u003e meat. (sự thật → Simple)\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003eisn't eating\u003c/strong\u003e anything now. (ngay lúc này → Continuous)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Động từ KHÔNG dùng thì tiếp diễn (Stative verbs):\u003c/strong\u003e\u003cbr\u003e\r\n            know, like, love, hate, want, need, believe, understand, remember, belong, prefer\u003cbr\u003e\r\n            I \u003cstrong\u003eam knowing\u003c/strong\u003e the answer. → I \u003cstrong\u003eknow\u003c/strong\u003e the answer.\u003cbr\u003e\r\n            She \u003cstrong\u003eis liking\u003c/strong\u003e chocolate. → She \u003cstrong\u003elikes\u003c/strong\u003e chocolate.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Past Simple --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 Thì Quá Khứ Đơn (Past Simple)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng để diễn tả hành động đã hoàn thành trong quá khứ, có thời gian xác định.\u003c/p\u003e\r\n\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Khẳng định: S + V2/V-ed + O \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003eI \u003cstrong\u003evisited\u003c/strong\u003e my grandma yesterday.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Phủ định: S + didn't + V + O \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003eShe \u003cstrong\u003edidn't go\u003c/strong\u003e to school.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Nghi vấn: Did + S + V + O? \u0026nbsp;\u0026nbsp;→\u0026nbsp;\u0026nbsp; \u003cem\u003e\u003cstrong\u003eDid\u003c/strong\u003e you \u003cstrong\u003esee\u003c/strong\u003e the film?\u003c/em\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ We \u003cstrong\u003ewent\u003c/strong\u003e snorkelling last summer.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Chúng tôi đi lặn biển mùa hè trước.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003eheard\u003c/strong\u003e about your accident yesterday.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Tôi nghe về tai nạn của bạn hôm qua.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003edidn't play\u003c/strong\u003e tennis last week.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy không chơi tennis tuần trước.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e\u003cbr\u003e\r\n            yesterday, last week/month/year, ago, in 2020, when I was young, then, at that time\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Past Continuous --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Thì Quá Khứ Tiếp Diễn (Past Continuous)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng để diễn tả hành động đang diễn ra tại một thời điểm trong quá khứ, hoặc hành động đang xảy ra thì bị ngắt bởi hành động khác.\u003c/p\u003e\r\n\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cp\u003e✓ Khẳng định: S + was/were + V-ing + O\u003c/p\u003e\r\n          \u003cp\u003e✓ Phủ định: S + was/were + not + V-ing\u003c/p\u003e\r\n          \u003cp\u003e✓ Nghi vấn: Was/Were + S + V-ing?\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ Ryan \u003cstrong\u003ewas swimming\u003c/strong\u003e when he \u003cstrong\u003esaw\u003c/strong\u003e a turtle.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Ryan đang bơi thì anh ấy nhìn thấy một con rùa.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003ewas choosing\u003c/strong\u003e a bracelet when Mum \u003cstrong\u003ecame\u003c/strong\u003e into the shop.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Tôi đang chọn vòng tay thì Mẹ bước vào cửa hàng.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ At 8 o'clock last night, they \u003cstrong\u003ewere watching\u003c/strong\u003e TV.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Lúc 8 giờ tối qua, họ đang xem TV.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Công thức quan trọng:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePast Continuous + WHEN + Past Simple\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003ewas walking\u003c/strong\u003e to school \u003cstrong\u003ewhen\u003c/strong\u003e it \u003cstrong\u003estarted\u003c/strong\u003e to rain.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Hành động dài: was walking | Hành động ngắt: started)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eWHILE + Past Continuous, Past Simple\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWhile\u003c/strong\u003e she \u003cstrong\u003ewas cooking\u003c/strong\u003e, the phone \u003cstrong\u003erang\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Trong khi cô ấy đang nấu ăn, điện thoại reo.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e\u003cbr\u003e\r\n            when (khi), while (trong khi), at that time, at 8 o'clock yesterday, as\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Past Forms --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Dạng Quá Khứ: Động Từ Có Quy Tắc \u0026 Bất Quy Tắc\u003c/h3\u003e\r\n\r\n          \u003cp\u003e\u003cstrong\u003eĐộng từ có quy tắc (Regular verbs):\u003c/strong\u003e Thêm \u003cstrong\u003e-ed\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Quy tắc thêm -ed:\u003c/strong\u003e\u003cbr\u003e\r\n            • Thông thường: play → play\u003cstrong\u003eed\u003c/strong\u003e, walk → walk\u003cstrong\u003eed\u003c/strong\u003e, start → start\u003cstrong\u003eed\u003c/strong\u003e\u003cbr\u003e\r\n            • Tận cùng -e: live → liv\u003cstrong\u003eed\u003c/strong\u003e, dance → danc\u003cstrong\u003eed\u003c/strong\u003e\u003cbr\u003e\r\n            • Tận cùng phụ âm + y: study → stud\u003cstrong\u003eied\u003c/strong\u003e, carry → carr\u003cstrong\u003eied\u003c/strong\u003e\u003cbr\u003e\r\n            • 1 nguyên âm + 1 phụ âm cuối: stop → sto\u003cstrong\u003epp\u003c/strong\u003eed, plan → pla\u003cstrong\u003enn\u003c/strong\u003eed\r\n          \u003c/div\u003e\r\n\r\n          \u003cp style=\"margin-top: 1rem;\"\u003e\u003cstrong\u003eĐộng từ bất quy tắc (Irregular verbs):\u003c/strong\u003e Phải nhớ!\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eBảng động từ bất quy tắc thường gặp:\u003c/strong\u003e\u003cbr\u003e\r\n            go → \u003cstrong\u003ewent\u003c/strong\u003e → gone \u0026nbsp;|\u0026nbsp; see → \u003cstrong\u003esaw\u003c/strong\u003e → seen\u003cbr\u003e\r\n            come → \u003cstrong\u003ecame\u003c/strong\u003e → come \u0026nbsp;|\u0026nbsp; do → \u003cstrong\u003edid\u003c/strong\u003e → done\u003cbr\u003e\r\n            make → \u003cstrong\u003emade\u003c/strong\u003e → made \u0026nbsp;|\u0026nbsp; take → \u003cstrong\u003etook\u003c/strong\u003e → taken\u003cbr\u003e\r\n            fly → \u003cstrong\u003eflew\u003c/strong\u003e → flown \u0026nbsp;|\u0026nbsp; swim → \u003cstrong\u003eswam\u003c/strong\u003e → swum\u003cbr\u003e\r\n            find → \u003cstrong\u003efound\u003c/strong\u003e → found \u0026nbsp;|\u0026nbsp; break → \u003cstrong\u003ebroke\u003c/strong\u003e → broken\u003cbr\u003e\r\n            read → \u003cstrong\u003eread\u003c/strong\u003e → read \u0026nbsp;|\u0026nbsp; put → \u003cstrong\u003eput\u003c/strong\u003e → put\u003cbr\u003e\r\n            send → \u003cstrong\u003esent\u003c/strong\u003e → sent \u0026nbsp;|\u0026nbsp; hear → \u003cstrong\u003eheard\u003c/strong\u003e → heard\u003cbr\u003e\r\n            fall → \u003cstrong\u003efell\u003c/strong\u003e → fallen \u0026nbsp;|\u0026nbsp; write → \u003cstrong\u003ewrote\u003c/strong\u003e → written\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi thường gặp:\u003c/strong\u003e\u003cbr\u003e\r\n            He \u003cstrong\u003egoed\u003c/strong\u003e to school. → He \u003cstrong\u003ewent\u003c/strong\u003e to school.\u003cbr\u003e\r\n            She \u003cstrong\u003ereaded\u003c/strong\u003e a book. → She \u003cstrong\u003eread\u003c/strong\u003e a book.\u003cbr\u003e\r\n            I \u003cstrong\u003efalled\u003c/strong\u003e down. → I \u003cstrong\u003efell\u003c/strong\u003e down.\u003cbr\u003e\r\n            They \u003cstrong\u003etaked\u003c/strong\u003e photos. → They \u003cstrong\u003etook\u003c/strong\u003e photos.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-starter-after-the-holidays\",\"title\":\"Starter: After the Holidays - Present \u0026 Past Tenses\",\"grammarTopics\":[\"Present Simple and Present Continuous\",\"Past Simple and Past Continuous\",\"Past Forms (Regular and Irregular Verbs)\"],\"theory\":{\"brief\":\"Present simple: thói quen, sự thật. Present continuous: đang xảy ra. Past simple: hoàn thành. Past continuous: đang diễn ra bị ngắt.\",\"rules\":[\"PRESENT SIMPLE: S + V(s/es) — always, usually, often, every day\",\"PRESENT CONTINUOUS: S + am/is/are + V-ing — now, at the moment\",\"PAST SIMPLE: S + V-ed / V2 — yesterday, last week, ago\",\"PAST CONTINUOUS: S + was/were + V-ing — while, when\"]},\"exercises\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"She _______ to school every day.\",\"options\":[\"goes\",\"is going\",\"go\",\"going\"],\"correctIndex\":0,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại đơn diễn tả một hành động lặp đi lặp lại hoặc thói quen hằng ngày.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu có trạng từ chỉ tần suất \\\"every day\\\" (mỗi ngày) và chủ ngữ \\\"She\\\" là ngôi thứ ba số ít nên động từ \\\"go\\\" thêm \\\"-es\\\" thành \\\"goes\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đi học mỗi ngày.\",\"points\":10},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"Look! The children _______ in the park.\",\"options\":[\"play\",\"plays\",\"are playing\",\"is playing\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại tiếp diễn diễn tả hành động đang xảy ra ngay tại thời điểm nói.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ nhận biết \\\"Look!\\\" (Nhìn kìa!) yêu cầu dùng thì hiện tại tiếp diễn. Chủ ngữ số nhiều \\\"The children\\\" đi với \\\"are playing\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nhìn kìa! Bọn trẻ đang chơi trong công viên.\",\"points\":10},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"My dad _______ coffee every morning.\",\"options\":[\"drinks\",\"is drinking\",\"drink\",\"drinking\"],\"correctIndex\":0,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại đơn dùng để chỉ một thói quen ở hiện tại.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \\\"every morning\\\" (mỗi sáng) chỉ thói quen và chủ ngữ \\\"My dad\\\" số ít nên ta dùng động từ thêm \\\"-s\\\" là \\\"drinks\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bố của thầy uống cà phê mỗi sáng.\",\"points\":10},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"Be quiet! The baby _______ right now.\",\"options\":[\"sleeps\",\"is sleeping\",\"sleep\",\"sleeping\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại tiếp diễn diễn tả hành động đang diễn ra ngay lúc nói.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm từ \\\"Be quiet!\\\" (Hãy yên lặng!) và \\\"right now\\\" (ngay bây giờ) chỉ hành động đang xảy ra. Chủ ngữ số ít \\\"The baby\\\" đi với \\\"is sleeping\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Hãy yên lặng nào! Em bé đang ngủ ngay lúc này.\",\"points\":10},{\"id\":5,\"type\":\"multiple-choice\",\"question\":\"Water _______ at 100 degrees Celsius.\",\"options\":[\"boils\",\"is boiling\",\"boil\",\"are boiling\"],\"correctIndex\":0,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại đơn diễn tả một sự thật hiển nhiên hoặc chân lý khoa học.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Sự thật nước sôi ở 100 độ C luôn đúng. Chủ ngữ không đếm được \\\"Water\\\" đóng vai trò số ít nên ta chia động từ là \\\"boils\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nước sôi ở 100 độ C.\",\"points\":10},{\"id\":6,\"type\":\"multiple-choice\",\"question\":\"I _______ my homework at the moment.\",\"options\":[\"do\",\"does\",\"am doing\",\"is doing\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại tiếp diễn diễn tả hành động đang thực hiện lúc nói.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm từ \\\"at the moment\\\" (ngay lúc này) chỉ hành động đang diễn ra. Chủ ngữ \\\"I\\\" đi với cấu trúc \\\"am + V-ing\\\" thành \\\"am doing\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Thầy đang làm bài tập về nhà của mình vào lúc này.\",\"points\":10},{\"id\":7,\"type\":\"multiple-choice\",\"question\":\"Tom never _______ breakfast.\",\"options\":[\"eat\",\"eats\",\"is eating\",\"eating\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại đơn dùng với trạng từ chỉ tần suất để diễn tả thói quen.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ nhận biết \\\"never\\\" (không bao giờ) chỉ thói quen ở hiện tại. Chủ ngữ số ít \\\"Tom\\\" đi với động từ chia số ít \\\"eats\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tom không bao giờ ăn sáng.\",\"points\":10},{\"id\":8,\"type\":\"multiple-choice\",\"question\":\"Listen! Someone _______ the piano.\",\"options\":[\"plays\",\"play\",\"is playing\",\"are playing\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại tiếp diễn diễn tả hành động đang xảy ra ngay lúc nói.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ nhận biết \\\"Listen!\\\" (Nghe kìa!) chỉ hành động đang diễn ra. Đại từ bất định \\\"Someone\\\" (Ai đó) là số ít nên đi với \\\"is playing\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nghe kìa! Ai đó đang chơi đàn piano.\",\"points\":10},{\"id\":9,\"type\":\"multiple-choice\",\"question\":\"The sun _______ in the east.\",\"options\":[\"rise\",\"rises\",\"is rising\",\"are rising\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại đơn dùng để chỉ một chân lý hiển nhiên hoặc hiện tượng tự nhiên.\u003cbr\u003e\u003 ":191,\"type\":\"sentence-build\",\"prompt\":\"she / usually / get up / 7 a.m.\",\"instructions\":\"Present simple sentence.\",\"answer\":\"She usually gets up at 7 a.m.\",\"acceptedAnswers\":[\"She usually gets up at 7 a.m.\",\"She usually gets up at 7 a.m\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu khẳng định hiện tại đơn chỉ thói quen với trạng từ chỉ tần suất đứng trước động từ chính và thêm giới từ \\\"at\\\" trước giờ giấc.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Sắp xếp các từ theo trật tự: Chủ ngữ \\\"She\\\" + trạng từ \\\"usually\\\" + động từ số ít \\\"gets up\\\" + giới từ \\\"at\\\" + giờ \\\"7 a.m.\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy thường thức dậy vào lúc 7 giờ sáng.\",\"points\":10},{\"id\":192,\"type\":\"sentence-build\",\"prompt\":\"they / play / football / now\",\"instructions\":\"Present continuous sentence.\",\"answer\":\"They are playing football now.\",\"acceptedAnswers\":[\"They are playing football now.\",\"They are playing football now\",\"They're playing football now.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cấu trúc khẳng định hiện tại tiếp diễn chỉ hành động đang xảy ra: S + am/is/are + V-ing + trạng từ thời gian.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Sắp xếp các từ: Chủ ngữ \\\"They\\\" + trợ động từ \\\"are\\\" + động từ tiếp diễn \\\"playing\\\" + tân ngữ \\\"football\\\" + trạng từ \\\"now\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bây giờ họ đang chơi bóng đá.\",\"points\":10},{\"id\":193,\"type\":\"sentence-build\",\"prompt\":\"I / walk / to school / when / it / start / rain\",\"instructions\":\"Past continuous + past simple.\",\"answer\":\"I was walking to school when it started to rain.\",\"acceptedAnswers\":[\"I was walking to school when it started to rain.\",\"I was walking to school when it started to rain\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Hành động đang xảy ra trong quá khứ (quá khứ tiếp diễn) thì có một hành động khác xen ngang (quá khứ đơn).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Lắp ghép mệnh đề tiếp diễn \\\"I was walking to school\\\" kết hợp mệnh đề xen ngang \\\"when it started to rain\\\" (sau start dùng to V).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Thầy đang đi bộ đến trường thì trời bắt đầu đổ mưa.\",\"points\":10},{\"id\":194,\"type\":\"sentence-build\",\"prompt\":\"he / go / Paris / last summer\",\"instructions\":\"Past simple sentence.\",\"answer\":\"He went to Paris last summer.\",\"acceptedAnswers\":[\"He went to Paris last summer.\",\"He went to Paris last summer\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu khẳng định quá khứ đơn diễn tả chuyến đi đã thực hiện, sử dụng giới từ chỉ hướng đến \\\"to\\\" trước địa điểm.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \\\"last summer\\\" yêu cầu dùng quá khứ đơn. Chủ ngữ \\\"He\\\" + động từ bất quy tắc \\\"went\\\" + giới từ \\\"to\\\" + địa danh \\\"Paris\\\" + thời gian.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy đã đi Paris vào mùa hè năm ngoái.\",\"points\":10},{\"id\":195,\"type\":\"sentence-build\",\"prompt\":\"we / not / watch / TV / every day\",\"instructions\":\"Negative present simple.\",\"answer\":\"We don't watch TV every day.\",\"acceptedAnswers\":[\"We don't watch TV every day.\",\"We don't watch TV every day\",\"We do not watch TV every day.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cấu trúc câu phủ định hiện tại đơn chỉ thói quen hằng ngày: S + don't/doesn't + V nguyên mẫu + trạng từ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \\\"every day\\\" yêu cầu dùng hiện tại đơn. Chủ ngữ \\\"We\\\" đi với trợ động từ phủ định \\\"don't\\\" + động từ nguyên mẫu \\\"watch\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi không xem truyền hình mỗi ngày.\",\"points\":10},{\"id\":196,\"type\":\"sentence-build\",\"prompt\":\"she / read / a book / at the moment\",\"instructions\":\"Present continuous sentence.\",\"answer\":\"She is reading a book at the moment.\",\"acceptedAnswers\":[\"She is reading a book at the moment.\",\"She is reading a book at the moment\",\"She's reading a book at the moment.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cấu trúc câu khẳng định thì hiện tại tiếp diễn diễn tả hoạt động đọc sách đang xảy ra tại thời điểm nói.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Dấu hiệu \\\"at the moment\\\" yêu cầu chia tiếp diễn. Chủ ngữ số ít \\\"She\\\" + \\\"is reading\\\" + tân ngữ \\\"a book\\\" + cụm từ thời gian.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đang đọc một cuốn sách vào lúc này.\",\"points\":10},{\"id\":197,\"type\":\"sentence-build\",\"prompt\":\"while / mum / cook / dad / arrive\",\"instructions\":\"Past continuous + past simple.\",\"answer\":\"While mum was cooking, dad arrived.\",\"acceptedAnswers\":[\"While mum was cooking, dad arrived.\",\"While Mum was cooking, Dad arrived.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \\\"While\\\" dẫn đầu mệnh đề quá khứ tiếp diễn chỉ hành động đang xảy ra, mệnh đề còn lại dùng quá khứ đơn chỉ hành động xen vào.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Lắp ghép mệnh đề tiếp diễn \\\"While mum was cooking\\\" và mệnh đề xen vào ở quá khứ đơn \\\"dad arrived\\\", ngăn cách bởi dấu phẩy.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Trong khi mẹ đang nấu ăn thì bố về đến nhà.\",\"points\":10},{\"id\":198,\"type\":\"sentence-build\",\"prompt\":\"they / not / come / party / last night\",\"instructions\":\"Negative past simple.\",\"answer\":\"They didn't come to the party last night.\",\"acceptedAnswers\":[\"They didn't come to the party last night.\",\"They didn't come to the party last night\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cấu trúc câu phủ định quá khứ đơn: S + didn't + V nguyên mẫu, sử dụng giới từ chỉ đích đến \\\"to\\\" trước danh từ có \\\"the\\\".\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \\\"last night\\\" chỉ quá khứ đơn. Sắp xếp: Chủ ngữ \\\"They\\\" + trợ động từ phủ định \\\"didn't\\\" + động từ \\\"come\\\" + \\\"to the party\\\" + thời gian.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ đã không đến dự bữa tiệc vào tối hôm qua.\",\"points\":10},{\"id\":199,\"type\":\"sentence-build\",\"prompt\":\"the sun / shine / birds / sing\",\"instructions\":\"Describe past scene (past continuous).\",\"answer\":\"The sun was shining and the birds were singing.\",\"acceptedAnswers\":[\"The sun was shining and the birds were singing.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ tiếp diễn cho cả hai hành động xảy ra song song để miêu tả, tạo bối cảnh cho câu chuyện.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cả hai sự việc chiếu sáng (\\\"was shining\\\") và hót vang (\\\"were singing\\\") diễn ra song song làm bối cảnh, kết nối bằng liên từ \\\"and\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mặt trời đang chiếu sáng và bầy chim đang hót vang.\",\"points\":10},{\"id\":200,\"type\":\"sentence-build\",\"prompt\":\"I / not / understand / this question\",\"instructions\":\"Negative present simple.\",\"answer\":\"I don't understand this question.\",\"acceptedAnswers\":[\"I don't understand this question.\",\"I don't understand this question\",\"I do not understand this question.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Động từ tri thức \\\"understand\\\" không dùng ở các thì tiếp diễn, câu phủ định ở hiện tại đơn dùng trợ động từ don't.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng thái không hiểu câu hỏi. Chủ ngữ \\\"I\\\" đi với trợ động từ phủ định \\\"don't\\\" và động từ nguyên mẫu \\\"understand\\\".\u003cbr
