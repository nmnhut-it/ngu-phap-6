  \u003ch3 class=\"theory-panel__heading\"\u003e1 Câu Điều Kiện Loại 3 — Cấu Trúc\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCông thức:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin: 0.5rem 0; border-radius: 4px; text-align: center; font-size: 1.1em;\"\u003e\r\n            \u003cstrong\u003eIf + S + had + past participle (PP), S + would/wouldn't have + PP\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ If it \u003cstrong\u003ehad rained\u003c/strong\u003e, we \u003cstrong\u003ewould have taken\u003c/strong\u003e the bus.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu trời đã mưa, chúng tôi đã đi xe buýt.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If you \u003cstrong\u003ehad arrived\u003c/strong\u003e earlier, you \u003cstrong\u003ewould have met\u003c/strong\u003e Joe.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu bạn đã đến sớm hơn, bạn đã gặp Joe.)\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Viết tắt:\u003c/strong\u003e \u003cstrong\u003e'd\u003c/strong\u003e có thể = \u003cstrong\u003ehad\u003c/strong\u003e (mệnh đề if) hoặc \u003cstrong\u003ewould\u003c/strong\u003e (mệnh đề kết quả)\u003cbr\u003e\r\n            ✓ If you\u003cstrong\u003e'd\u003c/strong\u003e arrived = If you \u003cstrong\u003ehad\u003c/strong\u003e arrived\u003cbr\u003e\r\n            ✓ We\u003cstrong\u003e'd\u003c/strong\u003e have taken = We \u003cstrong\u003ewould\u003c/strong\u003e have taken\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Usage --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 Khi Nào Dùng — Tình Huống Tưởng Tượng Trong Quá Khứ\u003c/h3\u003e\r\n          \u003cp\u003eDùng để nói về điều \u003cstrong\u003eđã KHÔNG xảy ra\u003c/strong\u003e trong quá khứ và tưởng tượng kết quả nếu nó đã xảy ra.\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eThực tế:\u003c/strong\u003e I didn't study. I failed. (Tôi không học. Tôi trượt.)\u003cbr\u003e\r\n            \u003cstrong\u003eTưởng tượng:\u003c/strong\u003e If I \u003cstrong\u003ehad studied\u003c/strong\u003e, I \u003cstrong\u003ewould have passed\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu tôi đã học, tôi đã đậu.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eThực tế:\u003c/strong\u003e She didn't bring a map. She got lost.\u003cbr\u003e\r\n            \u003cstrong\u003eTưởng tượng:\u003c/strong\u003e If she \u003cstrong\u003ehad brought\u003c/strong\u003e a map, she \u003cstrong\u003ewouldn't have got\u003c/strong\u003e lost.\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Quan trọng:\u003c/strong\u003e Third conditional = quá khứ \u003cstrong\u003eKHÔNG CÓ THẬT\u003c/strong\u003e.\u003cbr\u003e\r\n            Nó KHÔNG thay đổi được quá khứ — chỉ tưởng tượng!\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Changing clause order --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 Đảo Mệnh Đề — Linh Hoạt Thứ Tự\u003c/h3\u003e\r\n          \u003cp\u003eCó thể đặt mệnh đề \u003cstrong\u003ewould\u003c/strong\u003e trước, mệnh đề \u003cstrong\u003eif\u003c/strong\u003e sau (không cần dấu phẩy):\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ \u003cstrong\u003eIf I had known\u003c/strong\u003e, I would have told you. (If trước → có dấu phẩy)\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003ewould have told\u003c/strong\u003e you \u003cstrong\u003eif I had known\u003c/strong\u003e. (If sau → không dấu phẩy)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eIf they hadn't found\u003c/strong\u003e the treasure, they wouldn't have been rich.\u003cbr\u003e\r\n            ✓ They \u003cstrong\u003ewouldn't have been\u003c/strong\u003e rich \u003cstrong\u003eif they hadn't found\u003c/strong\u003e the treasure.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: must --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 MUST — Quy Tắc / Bắt Buộc\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eNghĩa:\u003c/strong\u003e Phải làm — đó là quy tắc, luật lệ, hoặc nghĩa vụ mạnh.\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ You \u003cstrong\u003emust\u003c/strong\u003e wear a helmet. (Bạn phải đội mũ bảo hiểm.)\u003cbr\u003e\r\n            ✓ You \u003cstrong\u003emust\u003c/strong\u003e listen to your instructor. (Bạn phải lắng nghe hướng dẫn viên.)\u003cbr\u003e\r\n            ✓ Everyone \u003cstrong\u003emust\u003c/strong\u003e follow the safety rules. (Mọi người phải tuân theo quy tắc an toàn.)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: mustn't vs don't have to --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 MUSTN'T vs DON'T HAVE TO — Cấm vs Không Cần\u003c/h3\u003e\r\n          \u003cdiv style=\"display: flex; gap: 1rem; flex-wrap: wrap;\"\u003e\r\n            \u003cdiv style=\"flex: 1; min-width: 250px; background: #f8d7da; padding: 0.8rem; border-radius: 4px;\"\u003e\r\n              \u003cstrong\u003e MUSTN'T = CẤM (prohibition)\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n              ✓ You \u003cstrong\u003emustn't\u003c/strong\u003e swim here. (Cấm bơi ở đây.)\u003cbr\u003e\r\n              ✓ You \u003cstrong\u003emustn't\u003c/strong\u003e touch the exhibits.\u003cbr\u003e\r\n              → Nếu làm = vi phạm / nguy hiểm!\r\n            \u003c/div\u003e\r\n            \u003cdiv style=\"flex: 1; min-width: 250px; background: #d4edda; padding: 0.8rem; border-radius: 4px;\"\u003e\r\n              \u003cstrong\u003e DON'T HAVE TO = KHÔNG CẦN (no obligation)\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n              ✓ You \u003cstrong\u003edon't have to\u003c/strong\u003e cook. (Không cần nấu ăn.)\u003cbr\u003e\r\n              ✓ You \u003cstrong\u003edon't have to\u003c/strong\u003e pay. (Không cần trả tiền.)\u003cbr\u003e\r\n              → Có thể làm hoặc không — tùy bạn!\r\n            \u003c/div\u003e\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e\u003cbr\u003e\r\n            mustn't = \u003cstrong\u003eSTOP! Don't do it!\u003c/strong\u003e (cấm!)\u003cbr\u003e\r\n            don't have to = \u003cstrong\u003eIt's OK, you can choose.\u003c/strong\u003e (không bắt buộc)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: should/shouldn't --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 SHOULD / SHOULDN'T — Lời Khuyên\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eNghĩa:\u003c/strong\u003e Nên / không nên — đưa ra lời khuyên, gợi ý.\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ You \u003cstrong\u003eshould\u003c/strong\u003e drink more water. (Bạn nên uống nhiều nước.)\u003cbr\u003e\r\n            ✓ You \u003cstrong\u003eshouldn't\u003c/strong\u003e stay up so late. (Bạn không nên thức khuya.)\u003cbr\u003e\r\n            ✓ You \u003cstrong\u003eshould\u003c/strong\u003e see a doctor. (Bạn nên đi khám bác sĩ.)\u003cbr\u003e\r\n            ✓ You \u003cstrong\u003eshouldn't\u003c/strong\u003e eat so much sugar. (Bạn không nên ăn nhiều đường.)\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e So sánh nhanh:\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eshould\u003c/strong\u003e = lời khuyên nhẹ nhàng (advice)\u003cbr\u003e\r\n            \u003cstrong\u003emust\u003c/strong\u003e = bắt buộc mạnh (rule/obligation)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: have to --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 HAVE TO — Nghĩa Vụ Từ Bên Ngoài\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eNghĩa:\u003c/strong\u003e Phải làm — vì ai đó/quy tắc bên ngoài yêu cầu.\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ I \u003cstrong\u003ehave to\u003c/strong\u003e finish my homework. (Giáo viên yêu cầu.)\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003ehas to\u003c/strong\u003e wear a uniform. (Trường yêu cầu.)\u003cbr\u003e\r\n            ✓ He \u003cstrong\u003ehas to\u003c/strong\u003e take medicine three times a day. (Bác sĩ kê đơn.)\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lưu ý:\u003c/strong\u003e \u003cstrong\u003ehave to\u003c/strong\u003e chia theo chủ ngữ:\u003cbr\u003e\r\n            I/You/We/They \u003cstrong\u003ehave to\u003c/strong\u003e ...\u003cbr\u003e\r\n            He/She/It \u003cstrong\u003ehas to\u003c/strong\u003e ...\u003cbr\u003e\r\n            Phủ định: \u003cstrong\u003edon't/doesn't have to\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 8: Comparison Table --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e8 Bảng So Sánh: must vs have to vs should\u003c/h3\u003e\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px; border: 1px solid #ddd;\"\u003eModal\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px; border: 1px solid #ddd;\"\u003eNghĩa\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px; border: 1px solid #ddd;\"\u003eMức độ\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px; border: 1px solid #ddd;\"\u003eVí dụ\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003e\u003cstrong\u003emust\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eQuy tắc / bắt buộc (nội tại)\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eMạnh nhất\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eYou must wear a helmet.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003e\u003cstrong\u003emustn't\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eCẤM\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eMạnh nhất\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eYou mustn't swim here.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003e\u003cstrong\u003ehave to\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eCần thiết (bên ngoài yêu cầu)\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eMạnh\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eI have to finish by Friday.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003e\u003cstrong\u003edon't have to\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eKHÔNG CẦN\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eNhẹ\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eYou don't have to pay.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003e\u003cstrong\u003eshould\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eNên (lời khuyên)\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eNhẹ\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eYou should drink water.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003e\u003cstrong\u003eshouldn't\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eKhông nên (khuyên)\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eNhẹ\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px; border: 1px solid #ddd;\"\u003eYou shouldn't stay up late.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 9: Common Mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e9 Lỗi Thường Gặp\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-bottom: 0.8rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eLỗi 1: Dùng 'would' trong mệnh đề if\u003c/strong\u003e\u003cbr\u003e\r\n            If I \u003cstrong\u003ewould have\u003c/strong\u003e studied harder, I would have passed.\u003cbr\u003e\r\n            If I \u003cstrong\u003ehad\u003c/strong\u003e studied harder, I would have passed.\u003cbr\u003e\r\n            \u003cem\u003e→ Mệnh đề if KHÔNG BAO GIỜ dùng 'would'!\u003c/em\u003e\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-bottom: 0.8rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eLỗi 2: Dùng past simple thay vì past participle\u003c/strong\u003e\u003cbr\u003e\r\n            If she had \u003cstrong\u003eknew\u003c/strong\u003e ...\u003cbr\u003e\r\n            If she had \u003cstrong\u003eknown\u003c/strong\u003e ...\u003cbr\u003e\r\n            \u003cem\u003e→ Sau 'had' phải là V3 (past participle), không phải V2!\u003c/em\u003e\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-bottom: 0.8rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eLỗi 3: Nhầm mustn't và don't have to\u003c/strong\u003e\u003cbr\u003e\r\n            You \u003cstrong\u003edon't have to\u003c/strong\u003e smoke here. (Sai nếu ý là CẤM)\u003cbr\u003e\r\n            You \u003cstrong\u003emustn't\u003c/strong\u003e smoke here. (Đúng: cấm hút thuốc)\u003cbr\u003e\r\n            \u003cem\u003e→ mustn't = CẤM, don't have to = KHÔNG CẦN\u003c/em\u003e\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-bottom: 0.8rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eLỗi 4: Thêm 'to' sau modal verb\u003c/strong\u003e\u003cbr\u003e\r\n            You \u003cstrong\u003emust to\u003c/strong\u003e arrive early. / You \u003cstrong\u003eshould to\u003c/strong\u003e drink water.\u003cbr\u003e\r\n            You \u003cstrong\u003emust\u003c/strong\u003e arrive early. / You \u003cstrong\u003eshould\u003c/strong\u003e drink water.\u003cbr\u003e\r\n            \u003cem\u003e→ Sau must/should/mustn't/shouldn't KHÔNG có 'to'!\u003c/em\u003e\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eLỗi 5: don't must / don't should\u003c/strong\u003e\u003cbr\u003e\r\n            You \u003cstrong\u003edon't must\u003c/strong\u003e run. / You \u003cstrong\u003edon't should\u003c/strong\u003e eat that.\u003cbr\u003e\r\n            You \u003cstrong\u003emustn't\u003c/strong\u003e run. / You \u003cstrong\u003eshouldn't\u003c/strong\u003e eat that.\u003cbr\u003e\r\n            \u003cem\u003e→ Modal verb phủ định: thêm 'not' vào modal, KHÔNG dùng 'don't'!\u003c/em\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-9-active-living\",\"title\":\"Unit 9: Active Living - Third Conditional \u0026 Modal Verbs\",\"grammarTopics\":[\"Third conditional\",\"Modal verbs: must/mustn't\",\"Modal verbs: should/shouldn't\",\"Modal verbs: have to/don't have to\"],\"theory\":{\"brief\":\"Third conditional: If + had + past participle, would/wouldn't have + past participle — dùng cho tình huống tưởng tượng trong quá khứ. Modal verbs: must (bắt buộc), mustn't (cấm), should/shouldn't (lời khuyên), have to (cần thiết), don't have to (không cần thiết).\",\"rules\":[\"Third conditional: If + had + PP, would/wouldn't have + PP — tình huống không xảy ra trong quá khứ\",\"Có thể đảo mệnh đề: Would have + PP + if + had + PP\",\"must: quy tắc, bắt buộc (You must wear a helmet.)\",\"mustn't: cấm, không được phép (You mustn't swim here.)\",\"have to: cần thiết từ bên ngoài (I have to finish my homework.)\",\"don't have to: không cần thiết (You don't have to pay.)\",\"should/shouldn't: lời khuyên (You should drink more water.)\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"If I had studied harder, I _______ (pass) the exam.\",\"answer\":\"would have passed\",\"acceptedAnswers\":[\"would have passed\",\"would've passed\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng khẳng định: \u003cstrong\u003ewould have + V3/V-ed\u003c/strong\u003e (would have passed).\u003cbr\u003eThực tế trong quá khứ: 'study harder' → điều không xảy ra trong quá khứ → kết quả tưởng tượng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu tôi đã học chăm hơn, tôi đã đậu kỳ thi rồi.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"If she had known about the party, she _______ (come).\",\"answer\":\"would have come\",\"acceptedAnswers\":[\"would have come\",\"would've come\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng khẳng định: \u003cstrong\u003ewould have + V3/V-ed\u003c/strong\u003e (would have come).\u003cbr\u003eThực tế trong quá khứ: Cô ấy không biết về bữa tiệc → không đến.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu cô ấy đã biết về bữa tiệc, cô ấy đã đến rồi.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"If we had left earlier, we _______ (not miss) the train.\",\"answer\":\"wouldn't have missed\",\"acceptedAnswers\":[\"wouldn't have missed\",\"would not have missed\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng phủ định: \u003cstrong\u003ewouldn't have + V3/V-ed\u003c/strong\u003e (wouldn't have missed).\u003cbr\u003eThực tế trong quá khứ: Chúng tôi không rời đi sớm → lỡ tàu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu chúng tôi đã rời đi sớm hơn, chúng tôi đã không lỡ tàu.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"If he had taken the map, he _______ (not get) lost.\",\"answer\":\"wouldn't have got\",\"acceptedAnswers\":[\"wouldn't have got\",\"wouldn't have gotten\",\"would not have got\",\"would not have gotten\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng phủ định: \u003cstrong\u003ewouldn't have + V3/V-ed\u003c/strong\u003e (wouldn't have got).\u003cbr\u003eThực tế trong quá khứ: Anh ấy không mang bản đồ → bị lạc.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu anh ấy đã mang bản đồ, anh ấy đã không bị lạc.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"If they had practised more, they _______ (win) the match.\",\"answer\":\"would have won\",\"acceptedAnswers\":[\"would have won\",\"would've won\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng khẳng định: \u003cstrong\u003ewould have + V3/V-ed\u003c/strong\u003e (would have won).\u003cbr\u003eThực tế trong quá khứ: Họ không luyện tập nhiều → không thắng trận đấu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu họ đã luyện tập nhiều hơn, họ đã thắng trận đấu.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":6,\"type\":\"fill-blank\",\"question\":\"If it had rained, we _______ (stay) at home.\",\"answer\":\"would have stayed\",\"acceptedAnswers\":[\"would have stayed\",\"would've stayed\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng khẳng định: \u003cstrong\u003ewould have + V3/V-ed\u003c/strong\u003e (would have stayed).\u003cbr\u003eThực tế trong quá khứ: Trời không mưa → chúng tôi không ở nhà\u003cbr\u003ewould have stayed = đã ở nhà (nhưng thực tế không).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu trời đã mưa, chúng tôi đã ở nhà.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":7,\"type\":\"fill-blank\",\"question\":\"If you had asked me, I _______ (help) you.\",\"answer\":\"would have helped\",\"acceptedAnswers\":[\"would have helped\",\"would've helped\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng khẳng định: \u003cstrong\u003ewould have + V3/V-ed\u003c/strong\u003e (would have helped).\u003cbr\u003eThực tế trong quá khứ: Bạn không hỏi → tôi không giúp\u003cbr\u003ewould have helped = đã giúp (tưởng tượng).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu bạn đã hỏi tôi, tôi đã giúp bạn.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":8,\"type\":\"fill-blank\",\"question\":\"If the weather had been nice, we _______ (go) to the beach.\",\"answer\":\"would have gone\",\"acceptedAnswers\":[\"would have gone\",\"would've gone\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng khẳng định: \u003cstrong\u003ewould have + V3/V-ed\u003c/strong\u003e (would have gone).\u003cbr\u003eThực tế trong quá khứ: Thời tiết không đẹp → không đi biển\u003cbr\u003ewould have gone = đã đi (tưởng tượng).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu thời tiết đã đẹp, chúng tôi đã đi biển.\",\"hints\":[\"Third conditional: would/wouldn't have + past participle\"],\"points\":10},{\"id\":9,\"type\":\"fill-blank\",\"question\":\"If I had seen the sign, I _______ (not enter) the building.\",\"answer\":\"wouldn't have entered\",\"acceptedAnswers\":[\"wouldn't have entered\",\"would not have entered\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 3 dùng để diễn tả một giả định không có thật trong quá khứ. Cấu trúc: If + S + had + V3/V-ed, S + would/could + have + V3/V-ed.\u003cbr\u003eMệnh đề chính (kết quả) cần chia ở dạng phủ địn nk: rule, prohibition, advice, or no obligation?\"],\"points\":10},{\"id\":136,\"type\":\"error-correct\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Trong mệnh đề \\\"If\\\" của câu điều kiện loại 3, ta dùng thì Quá khứ hoàn thành (had + V3/V-ed) chứ không dùng \\\"would/would have\\\".\u003cbr\u003eLỗi sai trong câu là dùng \u003cstrong\u003ewould have studied\u003c/strong\u003e, cần sửa lại thành \u003cstrong\u003ehad studied\u003c/strong\u003e.\u003cbr\u003eSAI: If I would have... → ĐÚNG: If I had....\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu tôi đã học chăm hơn, tôi đã đậu.\",\"hints\":[\"Find the grammar mistake and correct it\"],\"points\":10,\"wrongSentence\":\"If I would have studied harder, I would have passed.\",\"correctSentence\":\"If I had studied harder, I would have passed.\",\"errorWord\":\"would have studied\",\"correction\":\"had studied\"},{\"id\":137,\"type\":\"error-correct\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Đại từ bất định \\\"Everyone\\\" đi với động từ số ít, nên ta dùng \\\"has to\\\" chứ không dùng \\\"have to\\\".\u003cbr\u003eLỗi sai trong câu là dùng \u003cstrong\u003ehave\u003c/strong\u003e, cần sửa lại thành \u003cstrong\u003ehas\u003c/strong\u003e.\u003cbr\u003e'Everyone' là chủ ngữ số ít → dùng 'has to' không phải 'have to'\u003cbr\u003eSAI: Everyone have to → ĐÚNG: Everyone has to.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mọi người phải mang đồ ăn riêng.\",\"hints\":[\"Find the grammar mistake and correct it\"],\"points\":10,\"wrongSentence\":\"Everyone have to bring their own food.\",\"correctSentence\":\"Everyone has to bring their own food.\",\"errorWord\":\"have\",\"correction\":\"has\"},{\"id\":138,\"type\":\"error-correct\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thể phủ định của các động từ khuyết thiếu được thành lập bằng cách thêm \\\"not\\\" vào sau động từ đó (mustn't, shouldn't, oughtn't to) chứ không dùng trợ độn
