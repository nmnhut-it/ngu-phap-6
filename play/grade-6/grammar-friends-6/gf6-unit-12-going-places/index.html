panel__heading\"\u003e1 Wish + Past Simple — Ước Về Hiện Tại\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng \u003cstrong\u003ewish + past simple\u003c/strong\u003e để nói về những tình huống hiện tại mà chúng ta muốn KHÁC ĐI (không có thật).\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e S + \u003cstrong\u003ewish(es)\u003c/strong\u003e + S + \u003cstrong\u003eV (past simple)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eWe don't live by the sea.\u003c/em\u003e → I wish we \u003cstrong\u003elived\u003c/strong\u003e by the sea.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Chúng tôi không sống gần biển → Tôi ước sống gần biển.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eShe doesn't have a pet.\u003c/em\u003e → She wishes she \u003cstrong\u003ehad\u003c/strong\u003e a pet.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy không có thú cưng → Cô ấy ước có thú cưng.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eIt rains all the time.\u003c/em\u003e → I wish it \u003cstrong\u003edidn't rain\u003c/strong\u003e all the time.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Trời mưa suốt → Tôi ước trời không mưa suốt.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e\u003cbr\u003e\r\n            • Thực tế \u003cstrong\u003ephủ định\u003c/strong\u003e (don't have) → wish + \u003cstrong\u003ekhẳng định quá khứ\u003c/strong\u003e (had)\u003cbr\u003e\r\n            • Thực tế \u003cstrong\u003ekhẳng định\u003c/strong\u003e không muốn (rains) → wish + \u003cstrong\u003edidn't\u003c/strong\u003e + V\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Wish + Could --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 Wish + Could + V — Ước Về Khả Năng\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e S + \u003cstrong\u003ewish(es)\u003c/strong\u003e + S + \u003cstrong\u003ecould\u003c/strong\u003e + V (nguyên mẫu)\u003c/p\u003e\r\n          \u003cp\u003eDùng khi ước có khả năng làm gì đó mà thực tế KHÔNG THỂ.\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eI can't play the guitar.\u003c/em\u003e → I wish I \u003cstrong\u003ecould play\u003c/strong\u003e the guitar.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Tôi không biết chơi ghi-ta → Tôi ước biết chơi ghi-ta.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eShe can't swim.\u003c/em\u003e → She wishes she \u003cstrong\u003ecould swim\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy không biết bơi → Cô ấy ước biết bơi.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eWe can't fly.\u003c/em\u003e → We wish we \u003cstrong\u003ecould fly\u003c/strong\u003e like birds.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Chúng ta không thể bay → Ước có thể bay như chim.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi thường gặp:\u003c/strong\u003e\u003cbr\u003e\r\n            I wish I \u003cstrong\u003ecan\u003c/strong\u003e fly. (SAI — dùng hiện tại)\u003cbr\u003e\r\n            I wish I \u003cstrong\u003ecould\u003c/strong\u003e fly. (ĐÚNG — dùng quá khứ)\u003cbr\u003e\r\n            I wish I \u003cstrong\u003ewill\u003c/strong\u003e be rich. (SAI — dùng tương lai)\u003cbr\u003e\r\n            I wish I \u003cstrong\u003ewas/were\u003c/strong\u003e rich. (ĐÚNG — dùng quá khứ)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Fact vs Wish --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 So Sánh: Thực Tế vs Câu Ước \u003c/h3\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px; text-align: left;\"\u003eThực tế (Fact)\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px; text-align: left;\"\u003eCâu ước (Wish)\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eI \u003cstrong\u003edon't have\u003c/strong\u003e a car.\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eI wish I \u003cstrong\u003ehad\u003c/strong\u003e a car.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe \u003cstrong\u003eis\u003c/strong\u003e short.\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe wishes she \u003cstrong\u003ewas/were\u003c/strong\u003e taller.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eHe \u003cstrong\u003ecan't\u003c/strong\u003e cook.\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eHe wishes he \u003cstrong\u003ecould\u003c/strong\u003e cook.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eWe \u003cstrong\u003ehave to\u003c/strong\u003e work.\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eWe wish we \u003cstrong\u003edidn't have to\u003c/strong\u003e work.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eIt \u003cstrong\u003erains\u003c/strong\u003e a lot.\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eI wish it \u003cstrong\u003edidn't rain\u003c/strong\u003e a lot.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Quy tắc chuyển đổi:\u003c/strong\u003e\u003cbr\u003e\r\n            • don't/doesn't + V → wish + \u003cstrong\u003eV(past)\u003c/strong\u003e\u003cbr\u003e\r\n            • V (không muốn) → wish + \u003cstrong\u003edidn't + V\u003c/strong\u003e\u003cbr\u003e\r\n            • can't + V → wish + \u003cstrong\u003ecould + V\u003c/strong\u003e\u003cbr\u003e\r\n            • is/are (xấu) → wish + \u003cstrong\u003ewasn't/weren't\u003c/strong\u003e\u003cbr\u003e\r\n            • He/She + wish → wish\u003cstrong\u003ees\u003c/strong\u003e (thêm -es cho ngôi 3)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Question Tags - Positive → Negative --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 Question Tags: Khẳng Định → Tag Phủ Định\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu \u003cstrong\u003ekhẳng định\u003c/strong\u003e → tag \u003cstrong\u003ephủ định\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eCâu khẳng định\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eQuestion Tag\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eYou \u003cstrong\u003eare\u003c/strong\u003e happy,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003earen't you?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe \u003cstrong\u003ecan\u003c/strong\u003e swim,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ecan't she?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eHe \u003cstrong\u003ewill\u003c/strong\u003e come,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ewon't he?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eYou \u003cstrong\u003elike\u003c/strong\u003e pizza,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003edon't you?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe \u003cstrong\u003eplays\u003c/strong\u003e tennis,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003edoesn't she?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eThey \u003cstrong\u003ewent\u003c/strong\u003e home,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003edidn't they?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Question Tags - Negative → Positive --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Question Tags: Phủ Định → Tag Khẳng Định\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu \u003cstrong\u003ephủ định\u003c/strong\u003e → tag \u003cstrong\u003ekhẳng định\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eCâu phủ định\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eQuestion Tag\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eYou \u003cstrong\u003earen't\u003c/strong\u003e tired,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eare you?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe \u003cstrong\u003ecan't\u003c/strong\u003e drive,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ecan she?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eHe \u003cstrong\u003ewon't\u003c/strong\u003e forget,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ewill he?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eYou \u003cstrong\u003edon't\u003c/strong\u003e eat meat,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003edo you?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe \u003cstrong\u003edidn't\u003c/strong\u003e call,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003edid she?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Special Cases --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Trường Hợp Đặc Biệt \u003c/h3\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eCâu\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eTag đặc biệt\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eGiải thích\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eI am\u003c/strong\u003e right,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003earen't I?\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eKHÔNG có \"amn't\" → dùng aren't\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eI'm \u003cstrong\u003enot\u003c/strong\u003e late,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eam I?\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003ePhủ định → tag khẳng định\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eNobody\u003c/strong\u003e came,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003edid they?\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eNobody = phủ định → tag khẳng định, dùng they\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eEverything\u003c/strong\u003e is OK,\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eisn't it?\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eEverything → it trong tag\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Nhớ kỹ:\u003c/strong\u003e\u003cbr\u003e\r\n            • I am → \u003cstrong\u003earen't I?\u003c/strong\u003e (KHÔNG có amn't!)\u003cbr\u003e\r\n            • Nobody/Nothing/No one = nghĩa phủ định → tag \u003cstrong\u003ekhẳng định\u003c/strong\u003e\u003cbr\u003e\r\n            • Nobody/Everybody → dùng \u003cstrong\u003ethey\u003c/strong\u003e trong tag\u003cbr\u003e\r\n            • Everything/Something → dùng \u003cstrong\u003eit\u003c/strong\u003e trong tag\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: Auxiliary Matching --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 Quy Tắc Chọn Trợ Động Từ Trong Tag\u003c/h3\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eCâu chính có\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eTag dùng\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eVí dụ\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eam/is/are\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eam/isn't/aren't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe is kind, \u003cstrong\u003eisn't she?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ewas/were\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003ewasn't/weren't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eHe was late, \u003cstrong\u003ewasn't he?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ecan/could\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003ecan't/couldn't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eYou can drive, \u003cstrong\u003ecan't you?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ewill/would\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003ewon't/wouldn't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eHe will come, \u003cstrong\u003ewon't he?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eshould/must\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eshouldn't/mustn't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eWe should go, \u003cstrong\u003eshouldn't we?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ehave/has\u003c/strong\u003e (hoàn thành)\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003ehaven't/hasn't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe has gone, \u003cstrong\u003ehasn't she?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eĐộng từ thường\u003c/strong\u003e (HTĐ)\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003edo/don't/does/doesn't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eYou like tea, \u003cstrong\u003edon't you?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eĐộng từ thường\u003c/strong\u003e (QKĐ)\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003edid/didn't\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eHe went home, \u003cstrong\u003edidn't he?\u003c/strong\u003e\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e\u003cbr\u003e\r\n            • Có \u003cstrong\u003ebe/can/will/should/must/have\u003c/strong\u003e → lặp lại chính nó trong tag\u003cbr\u003e\r\n            • Động từ thường (play, eat, go...) → dùng \u003cstrong\u003edo/does/did\u003c/strong\u003e trong tag\u003cbr\u003e\r\n            • Thì của tag \u003cstrong\u003ephải khớp\u003c/strong\u003e với thì của câu chính!\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 8: Common Mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e8 Lỗi Thường Gặp → \u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eLỗi Wish:\u003c/strong\u003e\u003cbr\u003e\r\n            I wish I \u003cstrong\u003ecan\u003c/strong\u003e fly. → I wish I \u003cstrong\u003ecould\u003c/strong\u003e fly.\u003cbr\u003e\r\n            I wish I \u003cstrong\u003ehave\u003c/strong\u003e a pet. → I wish I \u003cstrong\u003ehad\u003c/strong\u003e a pet.\u003cbr\u003e\r\n            I wish I \u003cstrong\u003eam\u003c/strong\u003e taller. → I wish I \u003cstrong\u003ewas/were\u003c/strong\u003e taller.\u003cbr\u003e\r\n            I wish I \u003cstrong\u003edon't\u003c/strong\u003e work. → I wish I \u003cstrong\u003edidn't\u003c/strong\u003e work.\u003cbr\u003e\r\n            He \u003cstrong\u003ewish\u003c/strong\u003e he had time. → He \u003cstrong\u003ewishes\u003c/strong\u003e he had time.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eLỗi Question Tag:\u003c/strong\u003e\u003cbr\u003e\r\n            She is tall, \u003cstrong\u003eis she?\u003c/strong\u003e → She is tall, \u003cstrong\u003eisn't she?\u003c/strong\u003e\u003cbr\u003e\r\n            He went home, \u003cstrong\u003edoesn't he?\u003c/strong\u003e → He went home, \u003cstrong\u003edidn't he?\u003c/strong\u003e\u003cbr\u003e\r\n            I am right, \u003cstrong\u003eamn't I?\u003c/strong\u003e → I am right, \u003cstrong\u003earen't I?\u003c/strong\u003e\u003cbr\u003e\r\n            Tom likes fish, \u003cstrong\u003edoesn't Tom?\u003c/strong\u003e → Tom likes fish, \u003cstrong\u003edoesn't he?\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-12-going-places\",\"title\":\"Unit 12: Going Places - Wish \u0026 Question Tags\",\"grammarTopics\":[\"Wish + past simple\",\"Wish + could\",\"Question tags\"],\"theory\":{\"brief\":\"We use wish + past simple to talk about situations we want to be different. We use question tags (short questions) at the end of statements to check information or seek agreement.\",\"rules\":[\"Wish + past simple: diễn tả điều ước về hiện tại (không có thật)\",\"Wish + could + V: ước có khả năng làm gì (không thể làm được)\",\"Question tag: câu khẳng định → tag phủ định, câu phủ định → tag khẳng định\",\"I am → aren't I? (trường hợp đặc biệt)\",\"Let's → shall we? (trường hợp đặc biệt)\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"Gemma wishes her family _______ (have) a boat.\",\"answer\":\"had\",\"acceptedAnswers\":[\"had\"],\"hints\":[\"Dùng quá khứ đơn của 'have'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả điều ước trái ngược với thực tế ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + V2/ed\u003c/strong\u003e (động từ lùi về thì quá khứ đơn) nhé.\u003cbr\u003eThực tế là Gia đình Gemma KHÔNG có thuyền nên cô ấy ước có. Để ước điều ngược lại ở hiện tại, động từ chính được lùi về thì quá khứ đơn thành \u003cstrong\u003ehad\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Gemma ước gia đình cô ấy có một chiếc thuyền.\",\"points\":10},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"A lot of people wish life _______ (be) less busy.\",\"answer\":\"was\",\"acceptedAnswers\":[\"was\",\"were\"],\"hints\":[\"Dùng quá khứ đơn của 'be'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả mong ước về một trạng thái hay đặc điểm trái với thực tế hiện tại, cấu trúc là: \u003cstrong\u003eS + wish + S + was/were + Adj/N\u003c/strong\u003e (chúng ta có thể dùng 'were' cho tất cả các ngôi nha).\u003cbr\u003eThực tế là Cuộc sống BẬN RỘN nên ước ít bận rộn hơn. Vì vậy, động từ to be được lùi về quá khứ đơn là \u003cstrong\u003ewas\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nhiều người ước cuộc sống ít bận rộn hơn.\",\"points\":10},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"I wish we _______ (know) how to play this game.\",\"answer\":\"knew\",\"acceptedAnswers\":[\"knew\"],\"hints\":[\"Quá khứ đơn của 'know'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả điều ước trái ngược với thực tế ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + V2/ed\u003c/strong\u003e (động từ lùi về thì quá khứ đơn) nhé.\u003cbr\u003eThực tế là Chúng ta KHÔNG biết chơi trò này nên ước biết. Để ước điều ngược lại ở hiện tại, động từ chính được lùi về thì quá khứ đơn thành \u003cstrong\u003eknew\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi ước chúng ta biết cách chơi trò này.\",\"points\":10},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"I wish our cousins _______ (live) closer.\",\"answer\":\"lived\",\"acceptedAnswers\":[\"lived\"],\"hints\":[\"Quá khứ đơn của 'live'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả điều ước trái ngược với thực tế ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + V2/ed\u003c/strong\u003e (động từ lùi về thì quá khứ đơn) nhé.\u003cbr\u003eThực tế là Anh chị em họ sống XA nên ước sống gần hơn. Để ước điều ngược lại ở hiện tại, động từ chính được lùi về thì quá khứ đơn thành \u003cstrong\u003elived\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi ước anh chị em họ sống gần hơn.\",\"points\":10},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"I wish people _______ (not throw) litter everywhere.\",\"answer\":\"didn't throw\",\"acceptedAnswers\":[\"didn't throw\",\"did not throw\"],\"hints\":[\"Dùng phủ định quá khứ đơn\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi muốn ước một hành động phủ định trái ngược với hiện thực ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + didn't + V\u003c/strong\u003e (nguyên mẫu) nhé.\u003cbr\u003eThực tế là Người ta VẪN xả rác nên ước không xả. Để ước hành động đó không xảy ra ở hiện tại, ta dùng trợ động từ phủ định quá khứ \u003cstrong\u003edidn't throw\u003c/strong\u003e đi kèm động từ nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi ước mọi người không xả rác khắp nơi.\",\"points\":10},{\"id\":6,\"type\":\"fill-blank\",\"question\":\"Billy wishes he _______ (can) paint like Poppy.\",\"answer\":\"could\",\"acceptedAnswers\":[\"could\"],\"hints\":[\"Quá khứ của 'can'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi ước về một khả năng không có thật ở hiện tại, các em dùng cấu trúc: \u003cstrong\u003eS + wish + S + could + V\u003c/strong\u003e (nguyên mẫu) nhé.\u003cbr\u003eThực tế là Billy KHÔNG THỂ vẽ như Poppy nên ước có thể. Do đó, chúng ta dùng động từ khuyết thiếu quá khứ \u003cstrong\u003ecould\u003c/strong\u003e để diễn tả khả năng mà chủ ngữ mong ước.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Billy ước cậu ấy có thể vẽ như Poppy.\",\"points\":10},{\"id\":7,\"type\":\"fill-blank\",\"question\":\"I wish this jewellery _______ (not be) so expensive.\",\"answer\":\"wasn't\",\"acceptedAnswers\":[\"wasn't\",\"weren't\",\"was not\",\"were not\"],\"hints\":[\"Phủ định quá khứ đơn của 'be'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả mong ước phủ định về một trạng thái hay đặc điểm ở hiện tại, cấu trúc là: \u003cstrong\u003eS + wish + S + wasn't/weren't + Adj/N\u003c/strong\u003e các em nhé.\u003cbr\u003eThực tế là Trang sức ĐẮT nên ước không đắt. Vì vậy, ta dùng dạng phủ định quá khứ của to be là \u003cstrong\u003ewasn't\u003c/strong\u003e để ước điều ngược lại.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi ước trang sức này không đắt thế.\",\"points\":10},{\"id\":8,\"type\":\"fill-blank\",\"question\":\"We wish our team _______ (not lose) every match.\",\"answer\":\"didn't lose\",\"acceptedAnswers\":[\"didn't lose\",\"did not lose\"],\"hints\":[\"Dùng phủ định quá khứ đơn\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi muốn ước một hành động phủ định trái ngược với hiện thực ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + didn't + V\u003c/strong\u003e (nguyên mẫu) nhé.\u003cbr\u003eThực tế là Đội THUA mọi trận nên ước không thua. Để ước hành động đó không xảy ra ở hiện tại, ta dùng trợ động từ phủ định quá khứ \u003cstrong\u003edidn't lose\u003c/strong\u003e đi kèm động từ nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi ước đội không thua mọi trận.\",\"points\":10},{\"id\":9,\"type\":\"fill-blank\",\"question\":\"She wishes she _______ (speak) Japanese.\",\"answer\":\"spoke\",\"acceptedAnswers\":[\"spoke\"],\"hints\":[\"Quá khứ đơn của 'speak'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả điều ước trái ngược với thực tế ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + V2/ed\u003c/strong\u003e (động từ lùi về thì quá khứ đơn) nhé.\u003cbr\u003eThực tế là Cô ấy KHÔNG nói được tiếng Nhật nên ước nói được. Để ước điều ngược lại ở hiện tại, động từ chính được lùi về thì quá khứ đơn thành \u003cstrong\u003espoke\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy ước cô ấy nói được tiếng Nhật.\",\"points\":10},{\"id\":10,\"type\":\"fill-blank\",\"question\":\"Tom wishes he _______ (be) taller.\",\"answer\":\"was\",\"acceptedAnswers\":[\"was\",\"were\"],\"hints\":[\"Quá khứ đơn của 'be'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả mong ước về một trạng thái hay đặc điểm trái với thực tế hiện tại, cấu trúc là: \u003cstrong\u003eS + wish + S + was/were + Adj/N\u003c/strong\u003e (chúng ta có thể dùng 'were' cho tất cả các ngôi nha).\u003cbr\u003eThực tế là Tom THẤP nên ước cao hơn. Vì vậy, động từ to be được lùi về quá khứ đơn là \u003cstrong\u003ewas\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tom ước cậu ấy cao hơn.\",\"points\":10},{\"id\":11,\"type\":\"fill-blank\",\"question\":\"I wish I _______ (not have to) wear a uniform.\",\"answer\":\"didn't have to\",\"acceptedAnswers\":[\"didn't have to\",\"did not have to\"],\"hints\":[\"Phủ định quá khứ đơn của 'have to'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi muốn ước một hành động phủ định trái ngược với hiện thực ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + didn't + V\u003c/strong\u003e (nguyên mẫu) nhé.\u003cbr\u003eThực tế là Phải mặc đồng phục nên ước không phải. Để ước hành động đó không xảy ra ở hiện tại, ta dùng trợ động từ phủ định quá khứ \u003cstrong\u003edidn't have to\u003c/strong\u003e đi kèm động từ nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi ước tôi không phải mặc đồng phục.\",\"points\":10},{\"id\":12,\"type\":\"fill-blank\",\"question\":\"We wish it _______ (not rain) so much in winter.\",\"answer\":\"didn't rain\",\"acceptedAnswers\":[\"didn't rain\",\"did not rain\"],\"hints\":[\"Phủ định quá khứ đơn\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi muốn ước một hành động phủ định trái ngược với hiện thực ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + didn't + V\u003c/strong\u003e (nguyên mẫu) nhé.\u003cbr\u003eThực tế là Mưa NHIỀU vào mùa đông nên ước không mưa nhiều. Để ước hành động đó không xảy ra ở hiện tại, ta dùng trợ động từ phủ định quá khứ \u003cstrong\u003edidn't rain\u003c/strong\u003e đi kèm động từ nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi ước trời không mưa nhiều vào mùa đông.\",\"points\":10},{\"id\":13,\"type\":\"fill-blank\",\"question\":\"My sister wishes she _______ (have) longer hair.\",\"answer\":\"had\",\"acceptedAnswers\":[\"had\"],\"hints\":[\"Quá khứ đơn của 'have'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả điều ước trái ngược với thực tế ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + V2/ed\u003c/strong\u003e (động từ lùi về thì quá khứ đơn) nhé.\u003cbr\u003eThực tế là Tóc ngắn nên ước có tóc dài hơn. Để ước điều ngược lại ở hiện tại, động từ chính được lùi về thì quá khứ đơn thành \u003cstrong\u003ehad\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chị tôi ước cô ấy có tóc dài hơn.\",\"points\":10},{\"id\":14,\"type\":\"fill-blank\",\"question\":\"He wishes he _______ (understand) maths better.\",\"answer\":\"understood\",\"acceptedAnswers\":[\"understood\"],\"hints\":[\"Quá khứ đơn của 'understand'\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả điều ước trái ngược với thực tế ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + V2/ed\u003c/strong\u003e (động từ lùi về thì quá khứ đơn) nhé.\u003cbr\u003eThực tế là Không giỏi toán nên ước hiểu tốt hơn. Để ước điều ngược lại ở hiện tại, động từ chính được lùi về thì quá khứ đơn thành \u003cstrong\u003eunderstood\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy ước anh ấy hiểu toán tốt hơn.\",\"points\":10},{\"id\":15,\"type\":\"fill-blank\",\"question\":\"They wish they _______ (not live) so far from school.\",\"answer\":\"didn't live\",\"acceptedAnswers\":[\"didn't live\",\"did not live\"],\"hints\":[\"Phủ định quá khứ đơn\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi muốn ước một hành động phủ định trái ngược với hiện thực ở hiện tại, các em sử dụng cấu trúc: \u003cstrong\u003eS + wish + S + didn't + V\u00 r\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Không ai thích bài tập, phải không?\",\"hints\":[\"Nobody = phủ định → tag khẳng định\"],\"points\":10},{\"id\":199,\"type\":\"error-correct\",\"wrongSentence\":\"She wishes she can cook better.\",\"correctSentence\":\"She wishes she could cook better.\",\"errorWord\":\"can\",\"correction\":\"could\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để diễn tả điều ước trái ngược với thực tế ở hiện tại, các em nhớ lùi động từ về quá khứ đơn (hoặc dùng 'could' cho khả năng) nhé.\u003cbr\u003eĐộng từ sau wish không được chia ở hiện tại. Vì vậy, các em cần sửa động từ hiện tại \u003cstrong\u003ecan\u003c/strong\u003e thành động từ quá khứ \u003cstrong\u003ecould\u003c/strong\u003e nha.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy ước nấu ăn giỏi hơn.\",\"hints\":[\"Sau wish không dùng 'can'\"],\"points\":10},{\"id\":200,\"type\":\"sentence-rewrite\",\"original\":\"We don't have a swimming pool.\",\"instruction\":\"Viết lại dùng 'We wish'\",\"starterText\":\"We wish\",\"answer\":\"We wish we had a swimming pool.\",\"acceptedAnswers\":[\"We wish we had a swimming pool.\",\"We wish we had a swimming pool\"],\"hints\":[\"don't have → had\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi viết câu ước từ một tình huống thực tế, các em lùi động từ về quá khứ đơn (hoặc dùng 'could' cho khả năng) và đổi thể khẳng định/phủ định ngược lại với thực tế nhé.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Thực tế phủ định \u003cstrong\u003edon't have\u003c/strong\u003e nên câu ước đảo sang khẳng định, lùi về quá khứ đơn: \u003cstrong\u003ehad\u003c/strong\u003e. Cấu trúc: We wish + S + V quá khứ đơn.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi ước có hồ bơi.\",\"points\":10}],\"theoryHtml\":\"$17\"},\"unitPath\":\"grade-6/grammar-friends-6/gf6-unit-12-going-places\",\"grammarRef\":{\"grade\":\"grade-6\",\"book\":\"grammar-friends-6\",\"unit\":\"un
