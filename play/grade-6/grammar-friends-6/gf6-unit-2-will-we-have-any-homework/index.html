          \u003ch3 class=\"theory-panel__heading\"\u003e1 First Conditional — Điều Kiện Loại 1 (Có Thể Xảy Ra)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng khi nói về điều \u003cstrong\u003eCÓ THỂ xảy ra thật\u003c/strong\u003e trong tương lai. Điều kiện là hợp lý, có khả năng xảy ra.\u003c/p\u003e\r\n\r\n          \u003cdiv style=\"background: #e8f5e9; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Cấu trúc:\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eIf + S + V (hiện tại đơn), S + will + V (nguyên mẫu)\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If it \u003cstrong\u003erains\u003c/strong\u003e, we \u003cstrong\u003ewill take\u003c/strong\u003e the bus.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu trời mưa, chúng ta sẽ đi xe buýt.) → Trời CÓ THỂ mưa thật!\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If you \u003cstrong\u003estudy\u003c/strong\u003e hard, you \u003cstrong\u003ewill pass\u003c/strong\u003e the exam.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu bạn học chăm, bạn sẽ đỗ.) → Điều này hoàn toàn có thể!\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If she \u003cstrong\u003efinishes\u003c/strong\u003e early, she \u003cstrong\u003e'll come\u003c/strong\u003e to the party.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu cô ấy xong sớm, cô ấy sẽ đến bữa tiệc.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Tình huống CÓ THỂ xảy ra → dùng \u003cstrong\u003eLoại 1\u003c/strong\u003e\u003cbr\u003e\r\n            Vế IF dùng \u003cstrong\u003ehiện tại đơn\u003c/strong\u003e (KHÔNG dùng will!) | Vế kết quả dùng \u003cstrong\u003ewill\u003c/strong\u003e\u003cbr\u003e\r\n            If it \u003cstrong\u003ewill rain\u003c/strong\u003e... (SAI!) → ✓ If it \u003cstrong\u003erains\u003c/strong\u003e...\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: First Conditional - Negative \u0026 Questions --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 First Conditional — Phủ Định \u0026 Câu Hỏi\u003c/h3\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003ePhủ định (Negative):\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eIf + S + don't/doesn't + V, S + won't + V\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If you \u003cstrong\u003edon't hurry\u003c/strong\u003e, you \u003cstrong\u003ewon't catch\u003c/strong\u003e the bus.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu bạn không nhanh lên, bạn sẽ không kịp xe buýt.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If he \u003cstrong\u003edoesn't study\u003c/strong\u003e, he \u003cstrong\u003ewon't pass\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu anh ấy không học, anh ấy sẽ không đỗ.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\" style=\"margin-top: 0.5rem;\"\u003e\r\n            \u003cstrong\u003eCâu hỏi (Questions):\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eWill + S + V + if + S + V (hiện tại đơn)?\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWill\u003c/strong\u003e you phone me \u003cstrong\u003eif\u003c/strong\u003e you \u003cstrong\u003epass\u003c/strong\u003e the exam?\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;— Yes, I \u003cstrong\u003ewill\u003c/strong\u003e. / No, I \u003cstrong\u003ewon't\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWill\u003c/strong\u003e it be cheaper \u003cstrong\u003eif\u003c/strong\u003e we \u003cstrong\u003ebring\u003c/strong\u003e our own food?\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;— Yes, it \u003cstrong\u003ewill\u003c/strong\u003e.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Second Conditional - Basics --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 Second Conditional — Điều Kiện Loại 2 (Không Có Thật / Tưởng Tượng)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng khi nói về điều \u003cstrong\u003eKHÔNG CÓ THẬT\u003c/strong\u003e ở hiện tại hoặc \u003cstrong\u003eKHÓ XẢY RA / tưởng tượng\u003c/strong\u003e.\u003c/p\u003e\r\n\r\n          \u003cdiv style=\"background: #e3f2fd; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Cấu trúc:\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eIf + S + V (quá khứ đơn), S + would + V (nguyên mẫu)\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If I \u003cstrong\u003ehad\u003c/strong\u003e wings, I \u003cstrong\u003ewould fly\u003c/strong\u003e really fast.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu tôi có cánh, tôi sẽ bay thật nhanh.) → Tôi KHÔNG có cánh! Tưởng tượng!\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If she \u003cstrong\u003elived\u003c/strong\u003e in France, she \u003cstrong\u003ewould speak\u003c/strong\u003e French.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu cô ấy sống ở Pháp, cô ấy sẽ nói tiếng Pháp.) → Cô ấy KHÔNG sống ở Pháp!\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If I \u003cstrong\u003ewon\u003c/strong\u003e the lottery, I \u003cstrong\u003e'd buy\u003c/strong\u003e a big house.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu tôi trúng xổ số, tôi sẽ mua nhà lớn.) → Rất khó xảy ra!\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Tình huống KHÔNG CÓ THẬT / tưởng tượng → dùng \u003cstrong\u003eLoại 2\u003c/strong\u003e\u003cbr\u003e\r\n            Vế IF dùng \u003cstrong\u003equá khứ đơn\u003c/strong\u003e | Vế kết quả dùng \u003cstrong\u003ewould\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003e'd = would\u003c/strong\u003e (viết tắt): I'd = I would, he'd = he would\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Second Conditional - If I were... \u0026 Negatives --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 Second Conditional — If I were... \u0026 Phủ Định\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #e3f2fd; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Đặc biệt: IF I WERE...\u003c/strong\u003e\u003cbr\u003e\r\n            Trong câu điều kiện loại 2, với động từ \u003cstrong\u003eBE\u003c/strong\u003e, dùng \u003cstrong\u003eWERE\u003c/strong\u003e cho tất cả các ngôi (đặc biệt trong văn viết trang trọng).\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If I \u003cstrong\u003ewere\u003c/strong\u003e you, I \u003cstrong\u003ewould study\u003c/strong\u003e harder.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu tôi là bạn, tôi sẽ học chăm hơn.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If she \u003cstrong\u003ewere\u003c/strong\u003e taller, she \u003cstrong\u003ewould play\u003c/strong\u003e basketball.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu cô ấy cao hơn, cô ấy sẽ chơi bóng rổ.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cem\u003eLưu ý: \"If I was...\" cũng được chấp nhận trong văn nói, nhưng \"If I were...\" chuẩn hơn.\u003c/em\u003e\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\" style=\"margin-top: 0.5rem;\"\u003e\r\n            \u003cstrong\u003ePhủ định \u0026 Câu hỏi:\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eIf + S + didn't + V, S + wouldn't + V\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            ✓ If she \u003cstrong\u003edidn't study\u003c/strong\u003e, she \u003cstrong\u003ewouldn't pass\u003c/strong\u003e her exams.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Nếu cô ấy không học, cô ấy sẽ không đỗ.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eWould + S + V + if + S + V (quá khứ đơn)?\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWould\u003c/strong\u003e you be surprised \u003cstrong\u003eif\u003c/strong\u003e it \u003cstrong\u003erained\u003c/strong\u003e in the desert?\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;— Yes, I \u003cstrong\u003ewould\u003c/strong\u003e. / No, I \u003cstrong\u003ewouldn't\u003c/strong\u003e.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Comparison --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 So Sánh: Loại 1 vs Loại 2 — Khi Nào Dùng?\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003ctable style=\"width: 100%; border-collapse: collapse; font-size: 0.95em;\"\u003e\r\n              \u003ctr style=\"border-bottom: 2px solid #0c5460;\"\u003e\r\n                \u003cth style=\"text-align: left; padding: 4px;\"\u003e\u003c/th\u003e\r\n                \u003cth style=\"text-align: left; padding: 4px;\"\u003eLoại 1 (First)\u003c/th\u003e\r\n                \u003cth style=\"text-align: left; padding: 4px;\"\u003eLoại 2 (Second)\u003c/th\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr style=\"border-bottom: 1px solid #bee5eb;\"\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003e\u003cstrong\u003eTình huống\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003eCó thể xảy ra thật\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003eKhông có thật / tưởng tượng\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr style=\"border-bottom: 1px solid #bee5eb;\"\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003e\u003cstrong\u003eVế IF\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003eHiện tại đơn\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003eQuá khứ đơn\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr style=\"border-bottom: 1px solid #bee5eb;\"\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003e\u003cstrong\u003eVế kết quả\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003ewill / won't + V\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003ewould / wouldn't + V\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003e\u003cstrong\u003eVí dụ\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003eIf it rains, I'll stay home.\u003c/td\u003e\r\n                \u003ctd style=\"padding: 4px;\"\u003eIf I had wings, I'd fly.\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n            \u003c/table\u003e\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\" style=\"margin-top: 0.5rem;\"\u003e\r\n            \u003cstrong\u003eSo sánh cùng chủ đề:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eLoại 1:\u003c/strong\u003e If I \u003cstrong\u003ehave\u003c/strong\u003e money, I \u003cstrong\u003ewill buy\u003c/strong\u003e a new phone.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;→ Tôi CÓ THỂ có tiền (thực tế, có thể xảy ra)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eLoại 2:\u003c/strong\u003e If I \u003cstrong\u003ehad\u003c/strong\u003e a million dollars, I \u003cstrong\u003ewould buy\u003c/strong\u003e a mansion.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;→ Tôi KHÔNG CÓ triệu đô (tưởng tượng, không có thật)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Common Mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Lỗi Thường Gặp vs ✓\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi 1: Dùng WILL trong vế IF\u003c/strong\u003e\u003cbr\u003e\r\n            If it \u003cstrong\u003ewill rain\u003c/strong\u003e, we'll stay home.\u003cbr\u003e\r\n            If it \u003cstrong\u003erains\u003c/strong\u003e, we'll stay home.\u003cbr\u003e\r\n            \u003cem\u003e→ Vế IF luôn dùng hiện tại đơn (Loại 1) hoặc quá khứ đơn (Loại 2), KHÔNG BAO GIỜ dùng will!\u003c/em\u003e\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 2: Dùng WOULD trong vế IF\u003c/strong\u003e\u003cbr\u003e\r\n            If I \u003cstrong\u003ewould have\u003c/strong\u003e wings, I'd fly.\u003cbr\u003e\r\n            If I \u003cstrong\u003ehad\u003c/strong\u003e wings, I'd fly.\u003cbr\u003e\r\n            \u003cem\u003e→ Vế IF không dùng would!\u003c/em\u003e\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 3: Nhầm lẫn Loại 1 và Loại 2\u003c/strong\u003e\u003cbr\u003e\r\n            If I \u003cstrong\u003ehad\u003c/strong\u003e time tomorrow, I \u003cstrong\u003ewill\u003c/strong\u003e help you. (trộn lẫn 2 loại!)\u003cbr\u003e\r\n            If I \u003cstrong\u003ehave\u003c/strong\u003e time tomorrow, I \u003cstrong\u003ewill\u003c/strong\u003e help you. (Loại 1)\u003cbr\u003e\r\n            If I \u003cstrong\u003ehad\u003c/strong\u003e time, I \u003cstrong\u003ewould\u003c/strong\u003e help you. (Loại 2)\u003cbr\u003e\r\n            \u003cem\u003e→ Không trộn lẫn! Hiện tại đơn + will HOẶC Quá khứ đơn + would\u003c/em\u003e\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 4: Quên chia động từ ngôi thứ 3\u003c/strong\u003e\u003cbr\u003e\r\n            If he \u003cstrong\u003efinish\u003c/strong\u003e early, he'll come.\u003cbr\u003e\r\n            If he \u003cstrong\u003efinishes\u003c/strong\u003e early, he'll come.\u003cbr\u003e\r\n            \u003cem\u003e→ Hiện tại đơn: he/she/it + V-s/es\u003c/em\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-2-will-we-have-any-homework\",\"title\":\"Unit 2: Will We Have Any Homework? - Conditionals\",\"grammarTopics\":[\"First conditional\",\"Second conditional\"],\"theory\":{\"brief\":\"First conditional: If + present simple, will/won't + base form (things likely to happen). Second conditional: If + past simple, would/wouldn't + base form (imaginary/unlikely situations).\",\"rules\":[\"First conditional: If + S + V(hiện tại đơn), S + will + V — điều CÓ THỂ xảy ra thật\",\"Second conditional: If + S + V(quá khứ đơn), S + would + V — điều KHÔNG CÓ THẬT / tưởng tượng\",\"Vế IF không bao giờ dùng will hoặc would\",\"Second conditional với BE: dùng were cho tất cả các ngôi (If I were...)\",\"Không trộn lẫn hai loại: present + will HOẶC past + would\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"If I get good marks in my exams, I _______ (be) happy.\",\"answer\":\"will be\",\"acceptedAnswers\":[\"will be\",\"'ll be\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề 'If' chia ở thì hiện tại đơn nên vế kết quả được chia ở tương lai đơn: \u003cstrong\u003ewill be\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu tôi đạt điểm cao trong các kỳ thi, tôi sẽ rất vui vẻ.\",\"hints\":[\"First conditional: will + V\"],\"points\":10},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"If it rains tomorrow, we _______ (stay) at home.\",\"answer\":\"will stay\",\"acceptedAnswers\":[\"will stay\",\"'ll stay\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề 'If' chia ở thì hiện tại đơn nên vế kết quả được chia ở tương lai đơn: \u003cstrong\u003ewill stay\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu ngày mai trời mưa, chúng ta sẽ ở nhà.\",\"hints\":[\"First conditional: will + V\"],\"points\":10},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"Chris will come out to play if he _______ (finish) his homework.\",\"answer\":\"finishes\",\"acceptedAnswers\":[\"finishes\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế kết quả chia ở tương lai đơn nên động từ trong mệnh đề 'If' được chia ở thì hiện tại đơn thành \u003cstrong\u003efinishes\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chris sẽ ra ngoài chơi nếu cậu ấy làm xong bài tập về nhà.\",\"hints\":[\"Present simple: he + V-s\"],\"points\":10},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"If we move to a hot country, we _______ (buy) a house with a pool.\",\"answer\":\"will buy\",\"acceptedAnswers\":[\"will buy\",\"'ll buy\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề 'If' chia ở thì hiện tại đơn nên vế kết quả được chia ở tương lai đơn: \u003cstrong\u003ewill buy\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu chúng ta chuyển đến một đất nước có khí hậu nóng, chúng ta sẽ mua một ngôi nhà có hồ bơi.\",\"hints\":[\"First conditional: will + V\"],\"points\":10},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"I'll drink some orange juice if I _______ (be) thirsty.\",\"answer\":\"am\",\"acceptedAnswers\":[\"am\",\"'m\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế kết quả chia ở tương lai đơn nên động từ trong mệnh đề 'If' được chia ở thì hiện tại đơn thành \u003cstrong\u003eam\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi sẽ uống một ít nước cam nếu tôi khát nước.\",\"hints\":[\"Present simple of be\"],\"points\":10},{\"id\":6,\"type\":\"fill-blank\",\"question\":\"If you don't hurry, you _______ (miss) the bus.\",\"answer\":\"will miss\",\"acceptedAnswers\":[\"will miss\",\"'ll miss\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề 'If' chia ở thì hiện tại đơn nên vế kết quả được chia ở tương lai đơn: \u003cstrong\u003ewill miss\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu bạn không nhanh lên, bạn sẽ lỡ chuyến xe buýt.\",\"hints\":[\"First conditional: will + V\"],\"points\":10},{\"id\":7,\"type\":\"fill-blank\",\"question\":\"If she _______ (pass) the test, her parents will be proud.\",\"answer\":\"passes\",\"acceptedAnswers\":[\"passes\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế kết quả chia ở tương lai đơn nên động từ trong mệnh đề 'If' được chia ở thì hiện tại đơn thành \u003cstrong\u003epasses\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu cô ấy vượt qua kỳ thi, bố mẹ cô ấy sẽ rất tự hào.\",\"hints\":[\"Present simple: she + V-es\"],\"points\":10},{\"id\":8,\"type\":\"fill-blank\",\"question\":\"If we _______ (not leave) now, we'll be late for school.\",\"answer\":\"don't leave\",\"acceptedAnswers\":[\"don't leave\",\"do not leave\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế kết quả chia ở tương lai đơn nên động từ trong mệnh đề 'If' được chia ở thì hiện tại đơn thành \u003cstrong\u003edon't leave\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu chúng ta không rời đi ngay bây giờ, chúng ta sẽ bị muộn học.\",\"hints\":[\"Negative: don't + V\"],\"points\":10},{\"id\":9,\"type\":\"fill-blank\",\"question\":\"You _______ (get) wet if you don't take an umbrella.\",\"answer\":\"will get\",\"acceptedAnswers\":[\"will get\",\"'ll get\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề 'If' chia ở thì hiện tại đơn nên vế kết quả được chia ở tương lai đơn: \u003cstrong\u003ewill get\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bạn sẽ bị ướt nếu không mang theo ô.\",\"hints\":[\"First conditional: will + V\"],\"points\":10},{\"id\":10,\"type\":\"fill-blank\",\"question\":\"If the weather _______ (be) nice, we'll go to the beach.\",\"answer\":\"is\",\"acceptedAnswers\":[\"is\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế kết quả chia ở tương lai đơn nên động từ trong mệnh đề 'If' được chia ở thì hiện tại đơn thành \u003cstrong\u003eis\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu thời tiết đẹp, chúng ta sẽ đi tắm biển.\",\"hints\":[\"Present simple of be: is\"],\"points\":10},{\"id\":11,\"type\":\"fill-blank\",\"question\":\"If they _______ (invite) me, I'll go to the party.\",\"answer\":\"invite\",\"acceptedAnswers\":[\"invite\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế kết quả chia ở tương lai đơn nên động từ trong mệnh đề 'If' được chia ở thì hiện tại đơn thành \u003cstrong\u003einvite\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu họ mời tôi, tôi sẽ đi dự tiệc.\",\"hints\":[\"Present simple with they\"],\"points\":10},{\"id\":12,\"type\":\"fill-blank\",\"question\":\"She _______ (not come) if you don't ask her.\",\"answer\":\"won't come\",\"acceptedAnswers\":[\"won't come\",\"will not come\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại hoặc tương lai (Cấu trúc: If + hiện tại đơn, will + động từ nguyên mẫu).\u003cbr\
