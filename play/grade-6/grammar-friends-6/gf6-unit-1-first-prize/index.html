g\"\u003e1 BE GOING TO — Kế Hoạch Đã Quyết Định Trước \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng \u003cstrong\u003ebe going to + V(nguyên mẫu)\u003c/strong\u003e khi bạn đã quyết định/lên kế hoạch từ TRƯỚC khi nói.\u003c/p\u003e\r\n\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003ctable style=\"width:100%; border-collapse:collapse; margin:0.5rem 0;\"\u003e\r\n            \u003ctr style=\"background:#e8f5e9;\"\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003e\u003cstrong\u003e Khẳng định\u003c/strong\u003e\u003c/td\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003eS + am/is/are + going to + V\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003e\u003cstrong\u003e Phủ định\u003c/strong\u003e\u003c/td\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003eS + am/is/are + not + going to + V\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr style=\"background:#e8f5e9;\"\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003e\u003cstrong\u003e Nghi vấn\u003c/strong\u003e\u003c/td\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003eAm/Is/Are + S + going to + V?\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ We\u003cstrong\u003e're going to see\u003c/strong\u003e a play this evening. (Tối nay chúng tôi sẽ đi xem kịch — đã lên kế hoạch.)\u003cbr\u003e\r\n            ✓ I\u003cstrong\u003e'm going to study\u003c/strong\u003e medicine at university. (Tôi sẽ học y — đã quyết định.)\u003cbr\u003e\r\n            ✓ They\u003cstrong\u003e're not going to come\u003c/strong\u003e to the party. (Họ sẽ không đến tiệc — đã quyết định không đi.)\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eAre\u003c/strong\u003e you \u003cstrong\u003egoing to visit\u003c/strong\u003e Grandma this weekend? (Bạn có định thăm bà cuối tuần không?)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e Đã có kế hoạch/ý định từ trước → dùng \u003cstrong\u003ebe going to\u003c/strong\u003e\u003cbr\u003e\r\n            Từ khóa thường gặp: I've decided, I plan to, We've arranged, tonight, this weekend (khi đã sắp xếp)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Be going to - Predictions with evidence --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 BE GOING TO — Dự Đoán Dựa Trên Bằng Chứng \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng \u003cstrong\u003ebe going to\u003c/strong\u003e khi dự đoán điều gì đó SẮP xảy ra vì bạn THẤY bằng chứng ngay bây giờ.\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eLook!\u003c/strong\u003e The baby \u003cstrong\u003eis going to cry\u003c/strong\u003e! (Nhìn kìa! Em bé sắp khóc! — mắt đỏ hoe, mặt nhăn nhó)\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eLook at those clouds!\u003c/strong\u003e It\u003cstrong\u003e's going to rain\u003c/strong\u003e. (Nhìn mây kìa! Trời sắp mưa.)\u003cbr\u003e\r\n            ✓ The car is making a strange noise. It\u003cstrong\u003e's going to break down\u003c/strong\u003e. (Xe phát tiếng lạ. Nó sắp hỏng.)\u003cbr\u003e\r\n            ✓ Leo is way ahead! He\u003cstrong\u003e's going to win\u003c/strong\u003e the race! (Leo dẫn xa! Cậu ấy sắp thắng!)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e So sánh: Dự đoán có bằng chứng vs không bằng chứng\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eCó bằng chứng (→ going to):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ Look at the sky! It\u003cstrong\u003e's going to rain\u003c/strong\u003e. (Nhìn trời kìa → bằng chứng trực tiếp)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eKhông bằng chứng (→ will):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I think it\u003cstrong\u003e'll rain\u003c/strong\u003e tomorrow. (Tôi nghĩ ngày mai trời mưa → suy đoán chung)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e Look!, Watch out!, Be careful!, can you see...?, mô tả tình huống đang xảy ra → \u003cstrong\u003ebe going to\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Will - Instant decisions \u0026 offers --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 WILL — Quyết Định Tức Thì \u0026 Lời Đề Nghị \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng \u003cstrong\u003ewill ('ll)\u003c/strong\u003e khi bạn quyết định NGAY LÚC NÓI hoặc đề nghị giúp ai đó.\u003c/p\u003e\r\n\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003ctable style=\"width:100%; border-collapse:collapse; margin:0.5rem 0;\"\u003e\r\n            \u003ctr style=\"background:#e8f5e9;\"\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003e\u003cstrong\u003e Khẳng định\u003c/strong\u003e\u003c/td\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003eS + will ('ll) + V\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003e\u003cstrong\u003e Phủ định\u003c/strong\u003e\u003c/td\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003eS + will not (won't) + V\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr style=\"background:#e8f5e9;\"\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003e\u003cstrong\u003e Nghi vấn\u003c/strong\u003e\u003c/td\u003e\u003ctd style=\"padding:6px; border:1px solid #ccc;\"\u003eWill + S + V?\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ — Quyết định tức thì:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ It's raining. I\u003cstrong\u003e'll take\u003c/strong\u003e an umbrella. (Trời mưa. Tôi sẽ lấy ô. — quyết định ngay)\u003cbr\u003e\r\n            ✓ The phone is ringing. I\u003cstrong\u003e'll answer\u003c/strong\u003e it. (Điện thoại reo. Tôi sẽ nghe.)\u003cbr\u003e\r\n            ✓ I'm hungry. I\u003cstrong\u003e'll make\u003c/strong\u003e a sandwich. (Tôi đói. Tôi sẽ làm sandwich.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eVí dụ — Lời đề nghị/hứa:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ That bag looks heavy. I\u003cstrong\u003e'll carry\u003c/strong\u003e it for you. (Túi nặng quá. Tôi sẽ xách giúp.)\u003cbr\u003e\r\n            ✓ Don't worry. I\u003cstrong\u003e'll help\u003c/strong\u003e you with your homework. (Đừng lo. Tôi sẽ giúp bạn.)\u003cbr\u003e\r\n            ✓ I\u003cstrong\u003e'll finish\u003c/strong\u003e off the preparations, if you like. (Tôi sẽ hoàn tất việc chuẩn bị nhé.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e Quyết định ngay lúc nói, phản ứng với tình huống, lời đề nghị\u003cbr\u003e\r\n            Từ khóa: OK, I'll...; I know! I'll...; Don't worry, I'll...; I'll ... if you like; Let me... → \u003cstrong\u003ewill\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Will - General predictions --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 WILL — Dự Đoán Chung Về Tương Lai \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng \u003cstrong\u003ewill\u003c/strong\u003e cho dự đoán chung (không dựa vào bằng chứng trước mắt), ý kiến cá nhân về tương lai.\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I think she\u003cstrong\u003e'll be\u003c/strong\u003e a great doctor. (Tôi nghĩ cô ấy sẽ là bác sĩ giỏi.)\u003cbr\u003e\r\n            ✓ I\u003cstrong\u003e'll be\u003c/strong\u003e thirteen next year. (Năm sau tôi sẽ 13 tuổi.)\u003cbr\u003e\r\n            ✓ It \u003cstrong\u003ewill\u003c/strong\u003e probably \u003cstrong\u003ebe\u003c/strong\u003e sunny tomorrow. (Ngày mai có lẽ trời nắng.)\u003cbr\u003e\r\n            ✓ One day, people \u003cstrong\u003ewill live\u003c/strong\u003e on Mars. (Một ngày, con người sẽ sống trên Sao Hỏa.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e I think, I'm sure, I believe, probably, perhaps, maybe, one day, in the future, when I grow up → \u003cstrong\u003ewill\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Won't --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 WON'T — Dự Đoán Phủ Định \u0026 Từ Chối \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e \u003cstrong\u003eWon't = will not\u003c/strong\u003e — dùng cho dự đoán phủ định hoặc từ chối.\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003ewon't be\u003c/strong\u003e famous when I grow up. (Tôi sẽ không nổi tiếng khi lớn lên.)\u003cbr\u003e\r\n            ✓ In 2050, there \u003cstrong\u003ewon't be\u003c/strong\u003e any paper books. (Năm 2050, sẽ không còn sách giấy.)\u003cbr\u003e\r\n            ✓ Don't worry, it \u003cstrong\u003ewon't hurt\u003c/strong\u003e. (Đừng lo, nó sẽ không đau đâu.)\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003ewon't pass\u003c/strong\u003e the exam if she doesn't study. (Cô ấy sẽ không đậu nếu không học.)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Present Continuous for future --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 PRESENT CONTINUOUS — Sắp Xếp Chắc Chắn Trong Tương Lai \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Dùng \u003cstrong\u003eam/is/are + V-ing\u003c/strong\u003e cho kế hoạch/sắp xếp đã chắc chắn (đã đặt lịch, mua vé, hẹn giờ...).\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ We\u003cstrong\u003e're having\u003c/strong\u003e a singing lesson at 4 o'clock. (Chúng tôi có tiết hát lúc 4 giờ — đã lên lịch.)\u003cbr\u003e\r\n            ✓ I\u003cstrong\u003e'm seeing\u003c/strong\u003e the dentist tomorrow. (Ngày mai tôi đi nha sĩ — đã có hẹn.)\u003cbr\u003e\r\n            ✓ They\u003cstrong\u003e're flying\u003c/strong\u003e to Paris next Monday. (Thứ Hai tuần sau họ bay đi Paris — đã mua vé.)\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003eisn't coming\u003c/strong\u003e to the party tonight. (Cô ấy sẽ không đến tiệc tối nay.)\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eAre\u003c/strong\u003e you \u003cstrong\u003eleaving\u003c/strong\u003e tomorrow morning? (Bạn có đi sáng mai không?)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e So sánh: Be going to vs Present Continuous\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eBe going to (ý định/kế hoạch chung):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I\u003cstrong\u003e'm going to learn\u003c/strong\u003e French. (Tôi định học tiếng Pháp — ý định, chưa đăng ký)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePresent Continuous (sắp xếp cụ thể):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I\u003cstrong\u003e'm starting\u003c/strong\u003e French classes on Monday. (Tôi bắt đầu lớp Pháp thứ Hai — đã đăng ký)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dấu hiệu nhận biết:\u003c/strong\u003e Có thời gian/địa điểm cụ thể + đã sắp xếp xong → \u003cstrong\u003ePresent Continuous\u003c/strong\u003e\u003cbr\u003e\r\n            Từ khóa: at 3 o'clock, tomorrow morning, next Monday, tonight (khi đã có hẹn/vé/lịch)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: Comparison table --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 BẢNG SO SÁNH TỔNG HỢP \u003c/h3\u003e\r\n          \u003ctable style=\"width:100%; border-collapse:collapse; margin:0.5rem 0; font-size:0.9em;\"\u003e\r\n            \u003ctr style=\"background:#4CAF50; color:white;\"\u003e\r\n              \u003cth style=\"padding:8px; border:1px solid #ccc;\"\u003eCấu trúc\u003c/th\u003e\r\n              \u003cth style=\"padding:8px; border:1px solid #ccc;\"\u003eKhi nào dùng\u003c/th\u003e\r\n              \u003cth style=\"padding:8px; border:1px solid #ccc;\"\u003eVí dụ\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background:#e8f5e9;\"\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003e\u003cstrong\u003ebe going to\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eKế hoạch đã quyết định trước\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eI'm going to study medicine.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003e\u003cstrong\u003ebe going to\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eDự đoán có bằng chứng\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eLook! It's going to rain!\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background:#e8f5e9;\"\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003e\u003cstrong\u003ewill ('ll)\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eQuyết định tức thì / đề nghị\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eI'll help you carry that.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003e\u003cstrong\u003ewill ('ll)\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eDự đoán chung (I think...)\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eI think she'll win.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background:#e8f5e9;\"\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003e\u003cstrong\u003ewon't\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eDự đoán phủ định / từ chối\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eIt won't be easy.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003e\u003cstrong\u003ePresent Continuous\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eSắp xếp chắc chắn (có hẹn/vé)\u003c/td\u003e\r\n              \u003ctd style=\"padding:8px; border:1px solid #ccc;\"\u003eI'm flying to London on Friday.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 8: Common mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e8 LỖI SAI THƯỜNG GẶP \u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi 1: Trộn will + going to\u003c/strong\u003e\u003cbr\u003e\r\n            I \u003cstrong\u003ewill going to\u003c/strong\u003e visit my grandma.\u003cbr\u003e\r\n            I \u003cstrong\u003eam going to\u003c/strong\u003e visit my grandma. HOẶC I \u003cstrong\u003ewill visit\u003c/strong\u003e my grandma.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 2: Dùng V-ing sau going to\u003c/strong\u003e\u003cbr\u003e\r\n            She's going to \u003cstrong\u003eswimming\u003c/strong\u003e.\u003cbr\u003e\r\n            She's going to \u003cstrong\u003eswim\u003c/strong\u003e. (Sau going to → V nguyên mẫu)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 3: Dùng will + V-ing\u003c/strong\u003e\u003cbr\u003e\r\n            I \u003cstrong\u003ewill going\u003c/strong\u003e to school.\u003cbr\u003e\r\n            I \u003cstrong\u003ewill go\u003c/strong\u003e to school. (Sau will → V nguyên mẫu)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 4: Quên \"be\" trong be going to\u003c/strong\u003e\u003cbr\u003e\r\n            I \u003cstrong\u003egoing to\u003c/strong\u003e buy a new phone.\u003cbr\u003e\r\n            I \u003cstrong\u003eam going to\u003c/strong\u003e buy a new phone.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 5: Dùng will cho kế hoạch đã sắp xếp\u003c/strong\u003e\u003cbr\u003e\r\n            I \u003cstrong\u003ewill meet\u003c/strong\u003e John at 3pm. (đã hẹn từ trước)\u003cbr\u003e\r\n            I\u003cstrong\u003e'm meeting\u003c/strong\u003e John at 3pm. (present continuous cho sắp xếp chắc chắn)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 6: Dùng going to cho quyết định tức thì\u003c/strong\u003e\u003cbr\u003e\r\n            [Điện thoại reo] I\u003cstrong\u003e'm going to answer\u003c/strong\u003e it.\u003cbr\u003e\r\n            [Điện thoại reo] I\u003cstrong\u003e'll answer\u003c/strong\u003e it. (quyết định ngay lúc nói → will)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-1-first-prize\",\"title\":\"Unit 1: First Prize! - Be Going To and Will\",\"grammarTopics\":[\"Be going to\",\"Will and Won't\",\"Present continuous with future meaning\"],\"theory\":{\"brief\":\"We use 'be going to + base form' for plans/decisions made earlier and predictions based on current evidence. We use 'will/won't + base form' for instant decisions, offers, and general predictions. We use the present continuous for definite future arrangements.\",\"examples\":[\"We're going to see a play this evening. (plan)\",\"Look! He's going to fall! (prediction from evidence)\",\"It's raining. I'll take an umbrella. (instant decision)\",\"I won't be famous when I grow up. (prediction)\",\"We're leaving at 10 o'clock tomorrow. (future arrangement)\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"It ___ be a lovely day tomorrow.\",\"answer\":\"'ll\",\"acceptedAnswers\":[\"'ll\",\"will\"],\"hints\":[\"This is a prediction about the future\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \u003cstrong\u003ewill\u003c/strong\u003e (dạng viết tắt là \u003cstrong\u003e'll\u003c/strong\u003e) để đưa ra dự đoán chung về thời tiết hoặc tương lai không có bằng chứng chắc chắn.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu này dự đoán thời tiết ngày mai đẹp ('a lovely day tomorrow') mà không dựa trên bằng chứng hiện tại nên dùng \u003cstrong\u003e'll\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ngày mai sẽ là một ngày đẹp trời.\"},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"I told Suzy to get some biscuits, but I'm sure she ___ forget.\",\"answer\":\"'ll\",\"acceptedAnswers\":[\"'ll\",\"will\"],\"hints\":[\"This is a prediction about what Suzy will do\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \u003cstrong\u003ewill\u003c/strong\u003e (dạng viết tắt là \u003cstrong\u003e'll\u003c/strong\u003e) cho các dự đoán tương lai, đặc biệt sau các từ chỉ sự chắc chắn như 'I'm sure'.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Người nói dự đoán về việc Suzy sẽ quên dựa trên suy nghĩ của mình và đi kèm cụm 'I'm sure' nên dùng \u003cstrong\u003e'll\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã bảo Suzy mua bánh quy, nhưng tôi chắc chắn cô ấy sẽ quên thôi.\"},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"The match isn't on TV. We ___ watch it on the Internet.\",\"answer\":\"'ll\",\"acceptedAnswers\":[\"'ll\",\"will\"],\"hints\":[\"This is an instant decision\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \u003cstrong\u003ewill\u003c/strong\u003e (dạng viết tắt là \u003cstrong\u003e'll\u003c/strong\u003e) cho một quyết định được đưa ra ngay tại thời điểm nói.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Ngay khi biết trận đấu không chiếu trên TV, người nói lập tức đưa ra quyết định xem trên Internet nên dùng \u003cstrong\u003e'll\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Trận đấu không chiếu trên TV. Chúng tôi sẽ xem nó trên mạng Internet.\"},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"In 2050, there ___ be any cars on the roads.\",\"answer\":\"won't\",\"acceptedAnswers\":[\"won't\",\"will not\"],\"hints\":[\"This is a negative prediction about the future\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \u003cstrong\u003ewon't\u003c/strong\u003e (dạng phủ định của \u003cstrong\u003ewill\u003c/strong\u003e) để đưa ra dự đoán phủ định về tương lai xa.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu này dự đoán về năm 2050 và có từ 'any' dùng trong câu phủ định, do đó ta dùng dạng phủ định \u003cstrong\u003ewon't\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Vào năm 2050, sẽ không có chiếc xe ô tô nào trên đường.\"},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"Mum's got a headache. I ___ make her a cup of tea.\",\"answer\":\"'ll\",\"acceptedAnswers\":[\"'ll\",\"will\"],\"hints\":[\"This is an instant decision to help\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \u003cstrong\u003ewill\u003c/strong\u003e (dạng viết tắt là \u003cstrong\u003e'll\u003c/strong\u003e) đ oing\",\"correction\":\"She is going\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cấu trúc tương lai gần: S + am/is/are + going to + V nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chia động từ theo đúng cấu trúc ngữ pháp tương lai được gợi ý.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy sẽ nấu bữa tối cho chúng ta.\",\"hints\":[\"Missing 'is' before 'going to'\"],\"points\":10},{\"id\":183,\"type\":\"error-correct\",\"wrongSentence\":\"They will to go on holiday next summer.\",\"correctSentence\":\"They will go on holiday next summer.\",\"errorWord\":\"will to go\",\"correction\":\"will go\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Sau động từ khuyết thiếu \u003cstrong\u003ewill\u003c/strong\u003e, động từ theo sau phải ở dạng nguyên mẫu không chia.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Sai: \u003cstrong\u003ewill\u003c/strong\u003e to go → Đúng: \u003cstrong\u003ewill\u003c/strong\u003e go\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ sẽ đi nghỉ mát hè tới.\",\"hints\":[\"No 'to' after 'will'\"],\"points\":10},{\"id\":184,\"type\":\"error-correct\",\"wrongSentence\":\"We are go to the park this afternoon.\",\"correctSentence\":\"We are going to the park this afternoon.\",\"errorWord\":\"are go\",\"correction\":\"are going\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Sử dụng cấu trúc tương lai đúng ngữ pháp (will + V hoặc be going to + V).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Sai: \u003cstrong\u003eare\u003c/strong\u003e go → Đúng: \u003cstrong\u003eare\u003c/strong\u003e going\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi sẽ đi công viên chiều nay.\",\"hints\":[\"Present continuous needs V-ing form\"],\"points\":10},{\"id\":185,\"type\":\"error-correct\",\"wrongSentence\":\"He will helps me with my homework.\",\"correctSentence\":\"He will help me with my homework.\",\"errorW Has been practising = evidence of plan → be going to\"],\"points\":10},{\"id\":188,\"type\":\"multiple-choice\",\"question\":\"A: 'I need someone to help me move.' B: 'I ___ help you!'\",\"options\":[\"'m going to\",\"'ll\",\"'m helping\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \u003cstrong\u003ewill\u003c/strong\u003e (dạng viết tắt là \u003cstrong\u003e'll\u003c/strong\u003e) để đưa ra lời đề nghị giúp đỡ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Nghe yêu cầu → tình nguyện giúp → \u003cstrong\u003ewill\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e A: 'Tôi cần người giúp chuyển nhà.' B: 'Tôi sẽ giúp!'\",\"hints\":[\"Volunteering to help → will\"],\"points\":10},{\"id\":189,\"type\":\"multiple-choice\",\"question\":\"In 100 years, I think people ___ on other planets.\",\"options\":[\"are going to live\",\"will live\",\"are living\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng \u003cstrong\u003ewill/won't\u003c/strong\u003e cho các dự đoán tương lai không có bằng chứng chắc chắn hoặc ý kiến cá nhân.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'I think' + tương lai rất xa (100 years) → \u003cstrong\u003ewill\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Trong 100 năm, tôi nghĩ con người sẽ sống trên hành tinh khác.\",\"hints\":[\"'I think' + far future → will\"],\"points\":10},{\"id\":190,\"type\":\"multiple-choice\",\"question\":\"We ___ to Greece this summer. The flights are booked.\",\"options\":[\"will fly\",\"are flying\",\"fly\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì \u003cstrong\u003ehiện tại tiếp diễn\u003c/strong\u003e (am/is/are + V-ing) để diễn tả kế hoạch hay sự sắp xếp chắc chắn trong tương lai.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'The flights \u003cstrong\u003eare\u003c/strong\u003e booked' → đã đặt vé = sắp xếp → hiện tại tiếp diễn\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi sẽ bay đến Hy Lạp hè này. Đã đặt vé.\",\"hints\":[\"Flights booked = arranged → present continuous\"],\"points\":10},{\"id\":191,\"type\":\"error-correct\",\"wrongSentence\":\"We are going to watching a film tonight.\",\"correctSentence\":\"We are going to watch a film tonight.\",\"errorWord\":\"watching\",\"correction\":\"watch\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cấu trúc tương lai gần: S + am/is/are + going to + V nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Sai: \u003cstrong\u003egoing to\u003c/strong\u003e watching → Đúng: \u003cstrong\u003egoing to\u003c/strong\u003e watch\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi sẽ xem phim tối nay.\",\"hints\":[\"After 'going to', use base form, not -ing\"],\"points\":10},{\"id\":192,\"type\":\"error-correct\",\"wrongSentence\":\"I'm not go to tell anyone.\",\"correctSentence\":\"I'm not going to tell anyone.\",\"errorWord\":\"not go to\",\"correction\":\"not going to\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cấu trúc tương lai gần: S + am/is/are + going to + V nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Sai: not go to → Đúng: not \u003cstrong\u003egoing to\u003c/strong\u003e\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi sẽ không nói cho ai.\",\"hints\":[\"Need 'going to' not 'go to'\"],\"points\":10},{\"id\":193,\"type\":\"sentence-build\",\"prompt\":\"I / not / tell / anyone / your secret (will, promise)\",\"instructions\":\"Write a promise using 'won't'.\",\"answer\":\"I won't tell anyone your secret.\",\"acceptedAnswers\":[\"I won't tell anyone your secret.\",\"I won't tell anyone your secret\",\"I will not tell anyone your secret.\",\"I will not tell anyone your secret\"],\"explanation\":\"\u003cstrong\u003eQuy t
