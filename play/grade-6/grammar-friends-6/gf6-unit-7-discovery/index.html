ing\"\u003e1 WHO — Dùng Cho NGƯỜI \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e Danh từ chỉ người + \u003cstrong\u003eWHO\u003c/strong\u003e + động từ / chủ ngữ + động từ\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ He is the boy \u003cstrong\u003ewho\u003c/strong\u003e got lost.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Anh ấy là cậu bé bị lạc.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ The teacher \u003cstrong\u003ewho\u003c/strong\u003e teaches us English is kind.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô giáo dạy tiếng Anh cho chúng tôi rất tốt bụng.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ I know a man \u003cstrong\u003ewho\u003c/strong\u003e can speak five languages.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Tôi biết một người đàn ông nói được năm thứ tiếng.)\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Danh từ trước là NGƯỜI (boy, girl, man, woman, teacher, doctor...) → dùng \u003cstrong\u003eWHO\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: WHICH --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 WHICH — Dùng Cho VẬT / ĐỘNG VẬT \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e Danh từ chỉ vật/động vật + \u003cstrong\u003eWHICH\u003c/strong\u003e + động từ / chủ ngữ + động từ\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ You need a map \u003cstrong\u003ewhich\u003c/strong\u003e shows the area near the river.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Bạn cần một bản đồ chỉ khu vực gần sông.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ She has a cat \u003cstrong\u003ewhich\u003c/strong\u003e is very fluffy.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy có một con mèo rất xù.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ I bought a book \u003cstrong\u003ewhich\u003c/strong\u003e has many pictures.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Tôi mua một cuốn sách có nhiều hình.)\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Danh từ trước là VẬT hoặc ĐỘNG VẬT (book, car, dog, cat, film...) → dùng \u003cstrong\u003eWHICH\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: WHERE --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 WHERE — Dùng Cho NƠI CHỐN \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e Danh từ chỉ nơi chốn + \u003cstrong\u003eWHERE\u003c/strong\u003e + chủ ngữ + động từ\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ That's the park \u003cstrong\u003ewhere\u003c/strong\u003e the treasure hunt is taking place.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Đó là công viên nơi cuộc săn kho báu đang diễn ra.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ This is the school \u003cstrong\u003ewhere\u003c/strong\u003e my sister studies.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Đây là trường nơi chị tôi học.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ Do you know the restaurant \u003cstrong\u003ewhere\u003c/strong\u003e they serve pizza?\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Bạn có biết nhà hàng nơi họ phục vụ pizza không?)\r\n          \u003c/div\u003e\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Danh từ trước là NƠI CHỐN (park, school, city, house, hospital...) → dùng \u003cstrong\u003eWHERE\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: THAT --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 THAT — Thay Cho WHO / WHICH (Nhưng KHÔNG Thay WHERE!) \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eQuy tắc:\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cul\u003e\r\n            \u003cli\u003e \u003cstrong\u003eTHAT\u003c/strong\u003e thay được \u003cstrong\u003eWHO\u003c/strong\u003e (cho người): \u003cem\u003eThe boy \u003cstrong\u003ethat\u003c/strong\u003e got lost = The boy \u003cstrong\u003ewho\u003c/strong\u003e got lost\u003c/em\u003e\u003c/li\u003e\r\n            \u003cli\u003e \u003cstrong\u003eTHAT\u003c/strong\u003e thay được \u003cstrong\u003eWHICH\u003c/strong\u003e (cho vật): \u003cem\u003eA sport \u003cstrong\u003ethat\u003c/strong\u003e exercises the mind = A sport \u003cstrong\u003ewhich\u003c/strong\u003e exercises the mind\u003c/em\u003e\u003c/li\u003e\r\n            \u003cli\u003e \u003cstrong\u003eTHAT KHÔNG\u003c/strong\u003e thay được \u003cstrong\u003eWHERE\u003c/strong\u003e: \u003cem\u003eThe park \u003cstrong\u003ewhere\u003c/strong\u003e we play ≠ The park \u003cstrong\u003ethat\u003c/strong\u003e we play\u003c/em\u003e\u003c/li\u003e\r\n          \u003c/ul\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ He's a man \u003cstrong\u003ethat\u003c/strong\u003e loves travelling. (= who)\u003cbr\u003e\r\n            ✓ Orienteering is a sport \u003cstrong\u003ethat\u003c/strong\u003e exercises the mind. (= which)\u003cbr\u003e\r\n            This is the park \u003cstrong\u003ethat\u003c/strong\u003e we play. (SAI! Phải dùng WHERE)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: When can we use THAT? --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Khi Nào Dùng / Không Dùng THAT? \u003c/h3\u003e\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Dùng THAT khi:\u003c/strong\u003e\u003cbr\u003e\r\n            • Thay WHO cho người: \u003cem\u003eThe girl \u003cstrong\u003ethat\u003c/strong\u003e sits next to me...\u003c/em\u003e\u003cbr\u003e\r\n            • Thay WHICH cho vật/động vật: \u003cem\u003eThe book \u003cstrong\u003ethat\u003c/strong\u003e I read...\u003c/em\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003e KHÔNG dùng THAT khi:\u003c/strong\u003e\u003cbr\u003e\r\n            • Thay WHERE cho nơi chốn: \u003cem\u003eThe place \u003cstrong\u003ewhere\u003c/strong\u003e I live\u003c/em\u003e (KHÔNG: the place that I live)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Defining Relative Clauses --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Mệnh Đề Quan Hệ Xác Định (Defining Relative Clauses)\u003c/h3\u003e\r\n          \u003cp\u003eĐây là loại mệnh đề quan hệ \u003cstrong\u003exác định\u003c/strong\u003e — thông tin CẦN THIẾT để biết người/vật/nơi nào.\u003c/p\u003e\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eĐặc điểm:\u003c/strong\u003e\u003cbr\u003e\r\n            • \u003cstrong\u003eKHÔNG\u003c/strong\u003e có dấu phẩy trước who/which/where\u003cbr\u003e\r\n            • Thông tin quan trọng → nếu bỏ thì không hiểu câu\u003cbr\u003e\r\n            • Có thể dùng THAT thay who/which\u003cbr\u003e\u003cbr\u003e\r\n            ✓ The boy \u003cstrong\u003ewho got lost\u003c/strong\u003e was scared. (cậu bé NÀO? → cậu bé bị lạc)\u003cbr\u003e\r\n            ✓ I need a map \u003cstrong\u003ewhich shows the area\u003c/strong\u003e. (bản đồ NÀO? → bản đồ chỉ khu vực)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: Common Mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 Lỗi Sai Thường Gặp \u003c/h3\u003e\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi 1:\u003c/strong\u003e Dùng WHO cho vật/động vật\u003cbr\u003e\r\n            The dog \u003cstrong\u003ewho\u003c/strong\u003e bit me... → The dog \u003cstrong\u003ewhich\u003c/strong\u003e bit me...\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 2:\u003c/strong\u003e Dùng WHICH cho người\u003cbr\u003e\r\n            The girl \u003cstrong\u003ewhich\u003c/strong\u003e won... → The girl \u003cstrong\u003ewho\u003c/strong\u003e won...\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 3:\u003c/strong\u003e Dùng WHERE khi không phải nơi chốn\u003cbr\u003e\r\n            The boy \u003cstrong\u003ewhere\u003c/strong\u003e lives next door... → The boy \u003cstrong\u003ewho\u003c/strong\u003e lives next door...\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 4:\u003c/strong\u003e Dùng WHICH thay WHERE cho nơi chốn\u003cbr\u003e\r\n            The hotel \u003cstrong\u003ewhich\u003c/strong\u003e we stayed... → The hotel \u003cstrong\u003ewhere\u003c/strong\u003e we stayed...\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 5:\u003c/strong\u003e Dùng THAT thay WHERE\u003cbr\u003e\r\n            The park \u003cstrong\u003ethat\u003c/strong\u003e we play... → The park \u003cstrong\u003ewhere\u003c/strong\u003e we play...\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-7-discovery\",\"title\":\"Unit 7: Discovery - Relative Pronouns (Đại Từ Quan Hệ)\",\"grammarTopics\":[\"Relative pronouns: who\",\"Relative pronouns: which\",\"Relative pronoun: where\",\"Replacing who/which with that\",\"Defining relative clauses\"],\"theory\":{\"brief\":\"Đại từ quan hệ (who, which, where) dùng sau danh từ để bổ sung thông tin. WHO cho người, WHICH cho vật/động vật, WHERE cho nơi chốn. THAT có thể thay who/which nhưng KHÔNG thay where.\",\"rules\":[\"WHO: Dùng cho NGƯỜI — The boy who got lost was scared.\",\"WHICH: Dùng cho VẬT / ĐỘNG VẬT — The map which shows the river is useful.\",\"WHERE: Dùng cho NƠI CHỐN — That's the park where we play.\",\"THAT: Thay được WHO hoặc WHICH — The boy that got lost / The map that shows...\",\"THAT KHÔNG thay WHERE — KHÔNG nói: the park that we play \",\"Đây là mệnh đề quan hệ XÁC ĐỊNH (defining) — thông tin cần thiết, không có dấu phẩy\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"The girl ___ sits next to me is very clever.\",\"answer\":\"who\",\"acceptedAnswers\":[\"who\",\"that\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Sử dụng đại từ quan hệ \u003cstrong\u003ewho\u003c/strong\u003e (hoặc \u003cstrong\u003ethat\u003c/strong\u003e) làm chủ ngữ thay thế cho danh từ chỉ người đứng trước.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Danh từ đứng trước khoảng trống là \u003cstrong\u003e'girl'\u003c/strong\u003e chỉ người, nên các em điền đại từ quan hệ \u003cstrong\u003ewho\u003c/strong\u003e (hoặc \u003cstrong\u003ethat\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô gái ngồi cạnh tớ rất thông minh.\",\"hints\":[\"Người → who\"],\"points\":10},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"I bought a book ___ has many pictures.\",\"answer\":\"which\",\"acceptedAnswers\":[\"which\",\"that\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Sử dụng đại từ quan hệ \u003cstrong\u003ewhich\u003c/strong\u003e (hoặc \u003cstrong\u003ethat\u003c/strong\u003e) làm chủ ngữ/tân ngữ thay thế cho danh từ chỉ vật hoặc động vật.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Danh từ đứng trước khoảng trống là \u003cstrong\u003e'book'\u003c/strong\u003e chỉ vật hoặc động vật, nên các em điền đại từ quan hệ \u003cstrong\u003ewhich\u003c/strong\u003e (hoặc \u003cstrong\u003ethat\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tớ đã mua một cuốn sách có nhiều tranh ảnh.\",\"hints\":[\"Vật → which\"],\"points\":10},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"This is the park ___ we play football.\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Sử dụng trạng từ quan hệ \u003cstrong\u003ewhere\u003c/strong\u003e thay thế cho danh từ chỉ nơi chốn để bắt đầu mệnh đề quan hệ chỉ nơi diễn ra hành động.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Danh từ đứng trước khoảng trống là \u003cstrong\u003e'park'\u003c/strong\u003e chỉ địa điểm/nơi chốn, nên các em điền trạng từ quan hệ \u003cstrong\u003ewhere\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Đây là công viên nơi chúng tớ chơi đá bóng.\",\"hints\":[\"Nơi chốn → where\"],\"points\":10},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"The man ___ lives next door is a doctor.\",\"answer\":\"who\",\"acceptedAnswers\":[\"who\",\"that\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Sử dụng đại từ quan hệ \u003cstrong\u003ewho\u003c/strong\u003e (hoặc \u003cstrong\u003ethat\u003c/strong
