u003c/strong\u003e — dùng cho người (subject/object)\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ewhich / that\u003c/strong\u003e — dùng cho vật\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ewhere\u003c/strong\u003e — dùng cho nơi chốn\u003c/p\u003e\r\n          \u003cp\u003e\u003cem\u003eThat's the man \u003cstrong\u003ewho\u003c/strong\u003e helped us.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e\u003cem\u003eThis is the place \u003cstrong\u003ewhere\u003c/strong\u003e I was born.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2. Past Perfect (Quá khứ hoàn thành)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e had + past participle (V3)\u003c/p\u003e\r\n          \u003cp\u003eDiễn tả hành động xảy ra trước một hành động khác trong quá khứ.\u003c/p\u003e\r\n          \u003cp\u003e\u003cem\u003eShe was sorry because she \u003cstrong\u003ehad taken\u003c/strong\u003e my coat by mistake.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3. Third Conditional (Câu điều kiện loại 3)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e If + past perfect, would have + past participle\u003c/p\u003e\r\n          \u003cp\u003eDiễn tả điều không có thật trong quá khứ.\u003c/p\u003e\r\n          \u003cp\u003e\u003cem\u003eIf Ryan \u003cstrong\u003ehad had\u003c/strong\u003e a football pitch, he \u003cstrong\u003ewould have played\u003c/strong\u003e football all day.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4. Modal Verbs (Động từ khuyết thiếu)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003emust\u003c/strong\u003e — bắt buộc, nghĩa vụ mạnh\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003emustn't\u003c/strong\u003e — cấm, không được phép\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ehave to\u003c/strong\u003e — phải (nghĩa vụ bên ngoài)\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003edon't have to\u003c/strong\u003e — không cần thiết\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eshould / shouldn't\u003c/strong\u003e — nên / không nên (lời khuyên)\u003c/p\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-review-3-units-7-9\",\"title\":\"Review 3: Units 7-9\",\"grammarTopics\":[\"Relative pronouns\",\"Past perfect\",\"Third conditional\",\"Modal verbs\"],\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"instruction\":\"Write sentences using who, which or where.\",\"question\":\"Is this the CD _______ Jason bought you?\",\"answer\":\"which\",\"acceptedAnswers\":[\"which\",\"that\"],\"hints\":[\"Use a relative pronoun for things\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhich\u003c/strong\u003e dùng cho VẬT để thay thế và bổ nghĩa cho danh từ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'CD' là vật → dùng \u003cstrong\u003ewhich\u003c/strong\u003e (cũng có thể dùng that).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Đây có phải đĩa CD mà Jason mua cho bạn không?\"},{\"id\":2,\"type\":\"fill-blank\",\"instruction\":\"Write sentences using who, which or where.\",\"question\":\"You can see the street _______ Dad lived when he was a boy.\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"],\"hints\":[\"Use a relative pronoun for places\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhere\u003c/strong\u003e dùng cho NƠI CHỐN.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'the street' là nơi chốn → dùng \u003cstrong\u003ewhere\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bạn có thể thấy con phố nơi bố sống hồi còn nhỏ.\"},{\"id\":3,\"type\":\"fill-blank\",\"instruction\":\"Write sentences using who, which or where.\",\"question\":\"We stayed in a hotel _______ didn't have a restaurant.\",\"answer\":\"which\",\"acceptedAnswers\":[\"which\",\"that\"],\"hints\":[\"Use a relative pronoun for things\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhich\u003c/strong\u003e dùng cho VẬT.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'a hotel' là vật → dùng \u003cstrong\u003ewhich\u003c/strong\u003e (hoặc that).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi đã ở một khách sạn không có nhà hàng.\"},{\"id\":4,\"type\":\"fill-blank\",\"instruction\":\"Write sentences using who, which or where.\",\"question\":\"I searched the Internet the site _______ I'd used before.\",\"answer\":\"which\",\"acceptedAnswers\":[\"which\",\"that\"],\"hints\":[\"Use a relative pronoun for things\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhich\u003c/strong\u003e dùng cho VẬT.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'the site' (trang web) là vật → dùng \u003cstrong\u003ewhich\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã tìm trang web mà trước đó tôi từng dùng.\"},{\"id\":5,\"type\":\"fill-blank\",\"instruction\":\"Write sentences using who, which or where.\",\"question\":\"My mum's someone _______ would help anyone.\",\"answer\":\"who\",\"acceptedAnswers\":[\"who\",\"that\"],\"hints\":[\"Use a relative pronoun for people\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewho\u003c/strong\u003e dùng cho NGƯỜI.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'someone' chỉ người → dùng \u003cstrong\u003ewho\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mẹ tôi là người sẵn sàng giúp đỡ bất kỳ ai.\"},{\"id\":6,\"type\":\"fill-blank\",\"instruction\":\"Write sentences using who, which or where.\",\"question\":\"Sam would like to live in a place _______ there are lots of parks.\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"],\"hints\":[\"Use a relative pronoun for places\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhere\u003c/strong\u003e dùng cho NƠI CHỐN.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'a place' là nơi chốn → dùng \u003cstrong\u003ewhere\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Sam muốn sống ở nơi có nhiều công viên.\"},{\"id\":7,\"type\":\"fill-blank\",\"instruction\":\"Write sentences using who, which or where.\",\"question\":\"We need to buy a cake _______ is big enough for seven people.\",\"answer\":\"which\",\"acceptedAnswers\":[\"which\",\"that\"],\"hints\":[\"Use a relative pronoun for things\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhich\u003c/strong\u003e dùng cho VẬT.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'a cake' là vật → dùng \u003cstrong\u003ewhich\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng ta cần mua một chiếc bánh đủ lớn cho bảy người.\"},{\"id\":8,\"type\":\"fill-blank\",\"instruction\":\"Complete the sentences using that or where.\",\"question\":\"I'd like to have a garden _______ I can grow lots of flowers.\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"],\"hints\":[\"Is it a place?\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhere\u003c/strong\u003e dùng cho NƠI CHỐN.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'a garden' là nơi chốn → dùng \u003cstrong\u003ewhere\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi muốn có một khu vườn nơi tôi có thể trồng nhiều hoa.\"},{\"id\":9,\"type\":\"fill-blank\",\"instruction\":\"Complete the sentences using that or where.\",\"question\":\"That's the girl _______ painted the picture in the school hall.\",\"answer\":\"that\",\"acceptedAnswers\":[\"that\",\"who\"],\"hints\":[\"Is it a person or place?\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ethat\u003c/strong\u003e có thể thay cho who/which (ở đây chỉ người).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'the girl' là người → dùng \u003cstrong\u003ethat\u003c/strong\u003e (hoặc who).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Đó là cô bé đã vẽ bức tranh trong hội trường trường.\"},{\"id\":10,\"type\":\"fill-blank\",\"instruction\":\"Complete the sentences using that or where.\",\"question\":\"Where's the school _______ you met Gemma?\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"],\"hints\":[\"Is it a place?\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e \u003cstrong\u003ewhere\u003c/strong\u003e dùng cho NƠI CHỐN.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'the school' là nơi chốn → dùng \u003cstrong\u003ewhere\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ngôi trường nơi bạn gặp Gemma ở đâu?\"},{\"id\":11,\"type\":\"fill-blank\",\"instruction\":\"Complete using the past perfect.\",\"question\":\"She was sorry because she _______ (take) my coat by mistake.\",\"answer\":\"had taken\",\"acceptedAnswers\":[\"had taken\",\"'d taken\"],\"hints\":[\"Use had + past participle\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Quá khứ hoàn thành (\u003cstrong\u003ehad + V3\u003c/strong\u003e) cho hành động xảy ra trước một hành động/cảm xúc khác trong quá khứ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/stron nise him because he _______ (grow) a beard.\",\"answer\":\"had grown\",\"acceptedAnswers\":[\"had grown\",\"'d grown\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Grow a beard' xảy ra trước 'didn't recognise' → past perfect.\u003cbr\u003e• Grown là past participle của grow.\",\"hints\":[\"had + past participle of 'grow'\"],\"points\":10},{\"id\":75,\"type\":\"fill-blank\",\"instruction\":\"Complete with must, mustn't, have to or don't have to.\",\"question\":\"You _______ run in the corridors. It's dangerous.\",\"answer\":\"mustn't\",\"acceptedAnswers\":[\"mustn't\",\"must not\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Nguy hiểm, bị cấm → MUSTN'T.\u003cbr\u003e• Mustn't = cấm.\",\"hints\":[\"Cấm → mustn't\"],\"points\":10},{\"id\":76,\"type\":\"fill-blank\",\"instruction\":\"Complete with should or shouldn't.\",\"question\":\"You've got a headache. You _______ take some medicine.\",\"answer\":\"should\",\"acceptedAnswers\":[\"should\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Lời khuyên → SHOULD.\u003cbr\u003e• Should = nên.\",\"hints\":[\"Lời khuyên → should\"],\"points\":10},{\"id\":77,\"type\":\"fill-blank\",\"instruction\":\"Complete using the correct relative pronoun (who, which, where).\",\"question\":\"The phone _______ I bought last week has already broken.\",\"answer\":\"which\",\"acceptedAnswers\":[\"which\",\"that\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Phone là vật → dùng WHICH.\u003cbr\u003e• WHICH làm tân ngữ trong mệnh đề quan hệ.\",\"hints\":[\"Phone là vật\"],\"points\":10},{\"id\":78,\"type\":\"fill-blank\",\"instruction\":\"Complete using the correct relative pronoun (who, which, where).\",\"question\":\"The park _______ we go jogging is near our house.\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Park là nơi chốn → dùng WHERE.\u003cbr\u003e• WHERE = in which.\",\"hints\":[\"Park là nơi chốn\"],\"points\":10},{\"id\":79,\"type\":\"fill-blank\",\"instruction\":\"Complete using the past perfect (had + past participle).\",\"question\":\"We _______ (not finish) dinner when the phone rang.\",\"answer\":\"hadn't finished\",\"acceptedAnswers\":[\"hadn't finished\",\"had not finished\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Not finish' đang xảy ra trước 'phone rang' → past perfect phủ định.\u003cbr\u003e• Hadn't + V3.\",\"hints\":[\"Phủ định: hadn't + V3\"],\"points\":10},{\"id\":80,\"type\":\"fill-blank\",\"instruction\":\"Complete with must, mustn't, have to or don't have to.\",\"question\":\"Dad says I _______ tidy my room before I go out.\",\"answer\":\"have to\",\"acceptedAnswers\":[\"have to\",\"must\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Bố yêu cầu → bắt buộc → HAVE TO.\u003cbr\u003e• Have to = cần phải (bắt buộc từ người khác).\",\"hints\":[\"Bắt buộc → have to\"],\"points\":10},{\"id\":81,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct relative pronoun.\",\"question\":\"The boy _______ won the race is my cousin.\",\"options\":[\"which\",\"who\",\"where\",\"what\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Boy là người → dùng WHO.\u003cbr\u003e• WHICH cho vật, WHERE cho nơi chốn.\",\"points\":10,\"_needsGesture\":true},{\"id\":82,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct relative pronoun.\",\"question\":\"That's the house _______ Shakespeare was born.\",\"options\":[\"who\",\"which\",\"where\",\"that\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• House là nơi chốn → dùng WHERE.\u003cbr\u003e• WHERE = in which (ở nơi mà).\",\"points\":10,\"_needsGesture\":true},{\"id\":83,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct relative pronoun.\",\"question\":\"The book _______ I'm reading is very interesting.\",\"options\":[\"who\",\"which\",\"where\",\"whom\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Book là vật → dùng WHICH.\u003cbr\u003e• WHICH làm tân ngữ trong mệnh đề quan hệ.\",\"points\":10,\"_needsGesture\":true},{\"id\":84,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct relative pronoun.\",\"question\":\"She's the singer _______ I told you about.\",\"options\":[\"which\",\"where\",\"who\",\"what\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Singer là người → dùng WHO.\u003cbr\u003e• WHO có thể làm tân ngữ (the singer who I told you about).\",\"points\":10,\"_needsGesture\":true},{\"id\":85,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct past perfect form.\",\"question\":\"When we got to the station, the train _______.\",\"options\":[\"already left\",\"had already left\",\"has already left\",\"already had left\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Tàu rời đi TRƯỚC khi chúng tôi đến → past perfect.\u003cbr\u003e• Had already left: already đứng giữa had và V3.\",\"points\":10,\"_needsGesture\":true},{\"id\":86,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct past perfect form.\",\"question\":\"She was upset because she _______ her favourite ring.\",\"options\":[\"lost\",\"has lost\",\"had lost\",\"was losing\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Lose' xảy ra trước 'was upset' → past perfect.\u003cbr\u003e• Had lost = đã mất (trước thời điểm buồn).\",\"points\":10,\"_needsGesture\":true},{\"id\":87,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct past perfect form.\",\"question\":\"_______ you ever _______ sushi before you went to Japan?\",\"options\":[\"Had / eaten\",\"Have / eaten\",\"Did / eat\",\"Were / eating\"],\"correctIndex\":0,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Hỏi về trải nghiệm trước một thời điểm quá khứ → past perfect question.\u003cbr\u003e• Had + S + ever + V3?\",\"points\":10,\"_needsGesture\":true},{\"id\":88,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct third conditional sentence.\",\"question\":\"If I _______ harder, I would have passed the exam.\",\"options\":[\"studied\",\"had studied\",\"have studied\",\"would study\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Third conditional: If + had + V3, would have + V3.\u003cbr\u003e• 'Had studied' là past perfect trong mệnh đề if.\",\"points\":10,\"_needsGesture\":true},{\"id\":89,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct third conditional sentence.\",\"question\":\"If she had known about the party, she _______.\",\"options\":[\"would come\",\"would have come\",\"will come\",\"had come\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Third conditional: If + had + V3, would have + V3.\u003cbr\u003e• Mệnh đề chính: would have + come.\",\"points\":10,\"_needsGesture\":true},{\"id\":90,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct modal verb.\",\"question\":\"You _______ park here. Look at the sign — it says 'No Parking'.\",\"options\":[\"don't have to\",\"mustn't\",\"shouldn't\",\"haven't to\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Biển cấm đỗ xe → MUSTN'T (cấm).\u003cbr\u003e• Mustn't = không được phép.\",\"points\":10,\"_needsGesture\":true},{\"id\":91,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct modal verb.\",\"question\":\"You've got a test tomorrow. You _______ study tonight.\",\"options\":[\"mustn't\",\"don't have to\",\"should\",\"shouldn't\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Lời khuyên nên học → SHOULD.\u003cbr\u003e• Should = nên (lời khuyên).\",\"points\":10,\"_needsGesture\":true},{\"id\":92,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct modal verb.\",\"question\":\"The concert is free. You _______ buy a ticket.\",\"options\":[\"mustn't\",\"don't have to\",\"must\",\"shouldn't\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Miễn phí → không cần mua vé → DON'T HAVE TO.\u003cbr\u003e• Don't have to = không cần thiết.\",\"points\":10,\"_needsGesture\":true},{\"id\":93,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct modal verb.\",\"question\":\"You _______ smoke in the school. It is strictly forbidden.\",\"options\":[\"don't have to\",\"should\",\"mustn't\",\"must\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Nghiêm cấm → MUSTN'T.\u003cbr\u003e• Mustn't = cấm, không được phép.\",\"points\":10,\"_needsGesture\":true},{\"id\":94,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"If we had left earlier, we _______ the flight.\",\"options\":[\"won't miss\",\"wouldn't miss\",\"wouldn't have missed\",\"didn't miss\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Third conditional: If + had + V3, would have + V3.\u003cbr\u003e• Wouldn't have missed = đã không bị lỡ.\",\"points\":10,\"_needsGesture\":true},{\"id\":95,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct past perfect form.\",\"question\":\"I couldn't open the door because I _______ orrectIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Third conditional mệnh đề if: had + V3.\u003cbr\u003e• Had brought = đã mang theo.\",\"points\":10,\"_needsGesture\":true},{\"id\":100,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"The woman _______ answered the phone was very rude.\",\"options\":[\"which\",\"where\",\"who\",\"whom\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Woman là người → dùng WHO.\u003cbr\u003e• WHO làm chủ ngữ trong mệnh đề quan hệ.\",\"points\":10,\"_needsGesture\":true},{\"id\":101,\"type\":\"sentence-build\",\"instruction\":\"Write a third conditional sentence.\",\"prompt\":\"I / not be late → I / not miss the bus\",\"answer\":\"If I hadn't been late, I wouldn't have missed the bus.\",\"acceptedAnswers\":[\"If I hadn't been late, I wouldn't have missed the bus.\",\"If I hadn't been late, I wouldn't have missed the bus\",\"If I had not been late, I would not have missed the bus.\",\"If I had not been late, I would not have missed the bus\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Third conditional phủ định: If + hadn't + V3, wouldn't have + V3.\u003cbr\u003e• Tình huống tưởng tượng trong quá khứ: nếu tôi không đến muộn.\",\"hints\":[\"If + hadn't + V3, wouldn't have + V3\"],\"points\":10},{\"id\":102,\"type\":\"sentence-build\",\"instruction\":\"Write a third conditional sentence.\",\"prompt\":\"we / study harder → we / pass the test\",\"answer\":\"If we had studied harder, we would have passed the test.\",\"acceptedAnswers\":[\"If we had studied harder, we would have passed the test.\",\"If we had studied harder, we would have passed the test\",\"If we'd studied harder, we'd have passed the test.\",\"If we'd studied harder, we'd have passed the test\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e ,\"acceptedAnswers\":[\"wouldn't have missed\",\"would not have missed\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Blank 1: mệnh đề if → past perfect: had left.\u003cbr\u003e• Blank 2: mệnh đề chính phủ định → wouldn't have missed.\",\"points\":15},{\"id\":170,\"type\":\"fill-blank-mixed\",\"instruction\":\"Complete with the correct relative pronouns.\",\"template\":\"The city _1_ I was born is famous for the museum _2_ has thousands of paintings.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(place)\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"]},{\"blankId\":2,\"hint\":\"(thing)\",\"answer\":\"which\",\"acceptedAnswers\":[\"which\",\"that\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Blank 1: 'city' là nơi chốn → WHERE.\u003cbr\u003e• Blank 2: 'museum' là vật → WHICH.\",\"points\":15},{\"id\":171,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"If he _______ the truth, he wouldn't have been so angry.\",\"options\":[\"knew\",\"had known\",\"has known\",\"would know\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Third conditional mệnh đề if: had + V3.\u003cbr\u003e• Had known = đã biết (quá khứ không có thật).\",\"points\":10,\"_needsGesture\":true},{\"id\":172,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"The train _______ by the time we reached the station.\",\"options\":[\"left\",\"has left\",\"had left\",\"was leaving\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Leave' xảy ra trước 'reached' → past perfect.\u003cbr\u003e• Had left = đã rời đi (trước khi đến).\",\"points\":10,\"_needsGesture\":true},{\"id\":173,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"That's the shop _______ I bought my new trainers.\",\"options\":[\"who\",\"which\",\"where\",\"that\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Shop là nơi chốn → WHERE.\u003cbr\u003e• WHERE = at/in which.\",\"points\":10,\"_needsGesture\":true},{\"id\":174,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"You _______ wash your hands before eating. It's important for hygiene.\",\"options\":[\"don't have to\",\"mustn't\",\"should\",\"shouldn't\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Lời khuyên vệ sinh → SHOULD.\u003cbr\u003e• Should = nên (lời khuyên).\",\"points\":10,\"_needsGesture\":true},{\"id\":175,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"She didn't recognise him because he _______ a lot of weight.\",\"options\":[\"lost\",\"has lost\",\"had lost\",\"was losing\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Lose weight' xảy ra trước 'didn't recognise' → past perfect.\u003cbr\u003e• Had lost.\",\"points\":10,\"_needsGesture\":true},{\"id\":176,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"The dog _______ was barking all night belongs to our neighbour.\",\"options\":[\"who\",\"which\",\"where\",\"whom\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Dog là động vật → dùng WHICH.\u003cbr\u003e• WHO chỉ cho người.\",\"points\":10,\"_needsGesture\":true},{\"id\":177,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"It's a holiday tomorrow. We _______ go to work.\",\"options\":[\"mustn't\",\"don't have to\",\"must\",\"should\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Ngày nghỉ, không cần đi làm → DON'T HAVE TO.\u003cbr\u003e• Don't have to = không cần thiết.\",\"points\":10,\"_needsGesture\":true},{\"id\":178,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"If we _______ a taxi, we would have arrived on time.\",\"options\":[\"took\",\"take\",\"had taken\",\"would take\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Third conditional mệnh đề if: had + V3.\u003cbr\u003e• Had taken = đã đi (taxi).\",\"points\":10,\"_needsGesture\":true},{\"id\":179,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"You _______ cross the road without looking. It's very dangerous.\",\"options\":[\"should\",\"don't have to\",\"mustn't\",\"must\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Nguy hiểm, cấm → MUSTN'T.\u003cbr\u003e• Mustn't = không được phép.\",\"points\":10,\"_needsGesture\":true},{\"id\":180,\"type\":\"multiple-choice\",\"instruction\":\"Choose the correct answer.\",\"question\":\"_______ he finished his homework before he went to bed?\",\"options\":[\"Has\",\"Had\",\"Did\",\"Was\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu hỏi past perfect: Had + S + V3?\u003cbr\u003e• 'Finish' xảy ra trước 'went to bed'.\",\"points\":10,\"_needsGesture\":true},{\"id\":181,\"type\":\"fill-blank\",\"instruction\":\"Complete using the past perfect (had + past participle).\",\"question\":\"The shop _______ (close) by the time we got there.\",\"answer\":\"had closed\",\"acceptedAnswers\":[\"had closed\",\"'d closed\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Close' xảy ra trước 'got there' → past perfect.\u003cbr\u003e• Had closed.\",\"hints\":[\"had + V3\"],\"points\":10},{\"id\":182,\"type\":\"fill-blank\",\"instruction\":\"Complete using the correct relative pronoun (who, which, where).\",\"question\":\"The children _______ live next door are very noisy.\",\"answer\":\"who\",\"acceptedAnswers\":[\"who\",\"that\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Children là người → WHO.\u003cbr\u003e• WHO làm chủ ngữ trong mệnh đề quan hệ.\",\"hints\":[\"Children là người\"],\"points\":10},{\"id\":183,\"type\":\"fill-blank\",\"instruction\":\"Complete with must, mustn't, have to or don't have to.\",\"question\":\"You _______ be 18 to drive a car in most countries.\",\"answer\":\"have to\",\"acceptedAnswers\":[\"have to\",\"must\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Luật pháp quy định → HAVE TO / MUST.\u003cbr\u003e• Have to = cần phải (bắt buộc).\",\"hints\":[\"Luật pháp → have to / must\"],\"points\":10},{\"id\":184,\"type\":\"fill-blank\",\"instruction\":\"Complete using the past perfect (had + past participle).\",\"question\":\"She _______ (never fly) before her trip to New York.\",\"answer\":\"had never flown\",\"acceptedAnswers\":[\"had never flown\",\"'d never flown\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Never fly' trước 'trip to New York' → past perfect.\u003cbr\u003e• Had never flown. Flown là V3 của fly.\",\"hints\":[\"had + never + V3 of 'fly'\"],\"points\":10},{\"id\":185,\"type\":\"fill-blank\",\"instruction\":\"Complete using the correct relative pronoun (who, which, where).\",\"question\":\"I love the café _______ they serve amazing hot chocolate.\",\"answer\":\"where\",\"acceptedAnswers\":[\"where\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Café là nơi chốn → WHERE.\u003cbr\u003e• WHERE = in which.\",\"hints\":[\"Café là nơi chốn\"],\"points\":10},{\"id\":186,\"type\":\"fill-blank\",\"instruction\":\"Complete with should or shouldn't.\",\"question\":\"He's got a toothache. He _______ se
