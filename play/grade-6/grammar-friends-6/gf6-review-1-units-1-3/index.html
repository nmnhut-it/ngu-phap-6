strong\u003e kế hoạch đã quyết định trước: \u003cem\u003eI'm going to be a doctor.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eWill:\u003c/strong\u003e quyết định tức thời / dự đoán: \u003cem\u003eI'll answer the door.\u003c/em\u003e\u003c/p\u003e\r\n          \u003cp\u003eCả hai có thể dùng cho dự đoán dựa trên bằng chứng: \u003cem\u003eIt's started to rain. We're going to / We'll get wet.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2. Present Continuous for Future\u003c/h3\u003e\r\n          \u003cp\u003eDùng hiện tại tiếp diễn cho kế hoạch đã sắp xếp cụ thể (thời gian, địa điểm).\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: \u003cem\u003eWe're going after breakfast at 8 o'clock.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3. First Conditional\u003c/h3\u003e\r\n          \u003cp\u003eIf + hiện tại đơn, will + V (khả năng thực tế ở tương lai)\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: \u003cem\u003eIf we go back, we'll know where we are.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4. Second Conditional\u003c/h3\u003e\r\n          \u003cp\u003eIf + quá khứ đơn, would + V (tình huống không thực / giả định)\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: \u003cem\u003eIf we read the map correctly, we wouldn't get lost.\u003c/em\u003e\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5. Present Perfect\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003esince\u003c/strong\u003e + mốc thời gian / \u003cstrong\u003efor\u003c/strong\u003e + khoảng thời gian\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003ealready/just\u003c/strong\u003e: trước động từ chính / \u003cstrong\u003eyet/before\u003c/strong\u003e: cuối câu\u003c/p\u003e\r\n          \u003cp\u003ePhân biệt: past simple (hành động đã kết thúc) vs present perfect (còn liên quan hiện tại)\u003c/p\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-review-1-units-1-3\",\"title\":\"Review 1: Units 1-3\",\"grammarTopics\":[\"Be going to and will\",\"Present continuous for future\",\"First conditional\",\"Second conditional\",\"Present perfect with for/since\",\"Present perfect with already/yet\",\"Past simple vs present perfect\"],\"theory\":{\"brief\":\"Ôn tập Units 1-3: be going to (kế hoạch) vs will (quyết định tức thời/dự đoán); hiện tại tiếp diễn cho tương lai (kế hoạch đã sắp xếp); câu điều kiện loại 1 (If + hiện tại đơn, will + V); câu điều kiện loại 2 (If + quá khứ đơn, would + V); hiện tại hoàn thành với for/since/already/yet/just/before.\",\"examples\":[\"I'm going to be a doctor. / I'll answer the door.\",\"We're going after breakfast tomorrow. (present continuous for future)\",\"If we go back, we'll know where we are. (first conditional)\",\"If we read the map correctly, we wouldn't get lost. (second conditional)\",\"We've lived here since 2005. / I haven't listened to that CD for a long time.\",\"Clare hasn't sent an email yet. / I've already made a card.\"]},\"exercises\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"Which sentence is correct? 'I'm going to be a doctor when I'm older.' or 'I'll be a doctor when I'm older.'\",\"options\":[\"Only the first\",\"Only the second\",\"Both are correct\",\"Neither is correct\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dự định/kế hoạch đã suy nghĩ từ trước thì dùng \u003cstrong\u003ebe going to\u003c/strong\u003e; 'will' dùng cho quyết định ngay lúc nói hoặc dự đoán.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Nghề nghiệp tương lai là dự định đã có từ trước → 'I'm going to be a doctor…' là câu đúng theo bài học.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi định làm bác sĩ khi lớn lên.\",\"points\":10,\"gesture\":true},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"Someone knocks on the door. You say: 'I _____ answer the door.'\",\"options\":[\"am going to\",\"'ll\",\"am answering\",\"answered\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Quyết định ngay tại lúc nói (không định trước) thì dùng \u003cstrong\u003ewill ('ll)\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Nghe tiếng gõ cửa rồi mới quyết định ra mở → dùng \u003cstrong\u003e'll answer\u003c/strong\u003e, không dùng 'be going to'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Để tôi ra mở cửa.\",\"points\":10,\"gesture\":true},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"It's started to rain. We _____ get wet.\",\"options\":[\"will\",\"are going to\",\"Both are correct\",\"are getting\"],\"correctIndex\":2,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e 'will' (dự đoán) và 'be going to' (có bằng chứng trước mắt) đều có thể dùng để dự đoán.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trời đã bắt đầu mưa (bằng chứng) nên 'are going to get wet' rất hợp; 'will get wet' cũng chấp nhận được → cả hai đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Trời mưa rồi. Chúng ta sẽ bị ướt mất.\",\"points\":10,\"gesture\":true},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"Mum and I normally go shopping on Saturday, but tomorrow we __________ (not go) in the afternoon.\",\"answer\":\"aren't going\",\"acceptedAnswers\":[\"aren't going\",\"are not going\",\"'re not going\"],\"hints\":[\"Use the present continuous for a planned future arrangement\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Kế hoạch/sắp xếp cho tương lai đã định dùng \u003cstrong\u003ehiện tại tiếp diễn\u003c/strong\u003e (am/is/are + V-ing).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'tomorrow' là kế hoạch đã định, phủ định số nhiều 'we' → \u003cstrong\u003earen't going\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mẹ và tôi thường đi mua sắm thứ Bảy, nhưng chiều mai chúng tôi sẽ không đi.\"},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"We __________ (go) after breakfast at 8 o'clock tomorrow.\",\"answer\":\"are going\",\"acceptedAnswers\":[\"are going\",\"'re going\"],\"hints\":[\"Present continuous for a planned future event\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Sự việc đã lên lịch giờ giấc cụ thể trong tương lai dùng \u003cstrong\u003ehiện tại tiếp diễn\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'at 8 o'clock tomorrow' là giờ đã định, 'we' → \u003cstrong\u003eare going\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi sẽ đi sau bữa sáng lúc 8 giờ sáng mai.\"},{\"id\":6,\"type\":\"fill-blank\",\"question\":\"Mum and I __________ (collect) my friend Harriet from her house at 9 o'clock tomorrow.\",\"answer\":\"are collecting\",\"acceptedAnswers\":[\"are collecting\",\"'re collecting\"],\"hints\":[\"Present continuous for future plans\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Kế hoạch tương lai đã sắp xếp dùng \u003cstrong\u003ehiện tại tiếp diễn\u003c/strong\u003e (am/is/are + V-ing).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'at 9 o'clock tomorrow' đã định trước, chủ ngữ 'Mum and I' → \u003cstrong\u003eare collecting\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mẹ và tôi sẽ đón bạn Harriet ở nhà bạn ấy lúc 9 giờ sáng mai.\"},{\"id\":7,\"type\":\"fill-blank\",\"question\":\"Harriet __________ (not go) home until the evening because her parents __________ (visit) friends.\",\"answer\":\"isn't going\",\"acceptedAnswers\":[\"isn't going\",\"is not going\",\"'s not going\"],\"hints\":[\"Present continuous negative for future plans\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Kế hoạch tương lai dùng hiện tại tiếp diễn; phủ định thêm 'not' sau am/is/are.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Harriet' số ít → \u003cstrong\u003eisn't going\u003c/strong\u003e; 'her parents' số nhiều → \u003cstrong\u003eare visiting\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Harriet sẽ không về nhà cho đến tối vì bố mẹ bạn ấy sẽ đi thăm bạn bè.\"},{\"id\":8,\"type\":\"fill-blank-mixed\",\"template\":\"If it _1_ (be) nice weather, we _2_ (fly) a kite.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(be)\",\"answer\":\"is\",\"acceptedAnswers\":[\"is\",\"'s\"]},{\"blankId\":2,\"hint\":\"(fly)\",\"answer\":\"'ll fly\",\"acceptedAnswers\":[\"'ll fly\",\"will fly\"]}],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1 (việc có thật ở tương lai): \u003cstrong\u003eIf + hiện tại đơn, will + V\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề if dùng hiện tại đơn \u003cstrong\u003eis\u003c/strong\u003e; mệnh đề chính dùng \u003cstrong\u003e'll fly\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Nếu thời tiết đẹp, chúng ta sẽ thả diều.\"},{\"id\":9,\"type\":\"fill-blank-mixed\",\"template\":\"We _1_ (wait) until this afternoon if the shop _2_ (not be) open.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(wait)\",\"answer\":\"'ll wait\",\"acceptedAnswers\":[\"'ll wait\",\"will wait\"]},{\"blankId\":2,\"hint\":\"(not be)\",\"answer\":\"isn't\",\"acceptedAnswers\":[\"isn't\",\"is not\",\"'s not\"]}],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1: \u003cstrong\u003eIf + hiện tại đơn, will + V\u003c/strong\u003e (thứ tự hai mệnh đề có thể đảo).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề chính \u003cstrong\u003e'll wait\u003c/strong\u003e; mệnh đề if hiện tại đơn phủ định \u003cstrong\u003eisn't\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi sẽ đợi đến chiều nếu cửa hàng chưa mở.\"},{\"id\":10,\"type\":\"fill-blank-mixed\",\"template\":\"You _1_ (not see) so many fish if you _2_ (not have) a snorkel.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(not see)\",\"answer\":\"won't see\",\"acceptedAnswers\":[\"won't see\",\"will not see\"]},{\"blankId\":2,\"hint\":\"(not have)\",\"answer\":\"don't have\",\"acceptedAnswers\":[\"don't have\",\"do not have\"]}],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1, dạng phủ định: \u003cstrong\u003ewon't + V\u003c/strong\u003e và \u003cstrong\u003edon't/doesn't + V\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Mệnh đề chính \u003cstrong\u003ewon't see\u003c/strong\u003e; mệnh đề if hiện tại đơn phủ định \u003cstrong\u003edon't have\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bạn sẽ không thấy nhiều cá đến vậy nếu không có ống thở.\"},{\"id\":11,\"type\":\"fill-blank-mixed\",\"template\":\"If our team _1_ (not win) on Saturday, we _2_ (lose) the championship.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(not win)\",\"answer\":\"doesn't win\",\"acceptedAnswers\":[\"doesn't win\",\"does not win\"]},{\"blankId\":2,\"hint\":\"(lose)\",\"answer\":\"'ll lose\",\"acceptedAnswers\":[\"'ll lose\",\"will lose\"]}],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu điều kiện loại 1: \u003cstrong\u003eIf + hiện tại đơn, will + V\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'our team' số ít → \u003cstrong\u003edoesn't win\u003c/strong\u003e; mệnh đề planation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Will probably' có thể thay bằng 'be going to' khi có dự đoán.\u003cbr\u003e• Cả hai diễn tả tương lai.\",\"points\":10},{\"id\":181,\"type\":\"sentence-rewrite\",\"original\":\"She doesn't live near school, so she takes the bus.\",\"instruction\":\"Rewrite using a second conditional with 'if'\",\"starterText\":\"If she\",\"answer\":\"If she lived near school, she wouldn't take the bus.\",\"acceptedAnswers\":[\"If she lived near school, she wouldn't take the bus.\",\"If she lived near school, she wouldn't take the bus\",\"If she lived near school, she would not take the bus.\"],\"hints\":[\"Change the reality to an imaginary situation\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Thực tế: không sống gần trường → đi xe buýt.\u003cbr\u003e• Tưởng tượng: If she lived (gần trường) → wouldn't take (xe buýt).\",\"points\":10},{\"id\":182,\"type\":\"sentence-rewrite\",\"original\":\"We started playing football three hours ago.\",\"instruction\":\"Rewrite using the present perfect with 'for'\",\"starterText\":\"We have\",\"answer\":\"We have played football for three hours.\",\"acceptedAnswers\":[\"We have played football for three hours.\",\"We have played football for three hours\",\"We've played football for three hours.\",\"We've played football for three hours\"],\"hints\":[\"'Started...three hours ago' → present perfect + for\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Started + khoảng thời gian + ago' → 'have + V3 + for'.\u003cbr\u003e• Hành động vẫn đang tiếp tục.\",\"points\":10},{\"id\":183,\"type\":\"sentence-rewrite\",\"original\":\"You should bring an umbrella. It might rain.\",\"instruction\":\"Rewrite as a first conditional sentence\",\"starterText\":\"If it\",\"answer\":\"If it rains, you should bring an umbrella.\",\"acceptedAnswers\":[\"If it rains, you should bring an umbrella.\",\"If it rains, you should bring an umbrella\",\"If it rains, you will need an umbrella.\",\"If it rains, you'll need an umbrella.\"],\"hints\":[\"Turn the warning into a conditional\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Chuyển lời khuyên thành câu điều kiện loại 1.\u003cbr\u003e• 'Might rain' → 'If it rains' (điều kiện thực tế).\",\"points\":10},{\"id\":184,\"type\":\"sentence-rewrite\",\"original\":\"He can't swim, so he doesn't go to the pool.\",\"instruction\":\"Rewrite using a second conditional with 'if'\",\"starterText\":\"If he\",\"answer\":\"If he could swim, he would go to the pool.\",\"acceptedAnswers\":[\"If he could swim, he would go to the pool.\",\"If he could swim, he would go to the pool\",\"If he could swim, he'd go to the pool.\",\"If he could swim, he'd go to the pool\"],\"hints\":[\"'Can't' becomes 'could' in second conditional\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Can't' → 'could' trong câu điều kiện loại 2.\u003cbr\u003e• Anh ấy không biết bơi → tình huống không thật.\",\"points\":10},{\"id\":185,\"type\":\"sentence-rewrite\",\"original\":\"She got married in 2016. She is still married.\",\"instruction\":\"Rewrite using the present perfect with 'since'\",\"starterText\":\"She has been\",\"answer\":\"She has been married since 2016.\",\"acceptedAnswers\":[\"She has been married since 2016.\",\"She has been married since 2016\"],\"hints\":[\"Use 'has been + adjective + since'\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Kết hợp hai câu thành hiện tại hoàn thành.\u003cbr\u003e• 'Since 2016' cho thấy trạng thái bắt đầu năm 2016 và tiếp tục.\",\"points\":10},{\"id\":186,\"type\":\"sentence-rewrite\",\"original\":\"The last time I ate pizza was two months ago.\",\"instruction\":\"Rewrite using the present perfect with 'for'\",\"starterText\":\"I haven't\",\"answer\":\"I haven't eaten pizza for two months.\",\"acceptedAnswers\":[\"I haven't eaten pizza for two months.\",\"I haven't eaten pizza for two months\",\"I have not eaten pizza for two months.\"],\"hints\":[\"'The last time...ago' → 'haven't...for'\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'The last time + V2 + ago' → 'haven't + V3 + for'.\u003cbr\u003e• Cả hai câu cùng nghĩa.\",\"points\":10},{\"id\":187,\"type\":\"sentence-rewrite\",\"original\":\"We plan to visit the museum next Saturday.\",\"instruction\":\"Rewrite using 'be going to'\",\"starterText\":\"We are\",\"answer\":\"We are going to visit the museum next Saturday.\",\"acceptedAnswers\":[\"We are going to visit the museum next Saturday.\",\"We are going to visit the museum next Saturday\",\"We're going to visit the museum next Saturday.\",\"We're going to visit the museum next Saturday\"],\"hints\":[\"'Plan to' can be expressed as 'be going to'\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Plan to + V' = 'be going to + V'.\u003cbr\u003e• Cả hai diễn tả kế hoạch đã quyết định.\",\"points\":10},{\"id\":188,\"type\":\"sentence-rewrite\",\"original\":\"I don't have enough money, so I can't buy that jacket.\",\"instruction\":\"Rewrite using a second conditional with 'if'\",\"starterText\":\"If I\",\"answer\":\"If I had enough money, I would buy that jacket.\",\"acceptedAnswers\":[\"If I had enough money, I would buy that jacket.\",\"If I had enough money, I would buy that jacket\",\"If I had enough money, I'd buy that jacket.\",\"If I had enough money, I'd buy that jacket\"],\"hints\":[\"Change reality to imagination\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Don't have' → 'If I had' (quá khứ đơn).\u003cbr\u003e• 'Can't buy' → 'would buy'.\",\"points\":10},{\"id\":189,\"type\":\"sentence-rewrite\",\"original\":\"Study hard or you will fail the test.\",\"instruction\":\"Rewrite as a first conditional sentence using 'if...don't'\",\"starterText\":\"If you\",\"answer\":\"If you don't study hard, you will fail the test.\",\"acceptedAnswers\":[\"If you don't study hard, you will fail the test.\",\"If you don't study hard, you will fail the test\",\"If you don't study hard, you'll fail the test.\",\"If you don't study hard, you'll fail the test\"],\"hints\":[\"'Or' warnings become 'If...don't' conditionals\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'V + or + hậu quả' → 'If + don't + V, will + hậu quả'.\u003cbr\u003e• Cả hai câu cùng nghĩa cảnh báo.\",\"points\":10},{\"id\":190,\"type\":\"sentence-rewrite\",\"original\":\"This is my first time visiting Japan.\",\"instruction\":\"Rewrite using the present perfect with 'never...before'\",\"starterText\":\"I have\",\"answer\":\"I have never visited Japan before.\",\"acceptedAnswers\":[\"I have never visited Japan before.\",\"I have never visited Japan before\",\"I've never visited Japan before.\",\"I've never visited Japan before\"],\"hints\":[\"'First time' = never before\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'First time + V-ing' = 'have never + V3 + before'.\u003cbr\u003e• Cả hai diễn tả chưa từng làm điều gì.\",\"points\":10},{\"id\":191,\"type\":\"sentence-rewrite\",\"original\":\"He is not tall, so he can't reach the shelf.\",\"instruction\":\"Rewrite using a second conditional with 'if'\",\"starterText\":\"If he\",\"answer\":\"If he were taller, he could reach the shelf.\",\"acceptedAnswers\":[\"If he were taller, he could reach the shelf.\",\"If he were taller, he could reach the shelf\",\"If he was taller, he could reach the shelf.\",\"If he were tall enough, he could reach the shelf.\"],\"hints\":[\"Use comparative form in the if-clause\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Is not tall' → 'If he were taller' (so sánh hơn).\u003cbr\u003e• 'Can't' → 'could' trong câu điều kiện loại 2.\",\"points\":10},{\"id\":192,\"type\":\"sentence-rewrite\",\"original\":\"I became a teacher in 2020. I am still a teacher.\",\"instruction\":\"Rewrite using the present perfect with 'since'\",\"starterText\":\"I have been\",\"answer\":\"I have been a teacher since 2020.\",\"acceptedAnswers\":[\"I have been a teacher since 2020.\",\"I have been a teacher since 2020\",\"I've been a teacher since 2020.\",\"I've been a teacher since 2020\"],\"hints\":[\"Combine two sentences into present perfect\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Kết hợp hai câu: V2 + năm + vẫn còn → have been + since.\u003cbr\u003e• Trạng thái tiếp tục từ quá khứ đến hiện tại.\",\"points\":10},{\"id\":193,\"type\":\"fill-blank-mixed\",\"template\":\"If I _1_ (have) a million dollars, I _2_ (buy) a yacht.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(have)\",\"answer\":\"had\",\"acceptedAnswers\":[\"had\"]},{\"blankId\":2,\"hint\":\"(buy)\",\"answer\":\"would buy\",\"acceptedAnswers\":[\"would buy\",\"'d buy\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu điều kiện loại 2: If + quá khứ đơn, would + V.\u003cbr\u003e• Tôi không có một triệu đô → điều không thật.\",\"points\":10},{\"id\":194,\"type\":\"fill-blank-mixed\",\"template\":\"She _1_ (visit) her aunt if she _2_ (have) time this weekend.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(visit)\",\"answer\":\"will visit\",\"acceptedAnswers\":[\"will visit\",\"'ll visit\"]},{\"blankId\":2,\"hint\":\"(have)\",\"answer\":\"has\",\"acceptedAnswers\":[\"has\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu điều kiện loại 1: mệnh đề if dùng hiện tại đơn.\u003cbr\u003e• Mệnh đề chính dùng will + V.\",\"points\":10},{\"id\":195,\"type\":\"fill-blank-mixed\",\"template\":\"Tom _1_ (already/pack) his bag, but he _2_ (not book) the hotel yet.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(already/pack)\",\"answer\":\"has already packed\",\"acceptedAnswers\":[\"has already packed\",\"'s already packed\"]},{\"blankId\":2,\"hint\":\"(not book)\",\"answer\":\"hasn't booked\",\"acceptedAnswers\":[\"hasn't booked\",\"has not booked\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Already' trong câu khẳng định, 'yet' trong câu phủ định.\u003cbr\u003e• Cả hai dùng hiện tại hoàn thành.\",\"points\":10},{\"id\":196,\"type\":\"fill-blank-mixed\",\"template\":\"If _1_ (they/not hurry), _2_ (they/miss) the flight.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(they/not hurry)\",\"answer\":\"they don't hurry\",\"acceptedAnswers\":[\"they don't hurry\",\"they do not hurry\"]},{\"blankId\":2,\"hint\":\"(they/miss)\",\"answer\":\"they'll miss\",\"acceptedAnswers\":[\"they'll miss\",\"they will miss\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu điều kiện loại 1 phủ định: If + don't + V.\u003cbr\u003e• Mệnh đề chính: will + V.\",\"points\":10},{\"id\":197,\"type\":\"fill-blank-mixed\",\"template\":\"We _1_ (live) here _2_ five years and we love it.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(live)\",\"answer\":\"have lived\",\"acceptedAnswers\":[\"have lived\",\"'ve lived\"]},{\"blankId\":2,\"hint\":\"for/since\",\"answer\":\"for\",\"acceptedAnswers\":[\"for\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Five years' là khoảng thời gian → dùng 'for'.\u003cbr\u003e• Hiện tại hoàn thành vì vẫn sống ở đây.\",\"points\":10},{\"id\":198,\"type\":\"fill-blank-mixed\",\"template\":\"If _1_ (he/study) abroad, _2_ (he/learn) a lot more.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(he/study)\",\"answer\":\"he studied\",\"acceptedAnswers\":[\"he studied\"]},{\"blankId\":2,\"hint\":\"(he/learn)\",\"answer\":\"he would learn\",\"acceptedAnswers\":[\"he would learn\",\"he'd learn\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu điều kiện loại 2: If + quá khứ đơn, would + V.\u003cbr\u003e• Anh ấy không du học → điều không thật.\",\"points\":10},{\"id\":199,\"type\":\"fill-blank-mixed\",\"template\":\"She _1_ (know) him _2_ they were children.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(know)\",\"answer\":\"has known\",\"acceptedAnswers\":[\"has known\",\"'s known\"]},{\"blankId\":2,\"hint\":\"for/since\",\"answer\":\"since\",\"acceptedAnswers\":[\"since\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'They were children' là mốc thời gian → dùng 'since'.\u003cbr\u003e• Hiện tại hoàn thành vì vẫn quen nhau.\",\"points\":10},{\"id\":200,\"type\":\"fill-blank-mixed\",\"template\":\"I _1_ (be going to/travel) to Japan next summer. I _2_ (already/buy) the plane ticket.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(be going to/travel)\",\"answer\":\"am going to travel\",\"acceptedAnswers\":[\"am going to travel\",\"'m going to travel\"]},{\"blankId\":2,\"hint\":\"(already/buy)\",\"answer\":\"have already bought\",\"acceptedAnswers\":[\"have already bought\",\"'ve already bought\"]}],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Be going to' cho kế hoạch đã quyết định.\u003cbr\u003e• 'Already + have + V3' cho thấy đã hoàn thành việc mua vé.\",\"points\":10}],\"theoryHtml\":\"$17\"},\"unitPath\":\"grade-6/grammar-friends-6/gf6-review-1-units-1-3\",\"grammarRef\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#059669\"}]]\n"])</script><script>self.__next_f.push([1,"18:I[27201,[\"/ngu-phap-6/_next/static/chunks/0s5e6lhaxs04x.js\",\"/ngu-phap-6/_next/static/chunks/03_hl3a00zamr.js\",\"/ngu-phap-6/_next/static/chunks/2j18oyssgechh.js\",\"/ngu-phap-6/_next/static/chunks/27g-eozde523f.js\",\"/ngu-phap-6/_next/static/chunks/1d3bqpisz4nu9.js\",\"/ngu-phap-6/_next/static/chunks/2im7c515bo69p.js\"],\"IconMark\"]\n10:
