argin-bottom: 1.5rem; border-left: 5px solid var(--primary);\"\u003e\r\n          Trong bài học này, chúng ta sẽ ôn tập và củng cố kiến thức về \u003cstrong\u003eCâu bị động (The Passive)\u003c/strong\u003e ở hai thì chính:\r\n          \u003cstrong\u003eThì tương lai đơn\u003c/strong\u003e và \u003cstrong\u003eThì hiện tại hoàn thành\u003c/strong\u003e. Hãy nghiên cứu kỹ phần lý thuyết và ví dụ dưới đây trước khi bắt đầu làm bài luyện tập nhé! Chúc các bạn học tập tốt và đạt kết quả cao!\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 1: Future Passive Affirmative \u0026 Negative --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e1 Câu bị động thì tương lai đơn (Future Simple Passive)\u003c/h3\u003e\r\n          \u003cp\u003eChúng ta sử dụng câu bị động ở thì tương lai để nói về những sự việc, hành động sẽ được thực hiện bởi ai đó hoặc cái gì đó trong tương lai.\u003c/p\u003e\r\n\r\n          \u003ch4 style=\"color: var(--secondary); margin-top: 1rem;\"\u003ea) Thể khẳng định (Affirmative)\u003c/h4\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e \u003cspan style=\"font-size: 1.1rem; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; border: 1px solid #c8e6c9;\"\u003eChủ ngữ (S) + \u003cstrong\u003ewill be\u003c/strong\u003e + \u003cstrong\u003eQuá khứ phân từ (V3/V-ed)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eHãy xem cách chuyển đổi từ câu chủ động sang bị động nhé:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eCâu chủ động (Active):\u003c/em\u003e They \u003cstrong\u003ewill finish\u003c/strong\u003e the project tomorrow.\u003cbr\u003e\r\n            → \u003cem\u003eCâu bị động (Passive):\u003c/em\u003e The project \u003cstrong\u003ewill be finished\u003c/strong\u003e tomorrow. (Dự án sẽ được hoàn thành vào ngày mai.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eCâu chủ động (Active):\u003c/em\u003e The teacher \u003cstrong\u003ewill introduce\u003c/strong\u003e the class to the manager.\u003cbr\u003e\r\n            → \u003cem\u003eCâu bị động (Passive):\u003c/em\u003e The class \u003cstrong\u003ewill be introduced\u003c/strong\u003e to the manager. (Cả lớp sẽ được giới thiệu với người quản lý.)\r\n          \u003c/div\u003e\r\n\r\n          \u003ch4 style=\"color: var(--secondary); margin-top: 1rem;\"\u003eb) Thể phủ định (Negative)\u003c/h4\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e \u003cspan style=\"font-size: 1.1rem; background: #ffebee; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffcdd2;\"\u003eChủ ngữ (S) + \u003cstrong\u003ewon't be\u003c/strong\u003e + \u003cstrong\u003eQuá khứ phân từ (V3/V-ed)\u003c/strong\u003e\u003c/span\u003e (Lưu ý: \u003cem\u003ewon't be\u003c/em\u003e = \u003cem\u003ewill not be\u003c/em\u003e)\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ \u003cem\u003eCâu bị động (Passive):\u003c/em\u003e The swimming pool \u003cstrong\u003ewon't be cleaned\u003c/strong\u003e in winter. (Hồ bơi sẽ không được dọn dẹp vào mùa đông.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cem\u003eCâu bị động (Passive):\u003c/em\u003e The pupils \u003cstrong\u003ewon't be asked\u003c/strong\u003e any difficult questions. (Các học sinh sẽ không bị hỏi câu hỏi khó nào.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #e3f2fd; padding: 0.8rem; margin-top: 1rem; border-radius: 6px; border-left: 4px solid #2196f3;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhỏ từ Thầy/Cô:\u003c/strong\u003e Trong bị động của thì tương lai đơn, chúng ta \u003cstrong\u003ekhông cần lo lắng\u003c/strong\u003e về việc chủ ngữ là số ít hay số nhiều! Tất cả các chủ ngữ đều dùng chung cấu trúc \u003cstrong\u003ewill be / won't be + V3/V-ed\u003c/strong\u003e đấy!\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Future Passive Questions --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 Câu hỏi ở câu bị động thì tương lai đơn (Future Simple Passive Questions)\u003c/h3\u003e\r\n          \u003cp\u003eKhi muốn hỏi xem một hành động nào đó có được thực hiện trong tương lai hay không, chúng ta đảo trợ động từ \u003cstrong\u003eWill\u003c/strong\u003e lên đầu câu.\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e \u003cspan style=\"font-size: 1.1rem; background: #fff8e1; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffe082;\"\u003e\u003cstrong\u003eWill\u003c/strong\u003e + \u003cstrong\u003eChủ ngữ (S)\u003c/strong\u003e + \u003cstrong\u003ebe\u003c/strong\u003e + \u003cstrong\u003eQuá khứ phân từ (V3/V-ed)\u003c/strong\u003e?\u003c/span\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ minh họa:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWill\u003c/strong\u003e we \u003cstrong\u003ebe given\u003c/strong\u003e a prize if we win? (Chúng ta có được trao giải nếu chiến thắng không?)\u003cbr\u003e\r\n            → \u003cem\u003eTrả lời ngắn:\u003c/em\u003e \u003cstrong\u003eYes, we will.\u003c/strong\u003e / \u003cstrong\u003eNo, we won't.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWill\u003c/strong\u003e the decorations \u003cstrong\u003ebe taken down\u003c/strong\u003e after the holiday? (Các món đồ trang trí có được gỡ xuống sau kỳ nghỉ không?)\u003cbr\u003e\r\n            → \u003cem\u003eTrả lời ngắn:\u003c/em\u003e \u003cstrong\u003eYes, they will.\u003c/strong\u003e / \u003cstrong\u003eNo, they won't.\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Present Perfect Passive Affirmative \u0026 Negative --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 Câu bị động thì hiện tại hoàn thành (Present Perfect Passive)\u003c/h3\u003e\r\n          \u003cp\u003eCâu bị động ở thì hiện tại hoàn thành thường được dùng để nhấn mạnh vào kết quả của một hành động vừa mới xảy ra hoặc đã hoàn thành tính đến thời điểm hiện tại.\u003c/p\u003e\r\n\r\n          \u003ch4 style=\"color: var(--secondary); margin-top: 1rem;\"\u003ea) Thể khẳng định (Affirmative)\u003c/h4\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e \u003cspan style=\"font-size: 1.1rem; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; border: 1px solid #c8e6c9;\"\u003eChủ ngữ (S) + \u003cstrong\u003ehave/has been\u003c/strong\u003e + \u003cstrong\u003eQuá khứ phân từ (V3/V-ed)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv style=\"background: #fff8e1; padding: 0.8rem; margin: 1rem 0; border-radius: 6px; border-left: 4px solid #ffb300;\"\u003e\r\n            \u003cstrong\u003e Lưu ý cực kỳ quan trọng:\u003c/strong\u003e Khác với thì tương lai, ở thì hiện tại hoàn thành các em \u003cstrong\u003ebắt buộc phải chú ý đến chủ ngữ\u003c/strong\u003e để chọn trợ động từ cho đúng:\u003cbr\u003e\r\n            • Chủ ngữ số ít (he, she, it, danh từ số ít, danh từ không đếm được) → dùng \u003cstrong\u003ehas been + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\r\n            • Chủ ngữ số nhiều (I, you, we, they, danh từ số nhiều) → dùng \u003cstrong\u003ehave been + V3/V-ed\u003c/strong\u003e.\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ cụ thể:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ The milk \u003cstrong\u003ehas been taken\u003c/strong\u003e from the fridge. (Sữa đã được lấy ra khỏi tủ lạnh. - \"The milk\" là danh từ không đếm được nên dùng \u003cem\u003ehas been\u003c/em\u003e)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ The apples \u003cstrong\u003ehave been stolen\u003c/strong\u003e. (Những quả táo đã bị ăn trộm mất rồi. - \"The apples\" là danh từ số nhiều nên dùng \u003cem\u003ehave been\u003c/em\u003e)\r\n          \u003c/div\u003e\r\n\r\n          \u003ch4 style=\"color: var(--secondary); margin-top: 1rem;\"\u003eb) Thể phủ định (Negative)\u003c/h4\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e \u003cspan style=\"font-size: 1.1rem; background: #ffebee; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffcdd2;\"\u003eChủ ngữ (S) + \u003cstrong\u003ehaven't/hasn't been\u003c/strong\u003e + \u003cstrong\u003eQuá khứ phân từ (V3/V-ed)\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ The door \u003cstrong\u003ehasn't been painted\u003c/strong\u003e yet. (Cửa vẫn chưa được sơn. - \"The door\" là số ít nên dùng \u003cem\u003ehasn't\u003c/em\u003e)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ The bandages \u003cstrong\u003ehaven't been picked up\u003c/strong\u003e. (Các cuộn băng gạc vẫn chưa được nhặt lên. - \"The bandages\" là số nhiều nên dùng \u003cem\u003ehaven't\u003c/em\u003e)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Present Perfect Passive Questions --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 Câu hỏi ở câu bị động thì hiện tại hoàn thành (Present Perfect Passive Questions)\u003c/h3\u003e\r\n          \u003cp\u003eĐể hỏi xem một sự việc đã được hoàn thành hay chưa ở câu bị động, chúng ta đảo trợ động từ \u003cstrong\u003eHave\u003c/strong\u003e hoặc \u003cstrong\u003eHas\u003c/strong\u003e lên trước chủ ngữ.\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e \u003cspan style=\"font-size: 1.1rem; background: #fff8e1; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffe082;\"\u003e\u003cstrong\u003eHave/Has\u003c/strong\u003e + \u003cstrong\u003eChủ ngữ (S)\u003c/strong\u003e + \u003cstrong\u003ebeen\u003c/strong\u003e + \u003cstrong\u003eQuá khứ phân từ (V3/V-ed)\u003c/strong\u003e?\u003c/span\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ minh họa:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eHas\u003c/strong\u003e everything \u003cstrong\u003ebeen done\u003c/strong\u003e? (Mọi thứ đã được làm xong chưa?)\u003cbr\u003e\r\n            → \u003cem\u003eTrả lời ngắn:\u003c/em\u003e \u003cstrong\u003eYes, it has.\u003c/strong\u003e / \u003cstrong\u003eNo, it hasn't.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eHave\u003c/strong\u003e the windows \u003cstrong\u003ebeen cleaned\u003c/strong\u003e? (Cửa sổ đã được lau dọn chưa?)\u003cbr\u003e\r\n            → \u003cem\u003eTrả lời ngắn:\u003c/em\u003e \u003cstrong\u003eYes, they have.\u003c/strong\u003e / \u003cstrong\u003eNo, they haven't.\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Step-by-Step active to passive conversion --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Các bước chuyển đổi từ câu chủ động sang bị động\u003c/h3\u003e\r\n          \u003cp\u003eĐể các em không bị nhầm lẫn khi viết lại câu, Thầy/Cô khuyên các em hãy làm theo 4 bước sau:\u003c/p\u003e\r\n          \u003cdiv style=\"background: #f9f9f9; padding: 1rem; border-radius: 8px; border: 1px solid #e0e0e0;\"\u003e\r\n            \u003cp\u003e\u003cstrong\u003eBước 1:\u003c/strong\u003e Xác định Tân ngữ (O) trong câu chủ động và đưa lên làm Chủ ngữ mới (S) cho câu bị động.\u003c/p\u003e\r\n            \u003cp\u003e\u003cstrong\u003eBước 2:\u003c/strong\u003e Xác định Thì của câu chủ động để chọn cấu trúc bị động tương ứng (Tương lai: \u003cem\u003ewill be\u003c/em\u003e / Hiện tại hoàn thành: \u003cem\u003ehave/has been\u003c/em\u003e).\u003c/p\u003e\r\n            \u003cp\u003e\u003cstrong\u003eBước 3:\u003c/strong\u003e Chuyển động từ chính về dạng Quá khứ phân từ (V3/V-ed - Past Participle).\u003c/p\u003e\r\n            \u003cp\u003e\u003cstrong\u003eBước 4:\u003c/strong\u003e Đưa Chủ ngữ cũ xuống cuối câu làm Tân ngữ đứng sau giới từ \u003cstrong\u003e\"by\"\u003c/strong\u003e (nếu cần thiết).\u003c/p\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Summary Table --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Bảng tóm tắt so sánh (Units 5 \u0026 6)\u003c/h3\u003e\r\n          \u003cp\u003eHãy cùng nhìn lại bảng so sánh để ghi nhớ thật sâu sắc nhé các em:\u003c/p\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem;\"\u003e\r\n            \u003cthead\u003e\r\n              \u003ctr style=\"background: var(--primary); color: white;\"\u003e\r\n                \u003cth style=\"border: 1px solid #ddd; padding: 10px; text-align: left;\"\u003eThì (Tense)\u003c/th\u003e\r\n                \u003cth style=\"border: 1px solid #ddd; padding: 10px; text-align: left;\"\u003eCấu trúc bị động\u003c/th\u003e\r\n                \u003cth style=\"border: 1px solid #ddd; padding: 10px; text-align: left;\"\u003eVí dụ minh họa\u003c/th\u003e\r\n              \u003c/tr\u003e\r\n            \u003c/thead\u003e\r\n            \u003ctbody\u003e\r\n              \u003ctr style=\"background: #f9f9f9;\"\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003e\u003cstrong\u003ePresent Simple (Hiện tại đơn)\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003eam / is / are + V3/V-ed\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003eThe car \u003cstrong\u003eis washed\u003c/strong\u003e every week.\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003e\u003cstrong\u003ePast Simple (Quá khứ đơn)\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003ewas / were + V3/V-ed\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003eThe letter \u003cstrong\u003ewas sent\u003c/strong\u003e yesterday.\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr style=\"background: #f1f8e9;\"\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px; color: var(--primary-dark);\"\u003e\u003cstrong\u003eFuture Simple (Tương lai đơn)\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px; font-weight: bold; color: var(--primary-dark);\"\u003ewill be + V3/V-ed\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003eThe project \u003cstrong\u003ewill be finished\u003c/strong\u003e soon.\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr style=\"background: #eaf2f8;\"\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px; color: var(--secondary);\"\u003e\u003cstrong\u003ePresent Perfect (Hiện tại hoàn thành)\u003c/strong\u003e\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px; font-weight: bold; color: var(--secondary);\"\u003ehave / has been + V3/V-ed\u003c/td\u003e\r\n                \u003ctd style=\"border: 1px solid #ddd; padding: 10px;\"\u003eThe milk \u003cstrong\u003ehas been taken\u003c/strong\u003e.\u003c/td\u003e\r\n              \u003c/tr\u003e\r\n            \u003c/tbody\u003e\r\n          \u003c/table\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: Common Mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 Những lỗi phổ biến các em cần tránh (Common Mistakes)\u003c/h3\u003e\r\n          \u003cp\u003eTrong quá trình làm bài, học sinh rất hay mắc các lỗi sau. Hãy xem để tự rút kinh nghiệm nhé:\u003c/p\u003e\r\n\r\n          \u003cdiv style=\"background: #fdf2f2; padding: 1rem; border-radius: 8px; border: 1px solid #fde8e8;\"\u003e\r\n            \u003cp style=\"margin-bottom: 0.8rem;\"\u003e\u003cstrong\u003e Lỗi 1: Quên chữ \"be\" trong bị động tương lai\u003c/strong\u003e\u003cbr\u003e\r\n            • Sai: \u003cem\u003eThe letter will sent tomorrow.\u003c/em\u003e\u003cbr\u003e\r\n            • Đúng: \u003cem\u003eThe letter \u003cstrong\u003ewill be sent\u003c/strong\u003e tomorrow.\u003c/em\u003e\u003cbr\u003e\r\n            \u003cspan style=\"color: #666; font-size: 0.85rem;\"\u003e Nhớ nhé: Sau \"will\" bắt buộc phải có \"be\" rồi mới tới V3.\u003c/span\u003e\u003c/p\u003e\r\n\r\n            \u003cp style=\"margin-bottom: 0.8rem;\"\u003e\u003cstrong\u003e Lỗi 2: Quên chữ \"been\" trong bị động hiện tại hoàn thành\u003c/strong\u003e\u003cbr\u003e\r\n            • Sai: \u003cem\u003eThe door has painted.\u003c/em\u003e (Câu này nghĩa là cái cửa tự sơn nó - không hợp lý!)\u003cbr\u003e\r\n            • Đúng: \u003cem\u003eThe door \u003cstrong\u003ehas been painted\u003c/strong\u003e.\u003c/em\u003e (Cái cửa đã được sơn.)\u003c/p\u003e\r\n\r\n            \u003cp style=\"margin-bottom: 0.8rem;\"\u003e\u003cstrong\u003e Lỗi 3: Dùng sai \"have\" và \"has\"\u003c/strong\u003e\u003cbr\u003e\r\n            • Sai: \u003cem\u003eThe windows \u003cstrong\u003ehas\u003c/strong\u003e been cleaned.\u003c/em\u003e (windows là số nhiều!)\u003cbr\u003e\r\n            • Đúng: \u003cem\u003eThe windows \u003cstrong\u003ehave\u003c/strong\u003e been cleaned.\u003c/em\u003e\u003c/p\u003e\r\n\r\n            \u003cp style=\"margin-bottom: 0.8rem;\"\u003e\u003cstrong\u003e Lỗi 4: Dùng động từ dạng V-ing hoặc động từ nguyên mẫu thay vì V3\u003c/strong\u003e\u003cbr\u003e\r\n            • Sai: \u003cem\u003eThe book will be \u003cstrong\u003ewriting\u003c/strong\u003e.\u003c/em\u003e hoặc \u003cem\u003eThe book will be \u003cstrong\u003ewrite\u003c/strong\u003e.\u003c/em\u003e\u003cbr\u003e\r\n            • Đúng: \u003cem\u003eThe book will be \u003cstrong\u003ewritten\u003c/strong\u003e.\u003c/em\u003e (written là V3 của write)\u003c/p\u003e\r\n\r\n            \u003cp style=\"margin-bottom: 0.8rem;\"\u003e\u003cstrong\u003e Lỗi 5: Đặt sai vị trí của \"be\" trong câu hỏi nghi vấn\u003c/strong\u003e\u003cbr\u003e\r\n            • Sai: \u003cem\u003eWill the cake be baked be?\u003c/em\u003e hoặc \u003cem\u003eWill be the cake baked?\u003c/em\u003e\u003cbr\u003e\r\n            • Đúng: \u003cem\u003e\u003cstrong\u003eWill\u003c/strong\u003e the cake \u003cstrong\u003ebe baked\u003c/strong\u003e?\u003c/em\u003e (Cấu trúc: Will + S + be + V3?)\u003c/p\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-6-good-ideas\",\"title\":\"Unit 6: Good Ideas - The Passive (3 \u0026 4)\",\"grammarTopics\":[\"Passive: future (will be + past participle)\",\"Passive: present perfect (have/has been + past participle)\"],\"theory\":{\"brief\":\"Câu bị động thì tương lai: will/won't + be + V3. Câu bị động thì hiện tại hoàn thành: have/has (not) + been + V3. Câu hỏi: Will + S + be + V3? / Have/Has + S + been + V3?\",\"rules\":[\"Future passive khẳng định: S + will be + V3\",\"Future passive phủ định: S + won't be + V3\",\"Future passive câu hỏi: Will + S + be + V3?\",\"Present perfect passive khẳng định: S + have/has been + V3\",\"Present perfect passive phủ định: S + haven't/hasn't been + V3\",\"Present perfect passive câu hỏi: Have/Has + S + been + V3?\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"The class __________ (introduce) to the museum manager. [future passive]\",\"answer\":\"will be introduced\",\"acceptedAnswers\":[\"will be introduced\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động của thì Tương lai đơn ở dạng khẳng định dùng để diễn tả một hành động sẽ được thực hiện trong tương lai, cấu trúc là \u003cstrong\u003ewill be + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Động từ \u003cstrong\u003eintroduce\u003c/strong\u003e có dạng quá khứ phân từ (V3) là \u003cstrong\u003eintroduced\u003c/strong\u003e. Ta kết hợp thành \u003cstrong\u003ewill be introduced\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Lớp sẽ được giới thiệu với quản lý bảo tàng.\",\"hints\":[\"will + be + V3 of 'introduce'\"],\"points\":10},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"The pupils __________ (show) round the museum. [future passive]\",\"answer\":\"will be shown\",\"acceptedAnswers\":[\"will be shown\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động của thì Tương lai đơn ở dạng khẳng định dùng để diễn tả một hành động sẽ được thực hiện trong tương lai, cấu trúc là \u003cstrong\u003ewill be + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Động từ \u003cstrong\u003eshow\u003c/strong\u003e có dạng quá khứ phân từ (V3) là \u003cstrong\u003eshown\u003c/strong\u003e. Ta kết hợp thành \u003cstrong\u003ewill be shown\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Học sinh sẽ được dẫn đi tham quan bảo tàng.\",\"hints\":[\"show → shown (V3)\"],\"points\":10},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"The class __________ (give) time to look around. [future passive]\",\"answer\":\"will be given\",\"acceptedAnswers\":[\"will be given\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động của thì Tương lai đơn ở dạng khẳng định dùng để diễn tả một hành động sẽ được thực hiện trong tương lai, cấu trúc là \u003cstrong\u003ewill be + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Động từ \u003cstrong\u003egive\u003c/strong\u003e có dạng quá khứ phân từ (V3) là \u003cstrong\u003egiven\u003c/strong\u003e. Ta kết hợp thành \u003cstrong\u003ewill be given\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Lớp sẽ được cho thời gian để nhìn xung quanh.\",\"hints\":[\"give → given (V3)\"],\"points\":10},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"The class __________ (present) with a new computer. [future passive]\",\"answer\":\"will be presented\",\"acceptedAnswers\":[\"will be presented\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động của thì Tương lai đơn ở dạng khẳng định dùng để diễn tả một hành động sẽ được thực hiện trong tương lai, cấu trúc là \u003cstrong\u003ewill be + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Động từ \u003cstrong\u003epresent\u003c/strong\u003e có dạng quá khứ phân từ (V3) là \u003cstrong\u003epresented\u003c/strong\u003e. Ta kết hợp thành \u003cstrong\u003ewill be presented\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Lớp sẽ được tặng một máy tính mới.\",\"hints\":[\"present → presented\"],\"points\":10},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"Some students __________ (ask) about recycling. [future passive]\",\"answer\":\"will be asked\",\"acceptedAnswers\":[\"will be asked\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động của thì Tương lai đơn ở dạng khẳng định dùng để diễn tả một hành động sẽ được thực hiện trong tương lai, cấu trúc là \u003cstrong\u003ewill be + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Động từ \u003cstrong\u00
