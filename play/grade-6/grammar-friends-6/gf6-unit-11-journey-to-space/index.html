\n          \u003ch3 class=\"theory-panel__heading\"\u003e1 Câu Hỏi Tường Thuật Có Từ Hỏi (Wh-questions)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCông thức:\u003c/strong\u003e S + \u003cstrong\u003easked\u003c/strong\u003e (+ O) + \u003cstrong\u003etừ hỏi\u003c/strong\u003e + S + V (lùi thì)\u003c/p\u003e\r\n          \u003cp\u003eTừ hỏi: \u003cstrong\u003ewhat, where, when, why, how, who, which, how many, how much, how long...\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \"Where does Carrie live?\" she asked. → She \u003cstrong\u003easked\u003c/strong\u003e him \u003cstrong\u003ewhere\u003c/strong\u003e Carrie \u003cstrong\u003elived\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy hỏi anh ấy Carrie sống ở đâu.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"What time is it?\" Linda asked Anna. → Linda \u003cstrong\u003easked\u003c/strong\u003e Anna \u003cstrong\u003ewhat time\u003c/strong\u003e it \u003cstrong\u003ewas\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Linda hỏi Anna mấy giờ rồi.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Why do giraffes have long necks?\" Cathy asked. → Cathy \u003cstrong\u003easked\u003c/strong\u003e \u003cstrong\u003ewhy\u003c/strong\u003e giraffes \u003cstrong\u003ehad\u003c/strong\u003e long necks.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cathy hỏi tại sao hươu cao cổ có cổ dài.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lưu ý quan trọng:\u003c/strong\u003e\u003cbr\u003e\r\n            • Luôn dùng \u003cstrong\u003easked\u003c/strong\u003e (KHÔNG dùng said/told cho câu hỏi)\u003cbr\u003e\r\n            • Giữ nguyên từ hỏi (what, where, when...)\u003cbr\u003e\r\n            • Bỏ dấu hỏi (?), thay bằng dấu chấm (.)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Reported yes/no questions --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 Câu Hỏi Yes/No Tường Thuật (if / whether)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCông thức:\u003c/strong\u003e S + \u003cstrong\u003easked\u003c/strong\u003e (+ O) + \u003cstrong\u003eif / whether\u003c/strong\u003e + S + V (lùi thì)\u003c/p\u003e\r\n          \u003cp\u003eDùng cho câu hỏi KHÔNG có từ hỏi (câu hỏi trả lời Yes/No).\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \"Are you ready?\" Eric asked me. → Eric \u003cstrong\u003easked\u003c/strong\u003e me \u003cstrong\u003eif\u003c/strong\u003e I \u003cstrong\u003ewas\u003c/strong\u003e ready.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Eric hỏi tôi có sẵn sàng không.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Do you like pizza?\" she asked. → She \u003cstrong\u003easked\u003c/strong\u003e me \u003cstrong\u003ewhether\u003c/strong\u003e I \u003cstrong\u003eliked\u003c/strong\u003e pizza.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy hỏi tôi có thích pizza không.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Can you swim?\" Tom asked. → Tom \u003cstrong\u003easked\u003c/strong\u003e me \u003cstrong\u003eif\u003c/strong\u003e I \u003cstrong\u003ecould\u003c/strong\u003e swim.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Tom hỏi tôi có biết bơi không.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Câu hỏi gốc bắt đầu bằng \u003cstrong\u003eDo/Does/Did/Is/Are/Was/Were/Can/Will...\u003c/strong\u003e → dùng \u003cstrong\u003eif\u003c/strong\u003e hoặc \u003cstrong\u003ewhether\u003c/strong\u003e\u003cbr\u003e\r\n            • \u003cstrong\u003eif\u003c/strong\u003e và \u003cstrong\u003ewhether\u003c/strong\u003e có thể dùng thay nhau được!\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Word order change --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 Thay Đổi Trật Tự Từ: Câu Hỏi → Câu Trần Thuật\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eQuy tắc vàng:\u003c/strong\u003e Trong câu hỏi tường thuật, dùng \u003cstrong\u003etrật tự câu trần thuật\u003c/strong\u003e (S + V), KHÔNG dùng trật tự câu hỏi!\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eSo sánh:\u003c/strong\u003e\u003cbr\u003e\r\n            She asked where \u003cstrong\u003ewas\u003c/strong\u003e the book. (SAI - trật tự câu hỏi)\u003cbr\u003e\r\n            She asked where the book \u003cstrong\u003ewas\u003c/strong\u003e. (ĐÚNG - trật tự trần thuật)\u003cbr\u003e\u003cbr\u003e\r\n            He asked what \u003cstrong\u003edid\u003c/strong\u003e I want. (SAI - còn trợ động từ do/did)\u003cbr\u003e\r\n            He asked what I \u003cstrong\u003ewanted\u003c/strong\u003e. (ĐÚNG - bỏ do/did, chia V theo thì)\u003cbr\u003e\u003cbr\u003e\r\n            She asked if \u003cstrong\u003ecan\u003c/strong\u003e I help. (SAI)\u003cbr\u003e\r\n            She asked if I \u003cstrong\u003ecould\u003c/strong\u003e help. (ĐÚNG)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi thường gặp:\u003c/strong\u003e\u003cbr\u003e\r\n            • Giữ nguyên trật tự câu hỏi → SAI!\u003cbr\u003e\r\n            • Quên bỏ \u003cstrong\u003edo/does/did\u003c/strong\u003e → SAI!\u003cbr\u003e\r\n            • Nhớ: sau if/whether/từ hỏi → \u003cstrong\u003eS + V\u003c/strong\u003e (như câu kể)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Tense changes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 Đổi Thì Trong Câu Hỏi Tường Thuật (Giống Câu Kể)\u003c/h3\u003e\r\n          \u003cp\u003eQuy tắc lùi thì giống hệt reported statements:\u003c/p\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 0.5rem;\"\u003e\r\n            \u003ctr style=\"background: #e3f2fd;\"\u003e\r\n              \u003cth style=\"border: 1px solid #ccc; padding: 6px; text-align: left;\"\u003eTrực tiếp\u003c/th\u003e\r\n              \u003cth style=\"border: 1px solid #ccc; padding: 6px; text-align: left;\"\u003eTường thuật\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eam/is\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ewas\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eare\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ewere\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003edo/does\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003e(bỏ) + V-ed\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003edid\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ehad + V3\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ehave/has\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ehad\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ewill\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ewould\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ecan\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003ecould\u003c/td\u003e\u003c/tr\u003e\r\n            \u003ctr\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003emay\u003c/td\u003e\u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003emight\u003c/td\u003e\u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Đổi đại từ:\u003c/strong\u003e\u003cbr\u003e\r\n            I → he/she \u0026nbsp;|\u0026nbsp; you → I/he/she/they \u0026nbsp;|\u0026nbsp; my → his/her \u0026nbsp;|\u0026nbsp; your → my/his/her\u003cbr\u003e\r\n            this → that \u0026nbsp;|\u0026nbsp; here → there \u0026nbsp;|\u0026nbsp; now → then \u0026nbsp;|\u0026nbsp; today → that day\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Reported commands --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Câu Mệnh Lệnh Tường Thuật: told + O + to V\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCông thức:\u003c/strong\u003e S + \u003cstrong\u003etold\u003c/strong\u003e + O + \u003cstrong\u003eto + V\u003c/strong\u003e (nguyên mẫu)\u003c/p\u003e\r\n          \u003cp\u003eDùng cho câu ra lệnh, chỉ thị (KHÔNG có \"please\", giọng dứt khoát).\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \"Finish your dinner, Suzy,\" said Mum. → Mum \u003cstrong\u003etold\u003c/strong\u003e Suzy \u003cstrong\u003eto finish\u003c/strong\u003e her dinner.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Mẹ bảo Suzy ăn hết bữa tối.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Sit down!\" the teacher said. → The teacher \u003cstrong\u003etold\u003c/strong\u003e us \u003cstrong\u003eto sit\u003c/strong\u003e down.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Giáo viên bảo chúng tôi ngồi xuống.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Clean your room,\" Dad said to me. → Dad \u003cstrong\u003etold\u003c/strong\u003e me \u003cstrong\u003eto clean\u003c/strong\u003e my room.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Bố bảo tôi dọn phòng.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Nhận biết command:\u003c/strong\u003e Giọng dứt khoát, không có \"please\", không có \"can you/could you\"\u003cbr\u003e\r\n            Ví dụ: \"Stop!\", \"Be quiet!\", \"Go home!\", \"Don't touch that!\"\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Reported requests --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Câu Yêu Cầu Tường Thuật: asked + O + to V\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCông thức:\u003c/strong\u003e S + \u003cstrong\u003easked\u003c/strong\u003e + O + \u003cstrong\u003eto + V\u003c/strong\u003e (nguyên mẫu)\u003c/p\u003e\r\n          \u003cp\u003eDùng cho câu yêu cầu lịch sự (có \"please\", \"Can you...?\", \"Could you...?\", \"Would you...?\").\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \"Please close the window.\" → He \u003cstrong\u003easked\u003c/strong\u003e me \u003cstrong\u003eto close\u003c/strong\u003e the window.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Anh ấy nhờ tôi đóng cửa sổ.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Can you help me, please?\" she said. → She \u003cstrong\u003easked\u003c/strong\u003e me \u003cstrong\u003eto help\u003c/strong\u003e her.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy nhờ tôi giúp.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Could you pass the salt?\" → He \u003cstrong\u003easked\u003c/strong\u003e me \u003cstrong\u003eto pass\u003c/strong\u003e the salt.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Anh ấy nhờ tôi đưa muối.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Nhận biết request:\u003c/strong\u003e Có \"please\", \"Can you...?\", \"Could you...?\", \"Would you mind...?\"\u003cbr\u003e\r\n            Giọng lịch sự, nhã nhặn → dùng \u003cstrong\u003easked\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: Negative commands/requests --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 Phủ Định: told/asked + O + NOT to V\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCông thức:\u003c/strong\u003e S + told/asked + O + \u003cstrong\u003enot to + V\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \"Don't run inside!\" Mum said. → Mum \u003cstrong\u003etold\u003c/strong\u003e us \u003cstrong\u003enot to run\u003c/strong\u003e inside.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Mẹ bảo chúng tôi không được chạy trong nhà.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Please don't be late.\" → She \u003cstrong\u003easked\u003c/strong\u003e me \u003cstrong\u003enot to be\u003c/strong\u003e late.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy nhờ tôi đừng đến muộn.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ \"Don't touch the oven!\" → Dad \u003cstrong\u003etold\u003c/strong\u003e me \u003cstrong\u003enot to touch\u003c/strong\u003e the oven.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Bố bảo tôi không được sờ vào lò.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Chú ý:\u003c/strong\u003e \u003cstrong\u003eNOT\u003c/strong\u003e đứng TRƯỚC \u003cstrong\u003eto\u003c/strong\u003e!\u003cbr\u003e\r\n            told me \u003cstrong\u003enot to\u003c/strong\u003e go\u003cbr\u003e\r\n            told me \u003cstrong\u003eto not\u003c/strong\u003e go (SAI!)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 8: told vs asked --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e8 TOLD vs ASKED — Phân Biệt Mệnh Lệnh và Yêu Cầu\u003c/h3\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 0.5rem;\"\u003e\r\n            \u003ctr style=\"background: #e3f2fd;\"\u003e\r\n              \u003cth style=\"border: 1px solid #ccc; padding: 6px; text-align: left;\"\u003e\u003c/th\u003e\r\n              \u003cth style=\"border: 1px solid #ccc; padding: 6px; text-align: left;\"\u003eTOLD (Mệnh lệnh)\u003c/th\u003e\r\n              \u003cth style=\"border: 1px solid #ccc; padding: 6px; text-align: left;\"\u003eASKED (Yêu cầu)\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003e\u003cstrong\u003eGiọng\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eDứt khoát, ra lệnh\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eLịch sự, nhờ vả\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003e\u003cstrong\u003eDấu hiệu\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eKhông có \"please\"\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eCó \"please\", \"Can you...?\"\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003e\u003cstrong\u003eVí dụ trực tiếp\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003e\"Stop talking!\"\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003e\"Please stop talking.\"\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003e\u003cstrong\u003eTường thuật\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eHe \u003cstrong\u003etold\u003c/strong\u003e me to stop.\u003c/td\u003e\r\n              \u003ctd style=\"border: 1px solid #ccc; padding: 6px;\"\u003eHe \u003cstrong\u003easked\u003c/strong\u003e me to stop.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo:\u003c/strong\u003e Thấy \u003cstrong\u003eplease / Can you / Could you / Would you\u003c/strong\u003e → dùng \u003cstrong\u003easked\u003c/strong\u003e\u003cbr\u003e\r\n            Không thấy → dùng \u003cstrong\u003etold\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 9: Common mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e9 Lỗi Thường Gặp\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi 1: Giữ trật tự câu hỏi\u003c/strong\u003e\u003cbr\u003e\r\n            She asked where \u003cstrong\u003ewas\u003c/strong\u003e he. → She asked where he \u003cstrong\u003ewas\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 2: Quên bỏ do/does/did\u003c/strong\u003e\u003cbr\u003e\r\n            He asked what \u003cstrong\u003edid\u003c/strong\u003e I want. → He asked what I \u003cstrong\u003ewanted\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 3: Dùng \"said\" cho câu hỏi\u003c/strong\u003e\u003cbr\u003e\r\n            He \u003cstrong\u003esaid\u003c/strong\u003e me where I lived. → He \u003cstrong\u003easked\u003c/strong\u003e me where I lived.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 4: Quên \"if/whether\" cho Yes/No\u003c/strong\u003e\u003cbr\u003e\r\n            She asked I was ready. → She asked \u003cstrong\u003eif\u003c/strong\u003e I was ready.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 5: Đặt NOT sai vị trí\u003c/strong\u003e\u003cbr\u003e\r\n            She told me to not go. → She told me \u003cstrong\u003enot to\u003c/strong\u003e go.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 6: Dùng \"told\" cho câu hỏi\u003c/strong\u003e\u003cbr\u003e\r\n            He \u003cstrong\u003etold\u003c/strong\u003e me where I lived. → He \u003cstrong\u003easked\u003c/strong\u003e me where I lived.\u003cbr\u003e\r\n            (told chỉ dùng cho commands, KHÔNG dùng cho questions!)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-11-journey-to-space\",\"title\":\"Unit 11: Journey to Space - Reported Speech (2 \u0026 3)\",\"grammarTopics\":[\"Reported speech: questions\",\"Reported speech: commands and requests\"],\"theory\":{\"brief\":\"Reported questions: asked + O + wh-word/if/whether + S + V (lùi thì). Reported commands: told + O + (not) to V. Reported requests: asked + O + (not) to V.\",\"rules\":[\"Câu hỏi có từ hỏi: asked + O + wh-word + S + V (trật tự trần thuật, lùi thì)\",\"Câu hỏi Yes/No: asked + O + if/whether + S + V (lùi thì)\",\"Trật tự từ: đổi từ câu hỏi sang câu trần thuật (S + V), bỏ do/does/did\",\"Lùi thì: is→was, are→were, do/does→V-ed, did→had V3, will→would, can→could\",\"Mệnh lệnh: told + O + to V (không có please)\",\"Yêu cầu: asked + O + to V (có please/can you/could you)\",\"Phủ định: told/asked + O + not to V\"]},\"exercises\":[{\"id\":1,\"type\":\"sentence-rewrite\",\"original\":\"'Where does Carrie live?' she asked him.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"She asked him\",\"answer\":\"She asked him where Carrie lived.\",\"acceptedAnswers\":[\"She asked him where Carrie lived.\",\"She asked him where Carrie lived\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu hỏi có từ hỏi 'where' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ 'where'\u003cbr\u003e• Bỏ 'does', đổi 'live' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'lived' (lùi thì)\u003cbr\u003e• Trật tự trần thuật: where + Carrie + lived\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy hỏi anh ấy Carrie sống ở đâu.\",\"hints\":[\"Bỏ 'does', đổi 'live' → 'lived'\"],\"points\":10},{\"id\":2,\"type\":\"sentence-rewrite\",\"original\":\"'What time is it?' Linda asked Anna.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Linda asked Anna\",\"answer\":\"Linda asked Anna what time it was.\",\"acceptedAnswers\":[\"Linda asked Anna what time it was.\",\"Linda asked Anna what time it was\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'what time' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Đổi 'is' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'was' (lùi thì)\u003cbr\u003e• Trật tự trần thuật: what time + it + was\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Linda hỏi Anna mấy giờ rồi.\",\"hints\":[\"Đổi 'is' → 'was'\",\"Trật tự: what time + it + was\"],\"points\":10},{\"id\":3,\"type\":\"sentence-rewrite\",\"original\":\"'When is your holiday?' Frank asked Andy.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Frank asked Andy\",\"answer\":\"Frank asked Andy when his holiday was.\",\"acceptedAnswers\":[\"Frank asked Andy when his holiday was.\",\"Frank asked Andy when his holiday was\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'when' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Đổi 'your' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'his' (Andy là nam)\u003cbr\u003e• Đổi 'is' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'was'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Frank hỏi Andy kỳ nghỉ của anh ấy khi nào.\",\"hints\":[\"Đổi 'your' → 'his'\",\"Đổi 'is' → 'was'\"],\"points\":10},{\"id\":4,\"type\":\"sentence-rewrite\",\"original\":\"'What kind of ice cream do you want?' the waitress asked us.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"The waitress asked us\",\"answer\":\"The waitress asked us what kind of ice cream we wanted.\",\"acceptedAnswers\":[\"The waitress asked us what kind of ice cream we wanted.\",\"The waitress asked us what kind of ice cream we wanted\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'what kind of' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Bỏ 'do', đổi 'want' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'wanted'\u003cbr\u003e• Đổi 'you' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'we'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô phục vụ hỏi chúng tôi muốn loại kem nào.\",\"hints\":[\"Bỏ 'do', đổi 'want' → 'wanted'\"],\"points\":10},{\"id\":5,\"type\":\"sentence-rewrite\",\"original\":\"'Why do giraffes have long necks?' Cathy asked her teacher.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Cathy asked her teacher\",\"answer\":\"Cathy asked her teacher why giraffes had long necks.\",\"acceptedAnswers\":[\"Cathy asked her teacher why giraffes had long necks.\",\"Cathy asked her teacher why giraffes had long necks\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'why' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Bỏ 'do', đổi 'have' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'had'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cathy hỏi cô giáo tại sao hươu cao cổ có cổ dài.\",\"hints\":[\"Bỏ 'do'\",\"Đổi 'have' → 'had'\"],\"points\":10},{\"id\":6,\"type\":\"sentence-rewrite\",\"original\":\"'Where are the scissors?' Mandy asked Zoe.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Mandy asked Zoe\",\"answer\":\"Mandy asked Zoe where the scissors were.\",\"acceptedAnswers\":[\"Mandy asked Zoe where the scissors were.\",\"Mandy asked Zoe where the scissors were\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'where' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Đổi 'are' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'were'\u003cbr\u003e• Trật tự trần thuật: where + the scissors + were\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mandy hỏi Zoe cái kéo ở đâu.\",\"hints\":[\"Đổi 'are' → 'were'\",\"Trật tự: where + the scissors + were\"],\"points\":10},{\"id\":7,\"type\":\"sentence-rewrite\",\"original\":\"'How old were you when you decided to become an astronaut?' Ned asked Mr Nash.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Ned asked Mr Nash\",\"answer\":\"Ned asked Mr Nash how old he had been when he had decided to become an astronaut.\",\"acceptedAnswers\":[\"Ned asked Mr Nash how old he had been when he had decided to become an astronaut.\",\"Ned asked Mr Nash how old he had been when he had decided to become an astronaut\",\"Ned asked Mr Nash how old he had been when he decided to become an astronaut.\",\"Ned asked Mr Nash how old he had been when he decided to become an astronaut\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'how old' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Đổi 'were' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'had been', 'decided' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'had decided' (past \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e past perfect)\u003cbr\u003e• Đổi 'you' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'he'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ned hỏi ông Nash bao nhiêu tuổi khi ông quyết định trở thành phi hành gia.\",\"hints\":[\"Đổi 'were' → 'had been'\",\"Đổi 'you' → 'he'\"],\"points\":10},{\"id\":8,\"type\":\"sentence-rewrite\",\"original\":\"'When will you arrive back on Earth?' Ned asked Mr Nash.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Ned asked Mr Nash\",\"answer\":\"Ned asked Mr Nash when he would arrive back on Earth.\",\"acceptedAnswers\":[\"Ned asked Mr Nash when he would arrive back on Earth.\",\"Ned asked Mr Nash when he would arrive back on Earth\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'when' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Đổi 'will' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'would'\u003cbr\u003e• Đổi 'you' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'he'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ned hỏi ông Nash khi nào ông sẽ trở lại Trái Đất.\",\"hints\":[\"Đổi 'will' → 'would'\",\"Đổi 'you' → 'he'\"],\"points\":10},{\"id\":9,\"type\":\"sentence-rewrite\",\"original\":\"'What can you see from space?' Ned asked Mr Nash.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Ned asked Mr Nash\",\"answer\":\"Ned asked Mr Nash what he could see from space.\",\"acceptedAnswers\":[\"Ned asked Mr Nash what he could see from space.\",\"Ned asked Mr Nash what he could see from space\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Từ hỏi 'what' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ nguyên\u003cbr\u003e• Đổi 'can' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'could'\u003cbr\u003e• Đổi 'you' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'he'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ned hỏi ông Nash có thể nhìn thấy gì từ vũ trụ.\",\"hints\":[\"Đổi 'can' → 'could'\",\"Đổi 'you' → 'he'\"],\"points\":10},{\"id\":10,\"type\":\"sentence-rewrite\",\"original\":\"'What do you like best about being in space?' Ned asked Mr Nash.\",\"instruction\":\"Viết lại thành câu tường thuật\",\"starterText\":\"Ned asked Mr Nash\",\"answer\":\"Ned asked Mr Nash what he liked best about being in space.\",\"acceptedAnswers\":[\"Ned asked Mr Nash what he liked best about being in space.\",\"Ned asked Mr Nash what he liked best about being in space\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước ere do you live?' = câu hỏi có từ hỏi \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ 'where'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy hỏi tôi sống ở đâu.\",\"hints\":[\"Câu hỏi Wh → giữ từ hỏi\"],\"points\":10},{\"id\":83,\"type\":\"fill-blank\",\"question\":\"She asked me ___ I was doing there. (what/if)\",\"answer\":\"what\",\"acceptedAnswers\":[\"what\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu gốc: 'What are you doing here?' = câu hỏi Wh \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ 'what'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy hỏi tôi đang làm gì ở đó.\",\"hints\":[\"Câu hỏi Wh → what\"],\"points\":10},{\"id\":84,\"type\":\"fill-blank\",\"question\":\"'Don't open the door to strangers!' → Mum ___ us not to open the door to strangers.\",\"answer\":\"told\",\"acceptedAnswers\":[\"told\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu mệnh lệnh khẳng định dùng \u003cstrong\u003etold + tân ngữ + to-V\u003c/strong\u003e, mệnh lệnh phủ định dùng \u003cstrong\u003etold + tân ngữ + not to-V\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Mệnh lệnh phủ định \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e dùng 'told'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mẹ bảo chúng tôi không được mở cửa cho người lạ.\",\"hints\":[\"Mệnh lệnh → told\"],\"points\":10},{\"id\":85,\"type\":\"fill-blank\",\"question\":\"'Would you mind turning down the music?' → She ___ me to turn down the music.\",\"answer\":\"asked\",\"acceptedAnswers\":[\"asked\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu yêu cầu lịch sự khẳng định dùng \u003cstrong\u003easked + tân ngữ + to-V\u003c/strong\u003e, yêu cầu phủ định dùng \u003cstrong\u003easked + tân ngữ + not to-V\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'Would you mind...?' = yêu cầu lịch sự \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e dùng 'asked'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy nhờ tôi vặn nhỏ nhạc.\",\"hints\":[\"Would you mind → asked\"],\"points\":10},{\"id\":86,\"type\":\"multiple-choice\",\"question\":\"Choose the correct reported question: Jenny asked me ___\",\"options\":[\"where were the toys.\",\"where the toys were.\",\"where are the toys.\",\"where the toys are.\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu hỏi tường thuật dùng trật tự trần thuật (S + V)\u003cbr\u003e• 'where the toys were' = trật tự đúng (S trước V)\u003cbr\u003e• 'where were the toys' = trật tự câu hỏi (SAI)\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Jenny hỏi tôi đồ chơi ở đâu.\",\"hints\":[\"Trật tự trần thuật: S + V\"],\"points\":10},{\"id\":87,\"type\":\"multiple-choice\",\"question\":\"Choose the correct reported question: I asked Grandpa ___\",\"options\":[\"how long lived he in Italy.\",\"how long he'd lived in Italy.\",\"how long did he live in Italy.\",\"how long he lives in Italy.\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Trật tự trần thuật + lùi thì (past \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e past perfect)\u003cbr\u003e• 'he'd lived' = 'he had lived' (past perfect)\u003cbr\u003e• 'did he live' = còn trợ động từ did (SAI)\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi hỏi ông đã sống ở Ý bao lâu.\",\"hints\":[\"Lùi thì: lived → had lived\"],\"points\":10},{\"id\":88,\"type\":\"multiple-choice\",\"question\":\"Choose the correct reported question: Dad asked me ___\",\"options\":[\"who did win the art prize.\",\"who had won the art prize.\",\"who wins the art prize.\",\"who does win the art prize.\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Lùi thì: won \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e had won (past \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e past perfect)\u003cbr\u003e• 'who' là chủ ngữ nên trật tự giữ nguyên\u003cbr\u003e• 'who did win' = còn 'did' (SAI)\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bố hỏi tôi ai đã giành giải vẽ.\",\"hints\":[\"won → had won\"],\"points\":10},{\"id\":89,\"type\":\"multiple-choice\",\"question\":\"Choose the correct reported question: My teacher asked me ___\",\"options\":[\"how was my brother.\",\"how my brother was.\",\"how is my brother.\",\"how my brother is.\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Trật tự trần thuật: how + S + V = how my brother was\u003cbr\u003e• Lùi thì: is \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e was\u003cbr\u003e• 'how was my brother' = trật tự câu hỏi (SAI)\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô giáo hỏi tôi anh trai tôi thế nào.\",\"hints\":[\"Trật tự: how + S + V\"],\"points\":10},{\"id\":90,\"type\":\"multiple-choice\",\"question\":\"She asked me ___ I had ever been abroad.\",\"options\":[\"what\",\"if\",\"where\",\"who\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi Có/Không (Yes/No question): \u003cstrong\u003easked (+ tân ngữ) + if/whether + S + V (lùi thì)\u003c/strong\u003e (không dùng trợ động từ do/does/did).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu gốc: 'Have you ever been abroad?' = Yes/No \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e dùng 'if'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy hỏi tôi đã bao giờ đi nước ngoài chưa.\",\"hints\":[\"Câu hỏi Yes/No → if\"],\"points\":10},{\"id\":91,\"type\":\"multiple-choice\",\"question\":\"He asked me ___ I wanted for lunch.\",\"options\":[\"if\",\"what\",\"whether\",\"that\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu gốc: 'What do you want for lunch?' = Wh-question \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e giữ 'what'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy hỏi tôi muốn ăn gì cho bữa trưa.\",\"hints\":[\"Câu hỏi Wh → giữ từ hỏi\"],\"points\":10},{\"id\":92,\"type\":\"multiple-choice\",\"question\":\"'Stop running!' the coach said. This is a ___\",\"options\":[\"question\",\"command\",\"request\",\"statement\"],\"correctIndex\":1,\"g  Cô ấy hỏi tôi bao nhiêu tuổi.\",\"hints\":[\"Trật tự: how old + S + V\"],\"points\":10},{\"id\":196,\"type\":\"error-correct\",\"wrongSentence\":\"He told me where the station was.\",\"correctSentence\":\"He asked me where the station was.\",\"errorWord\":\"told\",\"correction\":\"asked\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ để hỏi (Wh-question): \u003cstrong\u003easked (+ tân ngữ) + từ để hỏi + S + V (lùi thì)\u003c/strong\u003e (không đảo động từ/trợ động từ lên trước chủ ngữ).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Đây là câu hỏi tường thuật \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e dùng 'asked'\u003cbr\u003e• 'told' chỉ dùng cho mệnh lệnh\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy hỏi tôi nhà ga ở đâu.\",\"hints\":[\"Câu hỏi → asked\"],\"points\":10},{\"id\":197,\"type\":\"error-correct\",\"wrongSentence\":\"She asked if do I like music.\",\"correctSentence\":\"She asked if I liked music.\",\"errorWord\":\"do I like\",\"correction\":\"I liked\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi Có/Không (Yes/No question): \u003cstrong\u003easked (+ tân ngữ) + if/whether + S + V (lùi thì)\u003c/strong\u003e (không dùng trợ động từ do/does/did).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Bỏ 'do', đổi 'like' \u003cstrong\u003e\u0026rarr;\u003c/strong\u003e 'liked' + trật tự trần thuật\u003cbr\u003e• 'if do I like' = còn 'do' + trật tự câu hỏi\u003cbr\u003e• 'if I liked'\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy hỏi tôi có thích nhạc không.\",\"hints\":[\"Bỏ 'do', like → liked\"],\"points\":10},{\"id\":198,\"type\":\"error-correct\",\"wrongSentence\":\"The teacher told us don't talk in class.\",\"correctSentence\":\"The teacher told us not to talk in class.\",\"errorWord\":\"don't talk\",\"correction\":\"not to talk\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u
