_heading\"\u003e1 Cấu Trúc Present Perfect Continuous (Hiện Tại Hoàn Thành Tiếp Diễn)\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịnh nghĩa:\u003c/strong\u003e Diễn tả hành động bắt đầu trong quá khứ và vẫn đang tiếp diễn đến hiện tại, hoặc vừa mới kết thúc gần đây với kết quả nhìn thấy được.\u003c/p\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eDạng\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eCấu trúc\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eVí dụ\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eKhẳng định (+)\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eS + \u003cstrong\u003ehave/has + been + V-ing\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eI \u003cstrong\u003ehave been waiting\u003c/strong\u003e for an hour.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003ePhủ định (-)\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eS + \u003cstrong\u003ehaven't/hasn't + been + V-ing\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003eShe \u003cstrong\u003ehasn't been studying\u003c/strong\u003e.\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eCâu hỏi (?)\u003c/strong\u003e\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eHave/Has\u003c/strong\u003e + S + \u003cstrong\u003ebeen + V-ing\u003c/strong\u003e?\u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\u003cstrong\u003eHave\u003c/strong\u003e you \u003cstrong\u003ebeen waiting\u003c/strong\u003e long?\u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e\u003cbr\u003e\r\n            • I / You / We / They → \u003cstrong\u003ehave been\u003c/strong\u003e + V-ing\u003cbr\u003e\r\n            • He / She / It → \u003cstrong\u003ehas been\u003c/strong\u003e + V-ing\u003cbr\u003e\r\n            • Viết tắt: I've been, She's been, They've been\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Usage 1 --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 Cách Dùng 1: Hành Động Bắt Đầu Trong Quá Khứ, Vẫn Đang Tiếp Diễn\u003c/h3\u003e\r\n          \u003cp\u003eNhấn mạnh \u003cstrong\u003equá trình\u003c/strong\u003e và \u003cstrong\u003ethời gian kéo dài\u003c/strong\u003e của hành động.\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ I \u003cstrong\u003ehave been waiting\u003c/strong\u003e for you \u003cstrong\u003efor two hours\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Tôi đã đợi bạn 2 tiếng rồi — và vẫn đang đợi.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003ehas been studying\u003c/strong\u003e English \u003cstrong\u003esince 2020\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Cô ấy đã học tiếng Anh từ 2020 — và vẫn đang học.)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ They \u003cstrong\u003ehave been playing\u003c/strong\u003e football \u003cstrong\u003eall afternoon\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Họ đã chơi bóng đá cả buổi chiều — và vẫn đang chơi.)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Usage 2 --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 Cách Dùng 2: Hành Động Vừa Kết Thúc, Có Kết Quả Nhìn Thấy Được\u003c/h3\u003e\r\n          \u003cp\u003eHành động vừa dừng nhưng \u003cstrong\u003ekết quả\u003c/strong\u003e vẫn còn thấy rõ.\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ Your eyes are red. \u003cstrong\u003eHave you been crying?\u003c/strong\u003e\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Mắt bạn đỏ. Bạn đã khóc à? — kết quả: mắt đỏ)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ The ground is wet. It \u003cstrong\u003ehas been raining\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Đất ướt. Trời đã mưa. — kết quả: đất ướt)\u003cbr\u003e\u003cbr\u003e\r\n            ✓ He's out of breath. He \u003cstrong\u003ehas been running\u003c/strong\u003e.\u003cbr\u003e\r\n            \u0026nbsp;\u0026nbsp;(Anh ấy thở hổn hển. Anh ấy đã chạy. — kết quả: hết hơi)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e So sánh hai cách dùng:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eCách dùng 1 (vẫn tiếp diễn):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I've been reading \u003cstrong\u003efor two hours\u003c/strong\u003e. (Tôi vẫn đang đọc)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eCách dùng 2 (vừa dừng, có kết quả):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I've been reading. \u003cstrong\u003eMy eyes are tired.\u003c/strong\u003e (Tôi vừa dừng, mắt mỏi)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: For vs Since --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 FOR vs SINCE với Present Perfect Continuous\u003c/h3\u003e\r\n\r\n          \u003ctable style=\"width: 100%; border-collapse: collapse; margin-top: 10px;\"\u003e\r\n            \u003ctr style=\"background: var(--bg-light);\"\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eFOR + Khoảng thời gian\u003c/th\u003e\r\n              \u003cth style=\"padding: 8px;\"\u003eSINCE + Mốc thời gian\u003c/th\u003e\r\n            \u003c/tr\u003e\r\n            \u003ctr\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\r\n                for \u003cstrong\u003ean hour\u003c/strong\u003e\u003cbr\u003e\r\n                for \u003cstrong\u003etwo days\u003c/strong\u003e\u003cbr\u003e\r\n                for \u003cstrong\u003ethree weeks\u003c/strong\u003e\u003cbr\u003e\r\n                for \u003cstrong\u003esix months\u003c/strong\u003e\u003cbr\u003e\r\n                for \u003cstrong\u003ea long time\u003c/strong\u003e\u003cbr\u003e\r\n                for \u003cstrong\u003eages\u003c/strong\u003e\r\n              \u003c/td\u003e\r\n              \u003ctd style=\"padding: 8px;\"\u003e\r\n                since \u003cstrong\u003eMonday\u003c/strong\u003e\u003cbr\u003e\r\n                since \u003cstrong\u003e9 o'clock\u003c/strong\u003e\u003cbr\u003e\r\n                since \u003cstrong\u003e2020\u003c/strong\u003e\u003cbr\u003e\r\n                since \u003cstrong\u003eyesterday\u003c/strong\u003e\u003cbr\u003e\r\n                since \u003cstrong\u003ebreakfast\u003c/strong\u003e\u003cbr\u003e\r\n                since \u003cstrong\u003eI was seven\u003c/strong\u003e\r\n              \u003c/td\u003e\r\n            \u003c/tr\u003e\r\n          \u003c/table\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi thường gặp:\u003c/strong\u003e\u003cbr\u003e\r\n            I have been waiting \u003cstrong\u003esince\u003c/strong\u003e two hours. (SAI!)\u003cbr\u003e\r\n            ✓ I have been waiting \u003cstrong\u003efor\u003c/strong\u003e two hours. (ĐÚNG — khoảng thời gian)\u003cbr\u003e\u003cbr\u003e\r\n            She has been studying \u003cstrong\u003efor\u003c/strong\u003e 9 o'clock. (SAI!)\u003cbr\u003e\r\n            ✓ She has been studying \u003cstrong\u003esince\u003c/strong\u003e 9 o'clock. (ĐÚNG — mốc thời gian)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Time expressions --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Các Cụm Từ Thời Gian Thường Gặp: ALL + Time\u003c/h3\u003e\r\n          \u003cp\u003eDùng \u003cstrong\u003eall + thời gian\u003c/strong\u003e để nhấn mạnh hành động diễn ra \u003cstrong\u003esuốt\u003c/strong\u003e khoảng thời gian đó.\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            ✓ I've been studying \u003cstrong\u003eall morning\u003c/strong\u003e. (cả buổi sáng)\u003cbr\u003e\r\n            ✓ She's been cooking \u003cstrong\u003eall day\u003c/strong\u003e. (cả ngày)\u003cbr\u003e\r\n            ✓ They've been practising \u003cstrong\u003eall afternoon\u003c/strong\u003e. (cả buổi chiều)\u003cbr\u003e\r\n            ✓ We've been working \u003cstrong\u003eall week\u003c/strong\u003e. (cả tuần)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo:\u003c/strong\u003e \u003cstrong\u003eall morning / all day / all week\u003c/strong\u003e KHÔNG cần for hay since!\u003cbr\u003e\r\n            ✓ I've been reading \u003cstrong\u003eall day\u003c/strong\u003e.\u003cbr\u003e\r\n            I've been reading \u003cstrong\u003efor\u003c/strong\u003e all day. (SAI!)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Simple vs Continuous --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Present Perfect Simple vs Present Perfect Continuous\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Khi nào dùng Simple, khi nào dùng Continuous?\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003ctable style=\"width: 100%; border-collapse: collapse;\"\u003e\r\n              \u003ctr style=\"background: rgba(255,255,255,0.5);\"\u003e\r\n                \u003cth style=\"padding: 8px;\"\u003ePresent Perfect Simple\u003c/th\u003e\r\n                \u003cth style=\"padding: 8px;\"\u003ePresent Perfect Continuous\u003c/th\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr\u003e\r\n                \u003ctd style=\"padding: 8px;\"\u003e\r\n                  Nhấn mạnh \u003cstrong\u003ekết quả / hoàn thành\u003c/strong\u003e\u003cbr\u003e\r\n                  ✓ I've \u003cstrong\u003eread\u003c/strong\u003e 3 books. (đã đọc xong 3 cuốn)\u003cbr\u003e\r\n                  ✓ She's \u003cstrong\u003ewritten\u003c/strong\u003e 5 emails. (đã viết xong 5 email)\r\n                \u003c/td\u003e\r\n                \u003ctd style=\"padding: 8px;\"\u003e\r\n                  Nhấn mạnh \u003cstrong\u003equá trình / thời gian\u003c/strong\u003e\u003cbr\u003e\r\n                  ✓ I've \u003cstrong\u003ebeen reading\u003c/strong\u003e all day. (đọc cả ngày)\u003cbr\u003e\r\n                  ✓ She's \u003cstrong\u003ebeen writing\u003c/strong\u003e emails all morning. (viết cả sáng)\r\n                \u003c/td\u003e\r\n              \u003c/tr\u003e\r\n              \u003ctr style=\"background: rgba(255,255,255,0.5);\"\u003e\r\n                \u003ctd style=\"padding: 8px;\"\u003e\r\n                  Hỏi \u003cstrong\u003eHow many / How much\u003c/strong\u003e\u003cbr\u003e\r\n                  ✓ How many pages \u003cstrong\u003ehave\u003c/strong\u003e you \u003cstrong\u003eread\u003c/strong\u003e?\r\n                \u003c/td\u003e\r\n                \u003ctd style=\"padding: 8px;\"\u003e\r\n                  Hỏi \u003cstrong\u003eHow long\u003c/strong\u003e\u003cbr\u003e\r\n                  ✓ How long \u003cstrong\u003ehave\u003c/strong\u003e you \u003cstrong\u003ebeen reading\u003c/strong\u003e?\r\n                \u003c/td\u003e\r\n              \u003c/tr\u003e\r\n            \u003c/table\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: Common mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 Lỗi Sai Thường Gặp \u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Các lỗi cần tránh:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eLỗi 1: Dùng sai have/has\u003c/strong\u003e\u003cbr\u003e\r\n            She \u003cstrong\u003ehave\u003c/strong\u003e been waiting.\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003ehas\u003c/strong\u003e been waiting.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eLỗi 2: Quên \"been\"\u003c/strong\u003e\u003cbr\u003e\r\n            I have \u003cstrong\u003ewaiting\u003c/strong\u003e for an hour.\u003cbr\u003e\r\n            ✓ I have \u003cstrong\u003ebeen waiting\u003c/strong\u003e for an hour.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eLỗi 3: Dùng V-ed thay vì V-ing\u003c/strong\u003e\u003cbr\u003e\r\n            She has been \u003cstrong\u003estudied\u003c/strong\u003e.\u003cbr\u003e\r\n            ✓ She has been \u003cstrong\u003estudying\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eLỗi 4: Nhầm for / since\u003c/strong\u003e\u003cbr\u003e\r\n            I've been waiting \u003cstrong\u003esince\u003c/strong\u003e two hours.\u003cbr\u003e\r\n            ✓ I've been waiting \u003cstrong\u003efor\u003c/strong\u003e two hours.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eLỗi 5: Sai chính tả V-ing\u003c/strong\u003e\u003cbr\u003e\r\n            run → \u003cstrong\u003eruning\u003c/strong\u003e | sit → \u003cstrong\u003esiting\u003c/strong\u003e | swim → \u003cstrong\u003eswiming\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ run → \u003cstrong\u003erunning\u003c/strong\u003e | sit → \u003cstrong\u003esitting\u003c/strong\u003e | swim → \u003cstrong\u003eswimming\u003c/strong\u003e\u003cbr\u003e\r\n            (Nhân đôi phụ âm cuối khi nguyên âm ngắn + phụ âm)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-4-making-a-model\",\"title\":\"Unit 4: Making a Model - Present Perfect Continuous\",\"grammarTopics\":[\"Present perfect continuous: affirmative\",\"Present perfect continuous: negative\",\"Present perfect continuous: questions\",\"Present perfect continuous with for and since\",\"Present perfect simple vs present perfect continuous\",\"Time expressions: all morning, all day, all week\"],\"theory\":{\"brief\":\"Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) diễn tả hành động bắt đầu trong quá khứ và vẫn đang tiếp diễn đến hiện tại, hoặc vừa mới kết thúc gần đây với kết quả nhìn thấy được. Cấu trúc: have/has + been + V-ing.\",\"rules\":[\"Khẳng định: S + have/has + been + V-ing\",\"Phủ định: S + haven't/hasn't + been + V-ing\",\"Câu hỏi: Have/Has + S + been + V-ing?\",\"FOR + khoảng thời gian (for two hours, for a week)\",\"SINCE + mốc thời gian (since Monday, since 2020)\",\"ALL + time (all morning, all day, all week)\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"I __________ (wait) for the bus for 20 minutes.\",\"answer\":\"have been waiting\",\"hints\":[\"I → have been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) dùng để diễn tả hành động bắt đầu ở quá khứ và vẫn đang tiếp diễn ở hiện tại. Cấu trúc khẳng định: S + have/has + been + V-ing.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ là \\\"\u003cstrong\u003eI\u003c/strong\u003e\\\" (số nhiều / ngôi thứ nhất) nên ta đi với trợ động từ \u003cstrong\u003ehave\u003c/strong\u003e, tạo thành cụm \u003cstrong\u003ehave been waiting\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã đợi xe buýt 20 phút rồi.\"},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"She __________ (study) English since 9 o'clock.\",\"answer\":\"has been studying\",\"hints\":[\"She → has been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) dùng để diễn tả hành động bắt đầu ở quá khứ và vẫn đang tiếp diễn ở hiện tại. Cấu trúc khẳng định: S + have/has + been + V-ing.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ là \\\"\u003cstrong\u003eShe\u003c/strong\u003e\\\" (số ít) nên ta đi với trợ động từ \u003cstrong\u003ehas\u003c/strong\u003e, tạo thành cụm \u003cstrong\u003ehas been studying\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đã học tiếng Anh từ 9 giờ.\"},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"They __________ (play) football all afternoon.\",\"answer\":\"have been playing\",\"hints\":[\"They → have been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) dùng để diễn tả hành động bắt đầu ở quá khứ và vẫn đang tiếp diễn ở hiện tại. Cấu trúc khẳng định: S + have/has + been + V-ing.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ là \\\"\u003cstrong\u003eThey\u003c/strong\u003e\\\" (số nhiều / ngôi thứ nhất) nên ta đi với trợ động từ \u003cstrong\u003ehave\u003c/strong\u003e, tạo thành cụm \u003cstrong\u003ehave been playing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ đã chơi bóng đá cả buổi chiều.\"},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"He __________ (work) in the garden since morning.\",\"answer\":\"has been working\",\"hints\":[\"He → has been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) dùng để diễn tả hành động bắt đầu ở quá khứ và vẫn đang tiếp diễn ở hiện tại. Cấu trúc khẳng định: S + have/has + been + V-ing.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ là \\\"\u003cstrong\u003eHe\u003c/strong\u003e\\\" (số ít) nên ta đi với trợ động từ \u003cstrong\u003ehas\u003c/strong\u003e, tạo thành cụm \u003cstrong\u003ehas been working\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy đã làm vườn từ sáng.\"},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"We __________ (live) here for ten years.\",\"answer\":\"have been living\",\"hints\":[\"We → have been + V-ing\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) dùng để diễn tả hành động bắt đầu ở quá khứ và vẫn đang tiếp diễn ở hiện tại. Cấu trúc khẳng định: S + have/has + been + V-ing.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ là \\\"\u003cstrong\u003eWe\u003c/strong\u003e\\\" (số nhiều / ngôi thứ nhất) nên ta đi với trợ động từ \u003cstrong\u003ehave\u003c/strong\u003e, tạo thành cụm \u003cstrong\u003ehave been living\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi đã sống ở write → writing (bỏ e trước khi thêm -ing)\"],\"points\":10},{\"id\":153,\"type\":\"error-correct\",\"wrongSentence\":\"She has been makeing a cake all morning.\",\"correctSentence\":\"She has been making a cake all morning.\",\"errorWord\":\"makeing\",\"correction\":\"making\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cần sử dụng đúng cấu trúc của thì hiện tại hoàn thành tiếp diễn (have/has + been + V-ing) và sử dụng đúng giới từ chỉ thời gian (for + khoảng thời gian, since + mốc thời gian).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ viết sai chính tả là \u003cstrong\u003e\\\"makeing\\\"\u003c/strong\u003e. Khi chuyển động từ \\\"make\\\" sang dạng V-ing, quy tắc là bỏ chữ cái 'e' ở cuối trước khi thêm -ing, do đó từ viết đúng phải là \u003cstrong\u003e\\\"making\\\"\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đã làm bánh suốt cả buổi sáng.\",\"hints\":[\"make → making (bỏ e trước khi thêm -ing)\"],\"points\":10},{\"id\":154,\"type\":\"error-correct\",\"wrongSentence\":\"He has been lieing on the sofa all day.\",\"correctSentence\":\"He has been lying on the sofa all day.\",\"errorWord\":\"lieing\",\"correction\":\"lying\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cần sử dụng đúng cấu trúc của thì hiện tại hoàn thành tiếp diễn (have/has + been + V-ing) và sử dụng đúng giới từ chỉ thời gian (for + khoảng thời gian, since + mốc thời gian).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ viết sai chính tả là \u003cstrong\u003e\\\"lieing\\\"\u003c/strong\u003e. Khi chuyển động từ \\\"lie\\\" sang dạng V-ing, quy tắc là biến đổi đuôi 'ie' thành 'y' trước khi thêm -ing, do đó từ viết đúng phải là \u003cstrong\u003e\\\"lying\\\"\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy đã nằm trên ghế sofa cả ngày.\",\"hints\":[\"lie → lying (ie → y trước khi thêm -ing)\"],\"points\":10},{\"id\":155,\"type\":\"error-correct\",\" đầu làm gì đó trong quá khứ và hiện tại vẫn đang tiếp tục. Ta chuyển sang thì hiện tại hoàn thành tiếp diễn với chủ ngữ \\\"\u003cstrong\u003eI\u003c/strong\u003e\\\", đi kèm giới từ \u003cstrong\u003efor\u003c/strong\u003e cho cụm thời gian \\\"\u003cstrong\u003ehalf an hour (nửa tiếng)\u003c/strong\u003e\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã cố gắng gọi cho bạn suốt nửa tiếng rồi.\"},{\"id\":173,\"type\":\"sentence-rewrite\",\"original\":\"The workers started repairing the road on Monday. They are still repairing it.\",\"instruction\":\"Rewrite using the present perfect continuous\",\"starterText\":\"The workers have\",\"answer\":\"The workers have been repairing the road since Monday.\",\"acceptedAnswers\":[\"The workers have been repairing the road since Monday.\",\"The workers have been repairing the road since Monday\"],\"hints\":[\"Use have/has + been + V-ing with for/since\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi viết lại câu diễn tả một hành động bắt đầu ở quá khứ và vẫn tiếp diễn liên tục đến hiện tại, ta chuyển sang thì hiện tại hoàn thành tiếp diễn: S + have/has + been + V-ing + for/since.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu gốc diễn tả hành động bắt đầu làm gì đó trong quá khứ và hiện tại vẫn đang tiếp tục. Ta chuyển sang thì hiện tại hoàn thành tiếp diễn với chủ ngữ \\\"\u003cstrong\u003eThe\u003c/strong\u003e\\\", đi kèm giới từ \u003cstrong\u003esince\u003c/strong\u003e cho cụm thời gian \\\"\u003cstrong\u003eMonday (thứ Hai)\u003c/strong\u003e\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Các công nhân đã sửa đường từ thứ Hai.\"},{\"id\":174,\"type\":\"sentence-rewrite\",\"original\":\"We started collecting stamps when we were children. We still collect stamps.\",\"instruction\":\"Rewrite using the present perfect continuous\",\"starterText\":\"We have\",\"answer\":\"We have been collecting stamps since we were children.\",\"accepte ện tại hoàn thành tiếp diễn với chủ ngữ \\\"\u003cstrong\u003eHe\u003c/strong\u003e\\\", đi kèm giới từ \u003cstrong\u003efor\u003c/strong\u003e cho cụm thời gian \\\"\u003cstrong\u003eten hours\u003c/strong\u003e\\\".\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cậu ấy đã ngủ suốt 10 tiếng rồi.\"},{\"id\":176,\"type\":\"multiple-choice\",\"question\":\"I _____ three books this month. (completed action)\",\"options\":[\"have read\",\"have been reading\",\"has read\",\"has been reading\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành đơn (Present Perfect Simple: S + have/has + V3/V-ed) được dùng để nhấn mạnh kết quả của hành động đã hoàn thành, hoặc số lượng/số lần của sự việc.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu này nói về số lượng sách đã hoàn thành đọc được trong tháng này (three books - 3 cuốn sách). Do đó ta dùng thì hiện tại hoàn thành đơn là \u003cstrong\u003ehave read\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã đọc xong 3 cuốn sách trong tháng này.\",\"hints\":[\"Đã hoàn thành (3 cuốn) → present perfect simple\"],\"points\":10},{\"id\":177,\"type\":\"multiple-choice\",\"question\":\"I _____ this book all day. (ongoing action)\",\"options\":[\"have been reading\",\"have read\",\"has been reading\",\"has read\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous: S + have/has + been + V-ing) được dùng để nhấn mạnh tính liên tục, quá trình hoặc khoảng thời gian hành động diễn ra.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Hành động đọc cuốn sách này kéo dài liên tục suốt cả ngày (all day) và nhấn mạnh tính liên tục của hành động đang diễn ra, do đó ta dùng thì hiện tại hoàn thành tiếp diễn là \u003cstrong\u003ehave been reading\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã đọc cuốn sách này suốt cả ngày.\",\"hints\":[\"Hành động đang diễn ra (cả ngày) → present perfect continuous\"],\"points\":10},{\"id\":178,\"type\":\"multiple-choice\",\"question\":\"She _____ five emails today. (completed)\",\"options\":[\"has written\",\"has been writing\",\"have written\",\"have been writing\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành đơn (Present Perfect Simple: S + have/has + V3/V-ed) được dùng để nhấn mạnh kết quả của hành động đã hoàn thành, hoặc số lượng/số lần của sự việc.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu này nhấn mạnh kết quả/số lượng email đã viết xong và hoàn thành trong ngày hôm nay (five emails - 5 email). Do đó ta dùng thì hiện tại hoàn thành đơn là \u003cstrong\u003ehas written\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Hôm nay cô ấy đã viết xong 5 email.\",\"hints\":[\"Đã hoàn thành (5 email) → present perfect simple\"],\"points\":10},{\"id\":179,\"type\":\"multiple-choice\",\"question\":\"She _____ emails all morning. (ongoing)\",\"options\":[\"has been writing\",\"has written\",\"have been writing\",\"have written\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous: S + have/has + been + V-ing) được dùng để nhấn mạnh tính liên tục, quá trình hoặc khoảng thời gian hành động diễn ra.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu này nhấn mạnh tính liên tục của quá trình viết email kéo dài suốt cả buổi sáng (all morning), do đó ta dùng thì hiện tại hoàn thành tiếp diễn là \u003cstrong\u003ehas been writing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đã viết email suốt cả buổi sáng.\",\"hints\":[\"Hành động đang diễn ra (cả sáng) → present perfect continuous\"],\"points\":10},{\"id\":180,\"type\":\"multiple-choice\",\"question\":\"They _____ the house. It looks great! (result)\",\"options\":[\"have painted\",\"have been painting\",\"has painted\",\"has been painting\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành đơn (Present Perfect Simple: S + have/has + V3/V-ed) được dùng để nhấn mạnh kết quả của hành động đã hoàn thành, hoặc số lượng/số lần của sự việc.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Kết quả rõ ràng ở hiện tại là ngôi nhà trông rất tuyệt (It looks great!) sau khi hành động sơn nhà đã hoàn thành. Do đó ta dùng thì hiện tại hoàn thành đơn là \u003cstrong\u003ehave painted\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ đã sơn xong ngôi nhà. Trông nó thật tuyệt!\",\"hints\":[\"Hoàn thành, có kết quả (looks great) → present perfect simple\"],\"points\":10},{\"id\":181,\"type\":\"multiple-choice\",\"question\":\"They _____ the house. There's paint everywhere! (process)\",\"options\":[\"have been painting\",\"have painted\",\"has been painting\",\"has painted\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous: S + have/has + been + V-ing) được dùng để nhấn mạnh tính liên tục, quá trình hoặc khoảng thời gian hành động diễn ra.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu này nhấn mạnh vào quá trình sơn nhà kéo dài, để lại dấu vết là sơn dính ở khắp nơi (paint everywhere). Do đó ta dùng thì hiện tại hoàn thành tiếp diễn là \u003cstrong\u003ehave been painting\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ đang sơn nhà dở dang. Sơn dính khắp mọi nơi!\",\"hints\":[\"Nhấn mạnh quá trình (sơn khắp nơi) → present perfect continuous\"],\"points\":10},{\"id\":182,\"type\":\"multiple-choice\",\"question\":\"He _____ to London twice. (experience)\",\"options\":[\"has been\",\"has been being\",\"has been going\",\"have been\"],\"correctIndex\":0,\"explanation\":\ g\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã uống cà phê cả buổi sáng. Tôi thấy rất tỉnh táo!\",\"hints\":[\"Nhấn mạnh quá trình (cả sáng) → present perfect continuous\"],\"points\":10},{\"id\":187,\"type\":\"multiple-choice\",\"question\":\"He _____ the car. It's clean now. (completed)\",\"options\":[\"has washed\",\"has been washing\",\"have washed\",\"have been washing\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành đơn (Present Perfect Simple: S + have/has + V3/V-ed) được dùng để nhấn mạnh kết quả của hành động đã hoàn thành, hoặc số lượng/số lần của sự việc.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Hành động rửa xe đã kết thúc hoàn toàn và có kết quả sạch sẽ ở hiện tại (It's clean now). Do đó ta dùng thì hiện tại hoàn thành đơn là \u003cstrong\u003ehas washed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy đã rửa xe xong. Bây giờ nó sạch sẽ rồi.\",\"hints\":[\"Hoàn thành (xe sạch rồi) → present perfect simple\"],\"points\":10},{\"id\":188,\"type\":\"multiple-choice\",\"question\":\"He _____ the car. He's all wet! (process)\",\"options\":[\"has been washing\",\"has washed\",\"have been washing\",\"have washed\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous: S + have/has + been + V-ing) được dùng để nhấn mạnh tính liên tục, quá trình hoặc khoảng thời gian hành động diễn ra.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Nhấn mạnh quá trình rửa xe kéo dài, dẫn đến kết quả là người anh ấy bị ướt sũng (He's all wet!). Do đó ta dùng thì hiện tại hoàn thành tiếp diễn là \u003cstrong\u003ehas been washing\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy đã và đang rửa xe. Người anh ấy ướt sũng!\",\"hints\":[\"Nhấn mạnh quá trình (anh ấy ướt) → present perfect continuous\"],\"points\":10},{\"id\":189,\"type\":\"multiple-choice\",\"question\":\"She _____ four countries so far. (quantity)\",\"options\":[\"has visited\",\"has been visiting\",\"have visited\",\"have been visiting\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành đơn (Present Perfect Simple: S + have/has + V3/V-ed) được dùng để nhấn mạnh kết quả của hành động đã hoàn thành, hoặc số lượng/số lần của sự việc.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu này nhấn mạnh số lượng quốc gia đã ghé thăm tính đến thời điểm hiện tại (four countries - 4 nước). Do đó ta dùng thì hiện tại hoàn thành đơn là \u003cstrong\u003ehas visited\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cho đến nay cô ấy đã ghé thăm 4 quốc gia.\",\"hints\":[\"Số lượng (4 nước) → present perfect simple\"],\"points\":10},{\"id\":190,\"type\":\"multiple-choice\",\"question\":\"She _____ Europe for a month. (ongoing)\",\"options\":[\"has been visiting\",\"has visited\",\"have been visiting\",\"have visited\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous: S + have/has + been + V-ing) được dùng để nhấn mạnh tính liên tục, quá trình hoặc khoảng thời gian hành động diễn ra.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Hành động đi du lịch châu Âu kéo dài liên tục suốt 1 tháng qua (for a month) và vẫn đang tiếp tục diễn ra, do đó ta dùng thì hiện tại hoàn thành tiếp diễn là \u003cstrong\u003ehas been visiting\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đã đi du lịch châu Âu suốt 1 tháng qua.\",\"hints\":[\"Đang diễn ra (1 tháng) → present perfect continuous\"],\"points\":10},{\"id\":191,\"type\":\"fill-blank-mixed\",\"template\":\"I _1_ (wait) for you _2_ two hours!\",\"blanks\":[{\"blankId\":1,\"hint\":\"(wait)\",\"answer\":\"have been waiting\",\"acceptedAnswers\
