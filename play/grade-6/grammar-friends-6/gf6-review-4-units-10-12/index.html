03eStatements:\u003c/strong\u003e She said (that) + S + V (lùi thì)\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: \"I like cats.\" → She said she liked cats.\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eQuestions:\u003c/strong\u003e He asked + question word + S + V (lùi thì, không đảo ngữ)\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: \"Where do you live?\" → He asked where I lived.\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCommands:\u003c/strong\u003e She told + person + to + V\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: \"Be quiet.\" → She told us to be quiet.\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eRequests:\u003c/strong\u003e He asked + person + to + V\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: \"Can you help me?\" → He asked me to help him.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2. Reflexive Pronouns (Đại từ phản thân)\u003c/h3\u003e\r\n          \u003cp\u003emyself, yourself, himself, herself, itself, ourselves, yourselves, themselves\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: I did it \u003cstrong\u003emyself\u003c/strong\u003e. / They enjoyed \u003cstrong\u003ethemselves\u003c/strong\u003e.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3. Wish (Câu ước)\u003c/h3\u003e\r\n          \u003cp\u003eS + wish(es) + S + V (past simple / could + V)\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: I wish I \u003cstrong\u003ecould swim\u003c/strong\u003e. / She wishes she \u003cstrong\u003ehad\u003c/strong\u003e more time.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4. Question Tags (Câu hỏi đuôi)\u003c/h3\u003e\r\n          \u003cp\u003eCâu khẳng định → tag phủ định, và ngược lại.\u003c/p\u003e\r\n          \u003cp\u003eVí dụ: You're tired, \u003cstrong\u003earen't you\u003c/strong\u003e? / He can't swim, \u003cstrong\u003ecan he\u003c/strong\u003e?\u003c/p\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-review-4-units-10-12\",\"title\":\"Review 4: Units 10-12\",\"grammarTopics\":[\"Reported speech (statements)\",\"Reported speech (questions)\",\"Reported speech (commands/requests)\",\"Reflexive pronouns\",\"Wish\",\"Question tags\"],\"theory\":{\"brief\":\"Ôn tập: Câu tường thuật (câu trần thuật, câu hỏi, mệnh lệnh/yêu cầu), đại từ phản thân, câu ước với wish, câu hỏi đuôi.\",\"examples\":[\"She said she wanted to go. (reported statement)\",\"He asked where the shop was. (reported question)\",\"Mum told us to be quiet. (reported command)\",\"I made it myself. (reflexive pronoun)\",\"I wish I could fly. (wish)\",\"You're tired, aren't you? (question tag)\"]},\"exercises\":[{\"id\":1,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported statement.\",\"original\":\"Heidi: \\\"I'm going to become a doctor.\\\"\",\"starterText\":\"Heidi said\",\"answer\":\"Heidi said she was going to become a doctor.\",\"acceptedAnswers\":[\"Heidi said she was going to become a doctor.\",\"Heidi said she was going to become a doctor\"],\"hints\":[\"Change 'I'm going' to 'she was going'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu kể: lùi thì một bậc, đổi đại từ. 'be going to' → 'was/were going to'.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'I'm going to' → \u003cstrong\u003eshe was going to\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Heidi nói rằng cô ấy sẽ trở thành bác sĩ.\"},{\"id\":2,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported statement.\",\"original\":\"Olly: \\\"They haven't chosen Billy for the team.\\\"\",\"starterText\":\"Olly said\",\"answer\":\"Olly said they hadn't chosen Billy for the team.\",\"acceptedAnswers\":[\"Olly said they hadn't chosen Billy for the team.\",\"Olly said they hadn't chosen Billy for the team\",\"Olly said they had not chosen Billy for the team.\",\"Olly said they had not chosen Billy for the team\"],\"hints\":[\"Change 'haven't chosen' to 'hadn't chosen'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật: hiện tại hoàn thành → quá khứ hoàn thành (\u003cstrong\u003ehad + V3\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'haven't chosen' → \u003cstrong\u003ehadn't chosen\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Olly nói rằng họ chưa chọn Billy vào đội.\"},{\"id\":3,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported statement.\",\"original\":\"Anna: \\\"I really like watching cartoons.\\\"\",\"starterText\":\"Anna said\",\"answer\":\"Anna said she really liked watching cartoons.\",\"acceptedAnswers\":[\"Anna said she really liked watching cartoons.\",\"Anna said she really liked watching cartoons\"],\"hints\":[\"Change 'like' to 'liked'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật: hiện tại đơn → quá khứ đơn; đổi đại từ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'I really like' → \u003cstrong\u003eshe really liked\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anna nói rằng cô ấy rất thích xem phim hoạt hình.\"},{\"id\":4,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported statement.\",\"original\":\"Charlie: \\\"I've forgotten my homework.\\\"\",\"starterText\":\"Charlie said\",\"answer\":\"Charlie said he had forgotten his homework.\",\"acceptedAnswers\":[\"Charlie said he had forgotten his homework.\",\"Charlie said he had forgotten his homework\"],\"hints\":[\"Change 'I've forgotten' to 'he had forgotten', 'my' to 'his'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật: hiện tại hoàn thành → quá khứ hoàn thành (\u003cstrong\u003ehad + V3\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'I've forgotten' → \u003cstrong\u003ehe had forgotten\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Charlie nói rằng cậu ấy đã quên bài tập về nhà.\"},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"I made this model all by ___.\",\"answer\":\"myself\",\"acceptedAnswers\":[\"myself\"],\"hints\":[\"Reflexive pronoun for 'I'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Đại từ phản thân nhấn mạnh chủ ngữ tự làm: 'by + myself/yourself...'.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'I' → \u003cstrong\u003emyself\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã tự mình làm mô hình này.\"},{\"id\":6,\"type\":\"fill-blank\",\"question\":\"Mum says we can go to the park by ___.\",\"answer\":\"ourselves\",\"acceptedAnswers\":[\"ourselves\"],\"hints\":[\"Reflexive pronoun for 'we'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e 'by + đại từ phản thân' = tự làm một mình.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'we' → \u003cstrong\u003eourselves\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mẹ nói chúng tôi có thể tự đi công viên một mình.\"},{\"id\":7,\"type\":\"fill-blank\",\"question\":\"Henry, when you fell, did you hurt ___?\",\"answer\":\"yourself\",\"acceptedAnswers\":[\"yourself\"],\"hints\":[\"Reflexive pronoun for 'you' (singular)\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi chủ ngữ và tân ngữ là cùng một người, tân ngữ dùng đại từ phản thân.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'you' → \u003cstrong\u003eyourself\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Henry, lúc ngã con có bị đau không?\"},{\"id\":8,\"type\":\"fill-blank\",\"question\":\"I think the printer is broken. It switches ___ off all the time.\",\"answer\":\"itself\",\"acceptedAnswers\":[\"itself\"],\"hints\":[\"Reflexive pronoun for 'it'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Đại từ phản thân cho vật số ít là \u003cstrong\u003eitself\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'It' (the printer) → \u003cstrong\u003eitself\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi nghĩ máy in hỏng rồi. Nó cứ tự tắt suốt.\"},{\"id\":9,\"type\":\"fill-blank\",\"question\":\"Bob and Clare chose this present ___.\",\"answer\":\"themselves\",\"acceptedAnswers\":[\"themselves\"],\"hints\":[\"Reflexive pronoun for 'they'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Đại từ phản thân nhấn mạnh 'tự làm': chủ ngữ số nhiều → themselves.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Bob and Clare' → \u003cstrong\u003ethemselves\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bob và Clare đã tự chọn món quà này.\"},{\"id\":10,\"type\":\"fill-blank\",\"question\":\"Poppy cooked this meal ___.\",\"answer\":\"herself\",\"acceptedAnswers\":[\"herself\"],\"hints\":[\"Reflexive pronoun for 'she'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Đại từ phản thân nhấn mạnh 'tự làm': chủ ngữ nữ số ít → herself.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Poppy' → \u003cstrong\u003eherself\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Poppy đã tự mình nấu bữa ăn này.\"},{\"id\":11,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported question using 'asked' and a question word.\",\"original\":\"Katie asked Linda: \\\"Who can make the best cake?\\\"\",\"starterText\":\"Katie asked Linda\",\"answer\":\"Katie asked Linda who could make the best cake.\",\"acceptedAnswers\":[\"Katie asked Linda who could make the best cake.\",\"Katie asked Linda who could make the best cake\"],\"hints\":[\"Change 'can' to 'could'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi có từ hỏi: \u003cstrong\u003easked + (O) + từ hỏi + S + V (lùi thì)\u003c/strong\u003e, không đảo trợ động từ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'can' → \u003cstrong\u003ecould\u003c/strong\u003e: ...who could make...\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Katie hỏi Linda ai có thể làm bánh ngon nhất.\"},{\"id\":12,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported question using 'asked' and a question word.\",\"original\":\"Dad asked George: \\\"Where does Oscar live?\\\"\",\"starterText\":\"Dad asked George\",\"answer\":\"Dad asked George where Oscar lived.\",\"acceptedAnswers\":[\"Dad asked George where Oscar lived.\",\"Dad asked George where Oscar lived\"],\"hints\":[\"Remove 'does', change 'live' to 'lived'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi Wh-: trật tự trần thuật, bỏ 'does', lùi thì.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'does Oscar live' → \u003cstrong\u003eOscar lived\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bố hỏi George Oscar sống ở đâu.\"},{\"id\":13,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported question using 'asked' and a question word.\",\"original\":\"The teacher asked Amy and Katie: \\\"Why are you late?\\\"\",\"starterText\":\"The teacher asked Amy and Katie\",\"answer\":\"The teacher asked Amy and Katie why they were late.\",\"acceptedAnswers\":[\"The teacher asked Amy and Katie why they were late.\",\"The teacher asked Amy and Katie why they were late\"],\"hints\":[\"Change 'are you' to 'they were'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi Wh-: trật tự S + V, lùi thì, đổi đại từ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'are you' → \u003cstrong\u003ethey were\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô giáo hỏi Amy và Katie tại sao họ đến muộn.\"},{\"id\":14,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported question using 'asked' and a question word.\",\"original\":\"Mum asked Julia: \\\"Which book did you read?\\\"\",\"starterText\":\"Mum asked Julia\",\"answer\":\"Mum asked Julia which book she had read.\",\"acceptedAnswers\":[\"Mum asked Julia which book she had read.\",\"Mum asked Julia which book she had read\"],\"hints\":[\"Change 'did you read' to 'she had read'\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật câu hỏi Wh-: bỏ 'did', lùi về quá khứ hoàn thành.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'did you read' → \u003cstrong\u003eshe had read\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mẹ hỏi Julia cô bé đã đọc cuốn sách nào.\"},{\"id\":15,\"type\":\"sentence-rewrite\",\"instruction\":\"Write the reported command using 'told'.\",\"original\":\"Mum told us: \\\"Don't play outside for long.\\\"\",\"starterText\":\"Mum told us\",\"answer\":\"Mum told us not to play outside for long.\",\"acceptedAnswers\":[\"Mum told us not to play outside for long.\",\"Mum told us not to play outside for long\"],\"hints\":[\"Negative command: told + person + not to + verb\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Tường thuật mệnh lệnh phủ định: \u003cstrong\u003etold + O + not to + V\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e 'Don't play' → \u003cstrong\u003enot to play\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e ht\"],\"hints\":[\"Past simple → past perfect\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Thì quá khứ đơn (bought) → quá khứ hoàn thành (had bought).\u003cbr\u003e• 'I' → 'he'.\",\"points\":10},{\"id\":39,\"type\":\"fill-blank\",\"question\":\"She said: \\\"I was sleeping.\\\" → She said she ___ sleeping.\",\"answer\":\"had been\",\"acceptedAnswers\":[\"had been\"],\"hints\":[\"Past continuous → past perfect continuous\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Thì quá khứ tiếp diễn (was sleeping) → quá khứ hoàn thành tiếp diễn (had been sleeping).\u003cbr\u003e• 'was' → 'had been'.\",\"points\":10},{\"id\":40,\"type\":\"fill-blank\",\"question\":\"Tom told me: \\\"Come here.\\\" → Tom told me ___ there.\",\"answer\":\"to come\",\"acceptedAnswers\":[\"to come\",\"to go\"],\"hints\":[\"Command: told + person + to + verb\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu mệnh lệnh tường thuật dùng: told + tân ngữ + to + V.\u003cbr\u003e• 'here' có thể chuyển thành 'there' khi thay đổi ngữ cảnh.\",\"points\":10},{\"id\":41,\"type\":\"fill-blank\",\"question\":\"The doctor told him: \\\"Don't eat too much sugar.\\\" → The doctor told him ___ too much sugar.\",\"answer\":\"not to eat\",\"acceptedAnswers\":[\"not to eat\"],\"hints\":[\"Negative command: told + not to + verb\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu mệnh lệnh phủ định: told + tân ngữ + not to + V.\u003cbr\u003e• 'Don't eat' → 'not to eat'.\",\"points\":10},{\"id\":42,\"type\":\"fill-blank\",\"question\":\"Dad cut ___ while he was cooking dinner.\",\"answer\":\"himself\",\"acceptedAnswers\":[\"himself\"],\"hints\":[\"Reflexive pronoun for 'Dad' (he)\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Đại từ phản thân 'himself' dùng khi chủ ngữ và tân ngữ cùng là một người (Dad = he).\u003cbr\u003e• himself = t 003e• Sarah nhìn chính mình trong gương.\",\"points\":10},{\"id\":48,\"type\":\"fill-blank\",\"question\":\"I wish I ___ taller. (be)\",\"answer\":\"were\",\"acceptedAnswers\":[\"were\",\"was\"],\"hints\":[\"Use past tense of 'be' after 'wish'\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Sau 'wish' dùng thì quá khứ đơn để diễn tả điều ước không có thật ở hiện tại.\u003cbr\u003e• 'were' được ưu tiên dùng cho tất cả các ngôi (I wish I were...).\",\"points\":10},{\"id\":49,\"type\":\"fill-blank\",\"question\":\"She wishes she ___ a pet. (have)\",\"answer\":\"had\",\"acceptedAnswers\":[\"had\"],\"hints\":[\"Use past simple after 'wish'\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'wish' + quá khứ đơn: diễn tả mong muốn trái với thực tế hiện tại.\u003cbr\u003e• Cô ấy ước có một con thú cưng (nhưng thực tế không có).\",\"points\":10},{\"id\":50,\"type\":\"fill-blank\",\"question\":\"I wish I ___ speak Japanese. (can)\",\"answer\":\"could\",\"acceptedAnswers\":[\"could\"],\"hints\":[\"'can' → 'could' after 'wish'\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'can' → 'could' sau 'wish' vì phải lùi thì.\u003cbr\u003e• Tôi ước tôi nói được tiếng Nhật (nhưng thực tế không nói được).\",\"points\":10},{\"id\":51,\"type\":\"fill-blank\",\"question\":\"Tom wishes he ___ so much homework. (not have)\",\"answer\":\"didn't have\",\"acceptedAnswers\":[\"didn't have\",\"did not have\"],\"hints\":[\"Negative wish: didn't + verb\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu ước phủ định: wish + didn't + V nguyên mẫu.\u003cbr\u003e• Tom ước không có nhiều bài tập (nhưng thực tế có nhiều).\",\"points\":10},{\"id\":52,\"type\":\"fill-blank\",\"question\":\"We wish it ___ raining. (not be)\",\"answer\":\"weren't\",\"acceptedAnswers\":[\"weren't\",\"wasn't\",\"were not\",\"was not\"],\"hints\":[\"Wish + past tense negative of 'be'\"] resent → past\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu hỏi tường thuật có từ hỏi 'what time' + trật tự câu khẳng định.\u003cbr\u003e• 'leave' → 'left' (lùi thì).\",\"points\":10},{\"id\":58,\"type\":\"fill-blank\",\"question\":\"She told me ___ open the window.\",\"answer\":\"to\",\"acceptedAnswers\":[\"to\"],\"hints\":[\"Reported command: told + person + to + verb\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu mệnh lệnh tường thuật: told + tân ngữ + to + V.\u003cbr\u003e• Cô ấy bảo tôi mở cửa sổ.\",\"points\":10},{\"id\":59,\"type\":\"fill-blank\",\"question\":\"The teacher asked us ___ talk in the exam.\",\"answer\":\"not to\",\"acceptedAnswers\":[\"not to\"],\"hints\":[\"Negative reported command/request\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu yêu cầu phủ định: asked + tân ngữ + not to + V.\u003cbr\u003e• Thầy giáo yêu cầu chúng tôi không nói chuyện trong kỳ thi.\",\"points\":10},{\"id\":60,\"type\":\"fill-blank\",\"question\":\"You like chocolate, ___ you?\",\"answer\":\"don't\",\"acceptedAnswers\":[\"don't\",\"do not\"],\"hints\":[\"Positive statement → negative tag\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu khẳng định → câu hỏi đuôi phủ định.\u003cbr\u003e• 'like' (hiện tại đơn) → trợ động từ 'do' → phủ định 'don't'.\",\"points\":10},{\"id\":61,\"type\":\"fill-blank\",\"question\":\"She can swim very well, ___ she?\",\"answer\":\"can't\",\"acceptedAnswers\":[\"can't\",\"cannot\"],\"hints\":[\"Positive 'can' → negative tag\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu khẳng định với 'can' → câu hỏi đuôi 'can't she?'.\u003cbr\u003e• Động từ khuyết thiếu lặp lại trong câu hỏi đuôi.\",\"points\":10},{\"id\":62,\"type\":\"fill-blank\",\"question\":\"They haven't finished yet, ___ they?\",\"answer\":\"have\",\"acceptedAnswers\":[\"have\"],\"h Gesture\":true},{\"id\":102,\"type\":\"multiple-choice\",\"question\":\"There's a lot of traffic, ___ there?\",\"options\":[\"is\",\"isn't\",\"aren't\",\"doesn't\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'There's' (There is) khẳng định → câu hỏi đuôi phủ định 'isn't there?'.\u003cbr\u003e• Chủ ngữ giả 'there' lặp lại trong câu hỏi đuôi.\",\"hints\":[\"There is → isn't there\"],\"points\":10,\"_needsGesture\":true},{\"id\":103,\"type\":\"multiple-choice\",\"question\":\"I am right, ___ I?\",\"options\":[\"am not\",\"aren't\",\"isn't\",\"don't\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'I am' → câu hỏi đuôi đặc biệt: 'aren't I?' (không dùng 'am not I?').\u003cbr\u003e• Đây là ngoại lệ trong câu hỏi đuôi tiếng Anh.\",\"hints\":[\"I am → aren't I (special case)\"],\"points\":10,\"_needsGesture\":true},{\"id\":104,\"type\":\"multiple-choice\",\"question\":\"She had already left, ___ she?\",\"options\":[\"had\",\"hadn't\",\"didn't\",\"wasn't\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu khẳng định (had left) → phủ định (hadn't she?).\u003cbr\u003e• Dùng 'had' vì câu gốc ở thì quá khứ hoàn thành.\",\"hints\":[\"Past perfect positive → hadn't tag\"],\"points\":10,\"_needsGesture\":true},{\"id\":105,\"type\":\"multiple-choice\",\"question\":\"He said, \\\"I don't understand.\\\" → He said he ___ understand.\",\"options\":[\"don't\",\"doesn't\",\"didn't\",\"hadn't\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'don't understand' → 'didn't understand' (lùi thì).\u003cbr\u003e• Phủ định hiện tại đơn → phủ định quá khứ đơn.\",\"hints\":[\"don't → didn't in reported speech\"],\"points\":10,\"_needsGesture\":true},{\"id\":106,\"type\":\"multiple-choice\",\"question\":\"She asked me how old I ___.\",\"options\":[\"am\",\"was\",\"be\",\"were\"],\"correctIndex\":1,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu hỏi tường thuật: 'am' → 'was' (lùi thì).\u003cbr\u003e• Trật tự câu khẳng định: how old + S + V.\",\"hints\":[\"Reported question: am → was\"],\"points\":10,\"_needsGesture\":true},{\"id\":107,\"type\":\"multiple-choice\",\"question\":\"I wish I ___ to the concert last night.\",\"options\":[\"go\",\"went\",\"had gone\",\"have gone\"],\"correctIndex\":2,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• wish + quá khứ hoàn thành (had gone) diễn tả tiếc nuối về quá khứ.\u003cbr\u003e• Tôi ước đã đi xem hòa nhạc tối qua (nhưng không đi).\",\"hints\":[\"wish + past perfect for past regret\"],\"points\":10,\"_needsGesture\":true},{\"id\":108,\"type\":\"multiple-choice\",\"question\":\"The baby can feed ___. It's very clever!\",\"options\":[\"itself\",\"himself\",\"herself\",\"themselves\"],\"correctIndex\":0,\"gesture\":true,\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• 'The baby' → dùng 'itself' khi không xác định giới tính hoặc dùng 'it' cho em bé.\u003cbr\u003e• Em bé có thể tự ăn. Bé thông minh lắm!\",\"hints\":[\"baby (it) → itself\"],\"points\":10,\"_needsGesture\":true},{\"id\":109,\"type\":\"sentence-build\",\"prompt\":\"she / have / a lovely voice\",\"instructions\":\"Write a sentence with a question tag.\",\"answer\":\"She has a lovely voice, hasn't she?\",\"acceptedAnswers\":[\"She has a lovely voice, hasn't she?\",\"She has a lovely voice, hasn't she\",\"She's got a lovely voice, hasn't she?\"],\"hints\":[\"Positive 'has' → negative tag 'hasn't'\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu khẳng định (has) → câu hỏi đuôi phủ định (hasn't she?).\u003cbr\u003e• 'has' là động từ chính nên dùng 'hasn't' trong phần đuôi.\",\"points\":10},{\"id\":110,\" orse, can she?\",\"acceptedAnswers\":[\"Lucy can't ride a horse, can she?\",\"Lucy can't ride a horse, can she\",\"Lucy cannot ride a horse, can she?\"],\"hints\":[\"Negative 'can't' → positive 'can' tag\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu phủ định (can't) → câu hỏi đuôi khẳng định (can she?).\u003cbr\u003e• 'Lucy' = she.\",\"points\":10},{\"id\":114,\"type\":\"sentence-build\",\"prompt\":\"your parents / have been / to Italy\",\"instructions\":\"Write a sentence with a question tag.\",\"answer\":\"Your parents have been to Italy, haven't they?\",\"acceptedAnswers\":[\"Your parents have been to Italy, haven't they?\",\"Your parents have been to Italy, haven't they\"],\"hints\":[\"have been → haven't they\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu khẳng định (have been) → phủ định (haven't they?).\u003cbr\u003e• 'Your parents' = they.\",\"points\":10},{\"id\":115,\"type\":\"sentence-build\",\"prompt\":\"Mark / will / pass / the exam\",\"instructions\":\"Write a sentence with a question tag.\",\"answer\":\"Mark will pass the exam, won't he?\",\"acceptedAnswers\":[\"Mark will pass the exam, won't he?\",\"Mark will pass the exam, won't he\"],\"hints\":[\"Positive 'will' → negative 'won't' tag\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\u003e\u003cbr\u003e• Câu khẳng định (will) → phủ định (won't he?).\u003cbr\u003e• 'Mark' = he.\",\"points\":10},{\"id\":116,\"type\":\"sentence-build\",\"prompt\":\"they / not have / finished / their homework\",\"instructions\":\"Write a sentence with a question tag.\",\"answer\":\"They haven't finished their homework, have they?\",\"acceptedAnswers\":[\"They haven't finished their homework, have they?\",\"They haven't finished their homework, have they\",\"They have not finished their homework, have they?\"],\"hints\":[\"Negative haven't → positive have tag\"],\"explanation\":\"\u003cstrong\u003eGiải thích:\u003c/strong\
