\u003e1 Thì Hiện Tại Hoàn Thành (Present Perfect) — Cấu Trúc\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCông thức:\u003c/strong\u003e S + \u003cstrong\u003ehave/has\u003c/strong\u003e + \u003cstrong\u003epast participle (V3)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Quy tắc chia:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eI / You / We / They\u003c/strong\u003e → \u003cstrong\u003ehave\u003c/strong\u003e + V3\u003cbr\u003e\r\n            \u003cstrong\u003eHe / She / It\u003c/strong\u003e → \u003cstrong\u003ehas\u003c/strong\u003e + V3\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eKhẳng định:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003ehave visited\u003c/strong\u003e Paris. (Tôi đã thăm Paris.)\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003ehas finished\u003c/strong\u003e her homework. (Cô ấy đã hoàn thành bài tập.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePhủ định:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003ehaven't seen\u003c/strong\u003e that film. (Tôi chưa xem phim đó.)\u003cbr\u003e\r\n            ✓ He \u003cstrong\u003ehasn't arrived\u003c/strong\u003e yet. (Anh ấy chưa đến.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eCâu hỏi:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eHave\u003c/strong\u003e you \u003cstrong\u003eeaten\u003c/strong\u003e lunch? (Bạn đã ăn trưa chưa?)\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eHas\u003c/strong\u003e she \u003cstrong\u003ecalled\u003c/strong\u003e you? (Cô ấy đã gọi cho bạn chưa?)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Since vs For --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 SINCE vs FOR — Mốc Thời Gian vs Khoảng Thời Gian \u003c/h3\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eSINCE + mốc thời gian (point in time):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I've lived here \u003cstrong\u003esince 2015\u003c/strong\u003e. (Tôi đã sống ở đây từ năm 2015.)\u003cbr\u003e\r\n            ✓ She's been ill \u003cstrong\u003esince Monday\u003c/strong\u003e. (Cô ấy bị ốm từ thứ Hai.)\u003cbr\u003e\r\n            ✓ We've known each other \u003cstrong\u003esince childhood\u003c/strong\u003e. (Chúng tôi biết nhau từ nhỏ.)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eFOR + khoảng thời gian (period of time):\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I've lived here \u003cstrong\u003efor ten years\u003c/strong\u003e. (Tôi đã sống ở đây được mười năm.)\u003cbr\u003e\r\n            ✓ She's been ill \u003cstrong\u003efor three days\u003c/strong\u003e. (Cô ấy bị ốm được ba ngày.)\u003cbr\u003e\r\n            ✓ We've been friends \u003cstrong\u003efor a long time\u003c/strong\u003e. (Chúng tôi là bạn đã lâu.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eSINCE\u003c/strong\u003e = \u003cstrong\u003eS\u003c/strong\u003etarting point (điểm bắt đầu): since 2020, since January, since last week\u003cbr\u003e\r\n            \u003cstrong\u003eFOR\u003c/strong\u003e = \u003cstrong\u003eF\u003c/strong\u003eor how long (bao lâu): for 5 years, for 2 hours, for ages\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi thường gặp:\u003c/strong\u003e\u003cbr\u003e\r\n            I've lived here \u003cstrong\u003esince\u003c/strong\u003e three years.\u003cbr\u003e\r\n            I've lived here \u003cstrong\u003efor\u003c/strong\u003e three years.\u003cbr\u003e\u003cbr\u003e\r\n            I've lived here \u003cstrong\u003efor\u003c/strong\u003e 2015.\u003cbr\u003e\r\n            I've lived here \u003cstrong\u003esince\u003c/strong\u003e 2015.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Already \u0026 Just --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 ALREADY \u0026 JUST — Đã Rồi \u0026 Vừa Mới \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eVị trí:\u003c/strong\u003e Đặt \u003cstrong\u003etrước động từ chính\u003c/strong\u003e (giữa have/has và V3)\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eALREADY\u003c/strong\u003e = đã ... rồi (sớm hơn mong đợi):\u003cbr\u003e\r\n            ✓ I've \u003cstrong\u003ealready\u003c/strong\u003e eaten. (Tôi đã ăn rồi.)\u003cbr\u003e\r\n            ✓ She's \u003cstrong\u003ealready\u003c/strong\u003e left. (Cô ấy đã đi rồi.)\u003cbr\u003e\r\n            ✓ They've \u003cstrong\u003ealready\u003c/strong\u003e finished the project. (Họ đã hoàn thành dự án rồi.)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eJUST\u003c/strong\u003e = vừa mới (xảy ra rất gần đây):\u003cbr\u003e\r\n            ✓ I've \u003cstrong\u003ejust\u003c/strong\u003e arrived. (Tôi vừa mới đến.)\u003cbr\u003e\r\n            ✓ He's \u003cstrong\u003ejust\u003c/strong\u003e called me. (Anh ấy vừa gọi cho tôi.)\u003cbr\u003e\r\n            ✓ We've \u003cstrong\u003ejust\u003c/strong\u003e heard the news. (Chúng tôi vừa nghe tin.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #d4edda; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Cấu trúc:\u003c/strong\u003e S + have/has + \u003cstrong\u003ealready/just\u003c/strong\u003e + V3\u003cbr\u003e\r\n            ✓ She has \u003cstrong\u003ealready\u003c/strong\u003e done it. \u0026nbsp;\u0026nbsp;|\u0026nbsp;\u0026nbsp; ✓ He has \u003cstrong\u003ejust\u003c/strong\u003e gone out.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Yet \u0026 Before --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 YET \u0026 BEFORE — Chưa \u0026 Trước Đây \u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eVị trí:\u003c/strong\u003e Đặt ở \u003cstrong\u003ecuối câu\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eYET\u003c/strong\u003e = chưa (dùng trong câu hỏi và phủ định):\u003cbr\u003e\r\n            ✓ Have you finished \u003cstrong\u003eyet\u003c/strong\u003e? (Bạn đã hoàn thành chưa?)\u003cbr\u003e\r\n            ✓ I haven't done it \u003cstrong\u003eyet\u003c/strong\u003e. (Tôi chưa làm xong.)\u003cbr\u003e\r\n            ✓ Has the film started \u003cstrong\u003eyet\u003c/strong\u003e? (Phim đã bắt đầu chưa?)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eBEFORE\u003c/strong\u003e = trước đây (bất kỳ lúc nào trong quá khứ):\u003cbr\u003e\r\n            ✓ I've never been to Japan \u003cstrong\u003ebefore\u003c/strong\u003e. (Tôi chưa bao giờ đến Nhật trước đây.)\u003cbr\u003e\r\n            ✓ Have you met him \u003cstrong\u003ebefore\u003c/strong\u003e? (Bạn đã gặp anh ấy trước đây chưa?)\u003cbr\u003e\r\n            ✓ She's seen this film \u003cstrong\u003ebefore\u003c/strong\u003e. (Cô ấy đã xem phim này trước đây.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lưu ý:\u003c/strong\u003e\u003cbr\u003e\r\n            I haven't \u003cstrong\u003ealready\u003c/strong\u003e done it. (SAI — already dùng trong khẳng định)\u003cbr\u003e\r\n            I haven't done it \u003cstrong\u003eyet\u003c/strong\u003e. (ĐÚNG — yet dùng trong phủ định)\u003cbr\u003e\u003cbr\u003e\r\n            Have you \u003cstrong\u003ealready\u003c/strong\u003e finished? (Không sai nhưng ít phổ biến)\u003cbr\u003e\r\n            Have you finished \u003cstrong\u003eyet\u003c/strong\u003e? (Tự nhiên hơn)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: Past Simple vs Present Perfect --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Past Simple vs Present Perfect — Quá Khứ Đơn vs Hiện Tại Hoàn Thành \u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e So sánh nhanh:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003ePast Simple (Quá khứ đơn):\u003c/strong\u003e\u003cbr\u003e\r\n            → Hành động đã kết thúc trong quá khứ, có thời gian xác định\u003cbr\u003e\r\n            → Dấu hiệu: \u003cstrong\u003eyesterday, last week, ago, in 2020\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I \u003cstrong\u003ebought\u003c/strong\u003e shoes \u003cstrong\u003eyesterday\u003c/strong\u003e. (Tôi đã mua giày hôm qua.)\u003cbr\u003e\r\n            ✓ She \u003cstrong\u003ewent\u003c/strong\u003e to London \u003cstrong\u003elast year\u003c/strong\u003e. (Cô ấy đã đi London năm ngoái.)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003ePresent Perfect (Hiện tại hoàn thành):\u003c/strong\u003e\u003cbr\u003e\r\n            → Hành động trong quá khứ nhưng còn liên quan đến hiện tại\u003cbr\u003e\r\n            → Dấu hiệu: \u003cstrong\u003esince, for, already, just, yet, ever, never, before\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ I've \u003cstrong\u003eborrowed\u003c/strong\u003e your pen. (Tôi đã mượn bút của bạn — vẫn đang giữ.)\u003cbr\u003e\r\n            ✓ She's \u003cstrong\u003evisited\u003c/strong\u003e London three times. (Cô ấy đã thăm London ba lần — cho đến nay.)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo phân biệt:\u003c/strong\u003e\u003cbr\u003e\r\n            Có \u003cstrong\u003eyesterday, ago, last\u003c/strong\u003e → dùng \u003cstrong\u003ePast Simple\u003c/strong\u003e\u003cbr\u003e\r\n            Có \u003cstrong\u003esince, for, already, just, yet, ever, never\u003c/strong\u003e → dùng \u003cstrong\u003ePresent Perfect\u003c/strong\u003e\u003cbr\u003e\r\n            Không có thời gian cụ thể + còn liên quan hiện tại → \u003cstrong\u003ePresent Perfect\u003c/strong\u003e\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Common Mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Lỗi Thường Gặp \u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi 1: Nhầm since và for\u003c/strong\u003e\u003cbr\u003e\r\n            I've known her \u003cstrong\u003esince\u003c/strong\u003e five years.\u003cbr\u003e\r\n            I've known her \u003cstrong\u003efor\u003c/strong\u003e five years.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 2: Dùng past simple với since/for\u003c/strong\u003e\u003cbr\u003e\r\n            I \u003cstrong\u003elived\u003c/strong\u003e here since 2010.\u003cbr\u003e\r\n            I \u003cstrong\u003ehave lived\u003c/strong\u003e here since 2010.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 3: Sai vị trí already/just/yet\u003c/strong\u003e\u003cbr\u003e\r\n            I have finished \u003cstrong\u003ealready\u003c/strong\u003e my homework.\u003cbr\u003e\r\n            I have \u003cstrong\u003ealready\u003c/strong\u003e finished my homework.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 4: Dùng yet trong câu khẳng định\u003c/strong\u003e\u003cbr\u003e\r\n            I have finished yet.\u003cbr\u003e\r\n            I have \u003cstrong\u003ealready\u003c/strong\u003e finished. / I haven't finished \u003cstrong\u003eyet\u003c/strong\u003e.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 5: Sai past participle\u003c/strong\u003e\u003cbr\u003e\r\n            I have \u003cstrong\u003egoed\u003c/strong\u003e to school.\u003cbr\u003e\r\n            I have \u003cstrong\u003egone\u003c/strong\u003e to school.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-3-a-celebration\",\"title\":\"Unit 3: A Celebration - Present Perfect\",\"grammarTopics\":[\"Present perfect with since and for\",\"Already, just, yet and before\",\"Past simple vs present perfect\"],\"theory\":{\"brief\":\"Thì hiện tại hoàn thành dùng với since (mốc thời gian), for (khoảng thời gian), already/just (trước động từ chính), yet/before (cuối câu). Phân biệt: quá khứ đơn cho hành động đã kết thúc trong quá khứ, hiện tại hoàn thành cho hành động còn liên quan đến hiện tại.\",\"examples\":[\"I've been at this school for two years.\",\"I've been at this school since 2008.\",\"They've already finished their lunch.\",\"I've just seen him.\",\"Have you tried any of the food yet?\",\"I've never been to an art gallery before.\",\"I bought some new shoes at the market. (past simple - finished action)\",\"I've borrowed your pen. (present perfect - still important now)\"]},\"exercises\":[{\"id\":1,\"type\":\"multiple-choice\",\"question\":\"'Since 1st October 2010' (it is now 15th October 2010) is the same as:\",\"options\":[\"for four months\",\"for two weeks\",\"for six days\",\"for one day\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng giới từ \u003cstrong\u003efor\u003c/strong\u003e trước một khoảng thời gian (như số ngày, số tháng, số năm) để chỉ độ dài của hành động kéo dài đến hiện tại trong thì hiện tại hoàn thành.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ ngày 1 tháng 10 đến ngày 15 tháng 10 là mười bốn ngày, tương đương với khoảng thời gian hai tuần (\u003cstrong\u003efor two weeks\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e 'Kể từ ngày 1 tháng 10 năm 2010' (bây giờ là ngày 15 tháng 10 năm 2010) tương đương với: 'trong hai tuần'.\",\"points\":10},{\"id\":2,\"type\":\"multiple-choice\",\"question\":\"'Since June 2010' (it is now October 2010) is the same as:\",\"options\":[\"for two weeks\",\"for a few hours\",\"for four months\",\"for six days\"],\"correctIndex\":2,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng giới từ \u003cstrong\u003efor\u003c/strong\u003e trước một khoảng thời gian (như số ngày, số tháng, số năm) để chỉ độ dài của hành động kéo dài đến hiện tại trong thì hiện tại hoàn thành.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ tháng 6 đến tháng 10 là bốn tháng, tương đương với khoảng thời gian bốn tháng (\u003cstrong\u003efor four months\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e 'Kể từ tháng 6 năm 2010' (bây giờ là tháng 10 năm 2010) tương đương với: 'trong bốn tháng'.\",\"points\":10},{\"id\":3,\"type\":\"multiple-choice\",\"question\":\"'For half an hour' (it is now 3 p.m.) means the same as:\",\"options\":[\"since 2.30 p.m.\",\"since 3.30 p.m.\",\"since 2 p.m.\",\"since this morning\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng giới từ \u003cstrong\u003esince\u003c/strong\u003e trước một mốc thời gian cụ thể (như một mốc năm, tháng, hoặc một sự kiện đã xảy ra) để chỉ thời điểm hành động bắt đầu trong thì hiện tại hoàn thành.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Khoảng thời gian nửa tiếng trước thời điểm 3 giờ chiều là 2 giờ 30 phút chiều (\u003cstrong\u003esince 2.30 p.m.\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e 'Trong nửa tiếng' (bây giờ là 3 giờ chiều) có cùng nghĩa với: 'từ lúc 2 giờ 30 phút chiều'.\",\"points\":10},{\"id\":4,\"type\":\"multiple-choice\",\"question\":\"'For three years' (it is now 2010) means the same as:\",\"options\":[\"since 2008\",\"since 2007\",\"since 2009\",\"since 2006\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng giới từ \u003cstrong\u003esince\u003c/strong\u003e trước một mốc thời gian cụ thể (như một mốc năm, tháng, hoặc một sự kiện đã xảy ra) để chỉ thời điểm hành động bắt đầu trong thì hiện tại hoàn thành.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Lấy năm hiện tại là 2010 trừ đi ba năm sẽ ra năm bắt đầu là 2007 (\u003cstrong\u003esince 2007\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e 'Trong ba năm' (bây giờ là năm 2010) có cùng nghĩa với: 'từ năm 2007'.\",\"points\":10},{\"id\":5,\"type\":\"sentence-build\",\"prompt\":\"yet / Katie's party / not start\",\"instructions\":\"Write the words in the correct order using the present perfect.\",\"answer\":\"Katie's party hasn't started yet.\",\"acceptedAnswers\":[\"Katie's party hasn't started yet.\",\"Katie's party hasn't started yet\",\"Katie's party has not started yet.\",\"Katie's party has not started yet\"],\"hints\":[\"Use hasn't + past participle\",\"Put 'yet' at the end\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng từ \u003cstrong\u003eyet\u003c/strong\u003e (chưa) ở cuối câu phủ định hoặc câu hỏi trong thì hiện tại hoàn thành để diễn tả một hành động mong đợi chưa xảy ra hoặc hỏi xem hành động đó đã hoàn thành chưa.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ \u003cstrong\u003eKatie's party\u003c/strong\u003e là danh từ số ít nên dùng trợ động từ \u003cstrong\u003ehasn't\u003c/strong\u003e. Động từ \u003cstrong\u003estart\u003c/strong\u003e thêm đuôi -ed thành \u003cstrong\u003estarted\u003c/strong\u003e, và từ \u003cstrong\u003eyet\u003c/strong\u003e đặt ở cuối câu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bữa tiệc của Katie vẫn chưa bắt đầu.\"},{\"id\":6,\"type\":\"sentence-build\",\"prompt\":\"already / Suzy / go / to the dentist\",\"instructions\":\"Write the words in the correct order using the present perfect.\",\"answer\":\"Suzy has already gone to the dentist.\",\"acceptedAnswers\":[\"Suzy has already gone to the dentist.\",\"Suzy has already gone to the dentist\",\"Suzy's already gone to the dentist.\",\"Suzy's already gone to the dentist\"],\"hints\":[\"Put 'already' before the past participle\",\"go → gone\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng từ \u003cstrong\u003ealready\u003c/strong\u003e (đã... rồi) trong câu khẳng định của thì hiện tại hoàn thành để diễn tả một hành động đã hoàn tất sớm hơn mong đợi. Vị trí của \u003cstrong\u003ealready\u003c/strong\u003e đứng giữa \u003cstrong\u003ehave/has\u003c/strong\u003e và quá khứ phân từ (V3).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ \u003cstrong\u003eSuzy\u003c/strong\u003e là số ít nên đi với trợ động từ \u003cstrong\u003ehas\u003c/strong\u003e. Từ \u003cstrong\u003ealready\u003c/strong\u003e đứng sau \u003cstrong\u003ehas\u003c/strong\u003e và trước động từ bất quy tắc \u003cstrong\u003ego\u003c/strong\u003e ở dạng phân từ là \u003cstrong\u003egone\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Suzy đã đi khám nha sĩ rồi.\"},{\"id\":7,\"type\":\"sentence-build\",\"prompt\":\"already / Billy / meet / Ted\",\"instructions\":\"Write the words in the correct order using the present perfect.\",\"answer\":\"Billy has already met Ted.\",\"acceptedAnswers\":[\"Billy has already met Ted.\",\"Billy has already met Ted\",\"Billy's already met Ted.\",\"Billy's already met Ted\"],\"hints\":[\"meet → met\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng từ \u003cstrong\u003ealready\u003c/strong\u003e (đã... rồi) trong câu khẳng định của thì hiện tại hoàn thành để diễn tả một hành động đã hoàn tất sớm hơn mong đợi. Vị trí của \u003cstrong\u003ealready\u003c/strong\u003e đứng giữa \u003cstrong\u003ehave/has\u003c/strong\u003e và quá khứ phân từ (V3).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ \u003cstrong\u003eBilly\u003c/strong\u003e là số ít nên đi với trợ động từ \u003cstrong\u003ehas\u003c/strong\u003e. Động từ bất quy tắc \u003cstrong\u003emeet\u003c/strong\u003e chuyển thành quá khứ phân từ \u003cstrong\u003emet\u003c/strong\u003e. Từ \u003cstrong\u003ealready\u003c/strong\u003e đặt giữa \u003cstrong\u003ehas\u003c/strong\u003e và \u003cstrong\u003emet\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Billy đã gặp Ted rồi.\"},{\"id\":8,\"type\":\"sentence-build\",\"prompt\":\"yet / Clare / not pick up / Lucy\",\"instructions\":\"Write the words in the correct order using the present perfect.\",\"answer\":\"Clare hasn't picked up Lucy yet.\",\"acceptedAnswers\":[\"Clare hasn't picked up Lucy yet.\",\"Clare hasn't picked up Lucy yet\",\"Clare has not picked up Lucy yet.\",\"Clare has not picked up Lucy yet\"],\"hints\":[\"Use hasn't + past participle\",\"Put 'yet' at the end\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng từ \u003cstrong\u003eyet\u003c/strong\u003e (chưa) ở cuối câu phủ định hoặc câu hỏi trong thì hiện tại hoàn thành để diễn tả một hành động mong đợi chưa xảy ra hoặc hỏi xem hành động đó đã hoàn thành chưa.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ \u003cstrong\u003eClare\u003c/strong\u003e là số ít ở thể phủ định nên đi với \u003cstrong\u003ehasn't\u003c/strong\u003e. Cụm động từ \u003cstrong\u003epick up\u003c/strong\u003e chuyển thành quá khứ phân từ \u003cstrong\u003epicked up\u003c/strong\u003e, và từ \u003cstrong\u003eyet\u003c/strong\u003e đứng ở cuối câu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Clare vẫn chưa đến đón Lucy.\"},{\"id\":9,\"type\":\"sentence-build\",\"prompt\":\"before / Mum / take / Lewis to the park\",\"instructions\":\"Write the words in the correct order using the present perfect.\",\"answer\":\"Mum has taken Lewis to the park before.\",\"acceptedAnswers\":[\"Mum has taken Lewis to the park before.\",\"Mum has taken Lewis to the park before\",\"Mum's taken Lewis to the park before.\",\"Mum's taken Lewis to the park before\"],\"hints\":[\"take → taken\",\"Put 'before' at the end\"],\"points\":10,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng từ \u003cstrong\u003ebefore\u003c/strong\u003e (trước đây) ở cuối câu trong thì hiện tại hoàn thành để diễn tả một kinh nghiệm hoặc trải nghiệm tính đến thời điểm hiện tại.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ \u003cstrong\u003eMum\u003c/strong\u003e là số ít nên dùng trợ động từ \u003cstrong\u003ehas\u003c/strong\u003e. Động từ bất quy tắc \u003cstrong\u003etake\u003c/strong\u003e chuyển thành quá khứ phân từ \u003cstrong\u003etaken\u003c/strong\u003e, và từ \u003cstrong\u003ebefore\u003c/strong\u003e đặt ở cuối câu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mẹ đã đưa Lewis đến công viên trước đây rồi.\"},{\"id\":10,\"type\":\"sentence-build\",\"prompt\":\"yet / Penny / not buy / a present for Judy\",\"instructions\":\"Write the words in the correct order using the present perfect.\",\"answer\":\"Penny hasn't bought a present for Judy yet.\",\"acceptedAnswers\":[\"Penny hasn't bought a present for Judy yet.\",\"Penny hasn't bought a present for Judy yet\",\"Penny has not bought a present for Ju ears ago\u003c/strong\u003e chỉ hành động chia ở \u003cstrong\u003equá khứ đơn\u003c/strong\u003e là \u003cstrong\u003ejoined\u003c/strong\u003e. Vì \u003cstrong\u003efor two years now\u003c/strong\u003e nên dùng \u003cstrong\u003ehiện tại hoàn thành\u003c/strong\u003e là \u003cstrong\u003ehas been\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy vào trường này 2 năm trước. Anh ấy đã ở đây 2 năm rồi.\",\"hints\":[\"'ago' = past simple\",\"'for ... now' = present perfect\"],\"points\":15},{\"id\":179,\"type\":\"fill-blank-mixed\",\"template\":\"I _1_ never _2_ anyone famous before.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(auxiliary - present perfect)\",\"answer\":\"have\",\"acceptedAnswers\":[\"have\",\"'ve\"]},{\"blankId\":2,\"hint\":\"(meet - past participle)\",\"answer\":\"met\",\"acceptedAnswers\":[\"met\"]}],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng giới từ \u003cstrong\u003efor\u003c/strong\u003e trước một khoảng thời gian (như số ngày, số tháng, số năm) để chỉ độ dài của hành động kéo dài đến hiện tại trong thì hiện tại hoàn thành.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ \u003cstrong\u003enever ... before\u003c/strong\u003e chỉ hành động chia ở \u003cstrong\u003ehiện tại hoàn thành\u003c/strong\u003e là \u003cstrong\u003ehave never met\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi chưa bao giờ gặp ai nổi tiếng trước đây.\",\"hints\":[\"'never ... before' = present perfect\",\"meet → met\"],\"points\":15},{\"id\":180,\"type\":\"fill-blank-mixed\",\"template\":\"She _1_ already _2_ dinner when I _3_ home.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(auxiliary - past perfect)\",\"answer\":\"had\",\"acceptedAnswers\":[\"had\",\"'d\"]},{\"blankId\":2,\"hint\":\"(cook - past participle)\",\"answer\":\"cooked\",\"acceptedAnswers\":[\"cooked\"]},{\"blankId\":3,\"hint\":\"(get - past simple)\",\"answer\":\"got\",\"acceptedAnswers\":[\"got\"]}],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ hoàn thành để diễn tả một hành động đã xảy ra và hoàn thành trước một hành động khác trong quá khứ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Hành động nấu ăn (\u003cstrong\u003ealready cooked\u003c/strong\u003e) xảy ra và hoàn tất trước hành động về nhà (\u003cstrong\u003egot home\u003c/strong\u003e) trong quá khứ, nên ta chia hành động xảy ra trước ở thì quá khứ hoàn thành (\u003cstrong\u003ehad already cooked\u003c/strong\u003e) và hành động xảy ra sau ở thì quá khứ đơn (\u003cstrong\u003egot\u003c/strong\u003e).\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đã nấu xong bữa tối khi tôi về nhà.\",\"hints\":[\"'already ... when + past simple' = past perfect\",\"'when' = past simple\"],\"points\":15},{\"id\":181,\"type\":\"fill-blank-mixed\",\"template\":\"They _1_ their house in 2010. They _2_ there for over fifteen years.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(buy - past simple)\",\"answer\":\"bought\",\"acceptedAnswers\":[\"bought\"]},{\"blankId\":2,\"hint\":\"(live - present perfect)\",\"answer\":\"have lived\",\"acceptedAnswers\":[\"have lived\",\"'ve lived\"]}],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng giới từ \u003cstrong\u003efor\u003c/strong\u003e trước một khoảng thời gian (như số ngày, số tháng, số năm) để chỉ độ dài của hành động kéo dài đến hiện tại trong thì hiện tại hoàn thành.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ \u003cstrong\u003ein 2010\u003c/strong\u003e chỉ hành động chia ở \u003cstrong\u003equá khứ đơn\u003c/strong\u003e là \u003cstrong\u003ebought\u003c/strong\u003e. Vì \u003cstrong\u003efor over fifteen years\u003c/strong\u003e nên dùng \u003cstrong\u003ehiện tại hoàn thành\u003c/strong\u003e là \u003cstrong\u003ehave lived\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ mua nhà năm 2010. Họ đã sống ở đó hơn 15 năm.\",\"hints\":[\"'in 2010' = past simple\",\"'for' = present perfect\"],\"points\":15},{\"id\":182,\"type\":\"fill-blank-mixed\",\"template\":\"A: _1_ you ever _2_ Chinese food? B: Yes, I _3_ some last week.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(auxiliary - present perfect question)\",\"answer\":\"Have\",\"acceptedAnswers\":[\"Have\"]},{\"blankId\":2,\"hint\":\"(try - past participle)\",\"answer\":\"tried\",\"acceptedAnswers\":[\"tried\"]},{\"blankId\":3,\"hint\":\"(have - past simple)\",\"answer\":\"had\",\"acceptedAnswers\":[\"had\"]}],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng từ \u003cstrong\u003eever\u003c/strong\u003e (đã bao giờ) trong câu hỏi hoặc \u003cstrong\u003enever\u003c/strong\u003e (chưa bao giờ) trong câu phủ định của thì hiện tại hoàn thành để hỏi hoặc kể về trải nghiệm tính đến hiện tại.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vì \u003cstrong\u003eever\u003c/strong\u003e chỉ hỏi kinh nghiệm nên chúng ta HTHT: Have you ever tried? Trạng từ \u003cstrong\u003elast week\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bạn đã bao giờ ăn đồ Trung Quốc chưa? - Rồi, tuần trước tôi ăn.\",\"hints\":[\"'ever' = present perfect\",\"'last week' = past simple\"],\"points\":15},{\"id\":183,\"type\":\"fill-blank\",\"question\":\"She _______ (go) to the dentist yesterday. (past simple)\",\"answer\":\"went\",\"acceptedAnswers\":[\"went\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ đơn để diễn tả hành động đã xảy ra và kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ, thường đi với các từ nhận biết như yesterday, ago, last week, in + năm.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003eyesterday\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn. Từ \u003cstrong\u003ego\u003c/strong\u003e chuyển thành \u003cstrong\u003ewent\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Hôm qua cô ấy đi nha sĩ.\",\"hints\":[\"'yesterday' = past simple\",\"go → went\"],\"points\":10},{\"id\":184,\"type\":\"fill-blank\",\"question\":\"They _______ (win) the match last Saturday. (past simple)\",\"answer\":\"won\",\"acceptedAnswers\":[\"won\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003elast Saturday\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn. Từ \u003cstrong\u003ewin\u003c/strong\u003e chuyển thành \u003cstrong\u003ewon\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ thắng trận đấu thứ Bảy trước.\",\"hints\":[\"'last Saturday' = past simple\",\"win → won\"],\"points\":10},{\"id\":185,\"type\":\"fill-blank\",\"question\":\"I _______ (meet) her at a party two weeks ago. (past simple)\",\"answer\":\"met\",\"acceptedAnswers\":[\"met\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ đơn để diễn tả hành động đã xảy ra và kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ, thường đi với các từ nhận biết như yesterday, ago, last week, in + năm.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003etwo weeks ago\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn. Từ \u003cstrong\u003emeet\u003c/strong\u003e chuyển thành \u003cstrong\u003emet\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi gặp cô ấy ở bữa tiệc 2 tuần trước.\",\"hints\":[\"'ago' = past simple\",\"meet → met\"],\"points\":10},{\"id\":186,\"type\":\"fill-blank\",\"question\":\"He _______ (not go) to school yesterday because he was ill.\",\"answer\":\"didn't go\",\"acceptedAnswers\":[\"didn't go\",\"did not go\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ đơn để diễn tả hành động đã xảy ra và kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ, thường đi với các từ nhận biết như yesterday, ago, last week, in + năm.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vì \u003cstrong\u003eyesterday' + 'was ill\u003c/strong\u003e chỉ quá khứ nên chúng ta quá khứ đơn. Phủ định: didn't + V nguyên mẫu.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Hôm qua anh ấy không đi học vì bị ốm.\",\"hints\":[\"'yesterday' = past simple negative\"],\"points\":10},{\"id\":187,\"type\":\"fill-blank-mixed\",\"template\":\"_1_ you _2_ to the concert last night?\",\"blanks\":[{\"blankId\":1,\"hint\":\"(go)\",\"answer\":\"Did\",\"acceptedAnswers\":[\"Did\"]},{\"blankId\":2,\"hint\":\"(go)\",\"answer\":\"go\",\"acceptedAnswers\":[\"go\"]}],\"points\":15,\"hints\":[\"'last night' = past simple question\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ đơn để diễn tả hành động đã xảy ra và kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ, thường đi với các từ nhận biết như yesterday, ago, last week, in + năm.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003elast night\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn. Câu hỏi: Did + S + V nguyên mẫu?.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tối qua bạn có đi xem hòa nhạc không?.\"},{\"id\":188,\"type\":\"fill-blank-mixed\",\"template\":\"When _1_ you first _2_ English?\",\"blanks\":[{\"blankId\":1,\"hint\":\"(learn)\",\"answer\":\"did\",\"acceptedAnswers\":[\"did\"]},{\"blankId\":2,\"hint\":\"(learn)\",\"answer\":\"learn\",\"acceptedAnswers\":[\"learn\"]}],\"points\":15,\"hints\":[\"'When' asks about a specific time\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Động từ \u003cstrong\u003e'When' hỏi thời điểm cụ thể\u003c/strong\u003e chia ở thì quá khứ đơn là \u003cstrong\u003equá khứ đơn\u003c/strong\u003e. Câu hỏi: When + did + S + V?.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bạn bắt đầu học tiếng Anh khi nào?.\"},{\"id\":189,\"type\":\"fill-blank\",\"question\":\"We _______ (spend) our holiday in Spain last year.\",\"answer\":\"spent\",\"acceptedAnswers\":[\"spent\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003elast year\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn. Từ \u003cstrong\u003espend\u003c/strong\u003e chuyển thành \u003cstrong\u003espent\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Năm ngoái chúng tôi nghỉ ở Tây Ban Nha.\",\"hints\":[\"'last year' = past simple\",\"spend → spent\"],\"points\":10},{\"id\":190,\"type\":\"fill-blank\",\"question\":\"She _______ (give) me a present on my birthday.\",\"answer\":\"gave\",\"acceptedAnswers\":[\"gave\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vì \u003cstrong\u003eon my birthday\u003c/strong\u003e chỉ sự kiện cụ thể trong quá khứ nên chúng ta quá khứ đơn. Từ \u003cstrong\u003egive\u003c/strong\u003e chuyển thành \u003cstrong\u003egave\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy tặng tôi quà vào ngày sinh nhật.\",\"hints\":[\"Specific past event = past simple\",\"give → gave\"],\"points\":10},{\"id\":191,\"type\":\"fill-blank-mixed\",\"template\":\"I _1_ (be) very tired last night, so I _2_ (go) to bed early.\",\"blanks\":[{\"blankId\":1,\"hint\":\"(be)\",\"answer\":\"was\",\"acceptedAnswers\":[\"was\"]},{\"blankId\":2,\"hint\":\"(go)\",\"answer\":\"went\",\"acceptedAnswers\":[\"went\"]}],\"points\":15,\"hints\":[\"Both verbs are past simple\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ đơn để diễn tả hành động đã xảy ra và kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ, thường đi với các từ nhận biết như yesterday, ago, last week, in + năm.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003elast night\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn. Từ \u003cstrong\u003ebe\u003c/strong\u003e chuyển thành \u003cstrong\u003ewas\u003c/strong\u003e, Từ \u003cstrong\u003ego\u003c/strong\u003e chuyển thành \u003cstrong\u003ewent\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tối qua tôi rất mệt nên đi ngủ sớm.\"},{\"id\":192,\"type\":\"fill-blank\",\"question\":\"He _______ (catch) the train this morning at 7 o'clock.\",\"answer\":\"caught\",\"acceptedAnswers\":[\"caught\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003ethis morning at 7 o'clock\u003c/strong\u003e chỉ một thời điểm cụ thể trong quá khứ, nên chúng ta sử dụng thì quá khứ đơn. Từ \u003cstrong\u003ecatch\u003c/strong\u003e chuyển thành \u003cstrong\u003ecaught\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy bắt tàu sáng nay lúc 7 giờ.\",\"hints\":[\"Specific time = past simple\",\"catch → caught\"],\"points\":10},{\"id\":193,\"type\":\"multiple-choice\",\"question\":\"She's been here _______ half past two.\",\"options\":[\"for\",\"since\",\"ago\",\"from\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vì \u003cstrong\u003e'half past two' = mốc thời gian cụ thể (giờ)\u003c/strong\u003e nên chúng ta chia ở \u003cstrong\u003edùng since\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy ở đây từ 2 giờ rưỡi.\",\"hints\":[\"'half past two' is a point in time → since\"],\"points\":10},{\"id\":194,\"type\":\"multiple-choice\",\"question\":\"I've had this bike _______ a long time.\",\"options\":[\"since\",\"for\",\"ago\",\"during\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vì \u003cstrong\u003e'a long time' = khoảng thời gian\u003c/strong\u003e nên chúng ta chia ở \u003cstrong\u003edùng for\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tôi đã có chiếc xe đạp này lâu rồi.\",\"hints\":[\"'a long time' is a duration → for\"],\"points\":10},{\"id\":195,\"type\":\"multiple-choice\",\"question\":\"He _______ his homework. He can go out and play now.\",\"options\":[\"finished\",\"has finished\",\"finishes\",\"is finishing\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vì \u003cstrong\u003eKết quả ở hiện tại (can go out now)\u003c/strong\u003e nên chúng ta chia ở \u003cstrong\u003ehiện tại hoàn thành\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Anh ấy đã làm xong bài tập. Giờ có thể ra ngoài chơi.\",\"hints\":[\"Result relevant now → present perfect\"],\"points\":10},{\"id\":196,\"type\":\"multiple-choice\",\"question\":\"_______ you _______ your room yet?\",\"options\":[\"Did ... clean\",\"Have ... cleaned\",\"Do ... clean\",\"Are ... cleaning\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng từ \u003cstrong\u003eyet\u003c/strong\u003e (chưa) ở cuối câu phủ định hoặc câu hỏi trong thì hiện tại hoàn thành để diễn tả một hành động mong đợi chưa xảy ra hoặc hỏi xem hành động đó đã hoàn thành chưa.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Từ \u003cstrong\u003eyet\u003c/strong\u003e chuyển thành \u003cstrong\u003edùng hiện tại hoàn thành trong câu hỏi\u003c/strong\u003e. Cấu trúc: Have + S + V3 + yet?.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bạn đã dọn phòng chưa?.\",\"hints\":[\"'yet' = present perfect question\"],\"points\":10},{\"id\":197,\"type\":\"multiple-choice\",\"question\":\"We _______ to that restaurant many times. The food is great!\",\"options\":[\"went\",\"have been\",\"go\",\"are going\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả kinh nghiệm/trải nghiệm tính đến hiện tại, không gắn với một mốc thời gian cụ thể).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng từ \u003cstrong\u003emany times\u003c/strong\u003e chỉ số lần trải nghiệm tính đến hiện tại, không phải một thời điểm xác định trong quá khứ, nên chúng ta sử dụng thì hiện tại hoàn thành. have been to = đã từng đến.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chúng tôi đã đến nhà hàng đó nhiều lần.\",\"hints\":[\"'many times' = experience → present perfect\"],\"points\":10},{\"id\":198,\"type\":\"multiple-choice\",\"question\":\"She _______ her leg, so she can't walk.\",\"options\":[\"broke\",\"has broken\",\"breaks\",\"is breaking\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Phân biệt thì quá khứ đơn (diễn tả hành động đã kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ) và thì hiện tại hoàn thành (diễn tả hành động bắt đầu trong quá khứ và vẫn còn liên quan đến hiện tại).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vì \u003cstrong\u003eKết quả vẫn ở hiện tại (can't walk)\u003c/strong\u003e nên chúng ta chia ở \u003cstrong\u003ehiện tại hoàn thành\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cô ấy đã gãy chân nên không đi được.\",\"hints\":[\"Can't walk now = result still relevant\"],\"points\":10},{\"id\":199,\"type\":\"multiple-choice\",\"question\":\"I _______ a great book last weekend. You should read it!\",\"options\":[\"have read\",\"read\",\"am reading\",\"have been reading\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Dùng thì quá khứ đơn để diễn tả hành động đã xảy ra và kết thúc hoàn toàn tại một thời điểm xác định trong quá khứ, thường đi với các
