el__heading\"\u003e1 Active vs Passive — Chủ động vs Bị động\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCâu chủ động (Active):\u003c/strong\u003e Chủ ngữ THỰC HIỆN hành động.\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCâu bị động (Passive):\u003c/strong\u003e Chủ ngữ NHẬN / BỊ tác động bởi hành động.\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eKhi nào dùng bị động?\u003c/strong\u003e\u003c/p\u003e\r\n          \u003cul\u003e\r\n            \u003cli\u003eKhông biết ai làm: \u003cem\u003eMy bike \u003cstrong\u003ewas stolen\u003c/strong\u003e.\u003c/em\u003e (Xe bị trộm — không biết ai lấy)\u003c/li\u003e\r\n            \u003cli\u003eKhông quan trọng ai làm: \u003cem\u003eRice \u003cstrong\u003eis grown\u003c/strong\u003e in Vietnam.\u003c/em\u003e (Gạo được trồng ở VN)\u003c/li\u003e\r\n            \u003cli\u003eNhấn mạnh đối tượng bị tác động: \u003cem\u003eThe Mona Lisa \u003cstrong\u003ewas painted\u003c/strong\u003e by Leonardo.\u003c/em\u003e\u003c/li\u003e\r\n          \u003c/ul\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eSo sánh nhanh:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eActive:\u003c/strong\u003e Tom \u003cstrong\u003ecleans\u003c/strong\u003e the room. (Tom dọn phòng.)\u003cbr\u003e\r\n            \u003cstrong\u003ePassive:\u003c/strong\u003e The room \u003cstrong\u003eis cleaned\u003c/strong\u003e by Tom. (Phòng được Tom dọn.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eActive:\u003c/strong\u003e They \u003cstrong\u003ebuilt\u003c/strong\u003e the bridge in 2010.\u003cbr\u003e\r\n            \u003cstrong\u003ePassive:\u003c/strong\u003e The bridge \u003cstrong\u003ewas built\u003c/strong\u003e in 2010.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 2: Present Simple Passive --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e2 Present Simple Passive — Bị động Hiện tại đơn\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e S + \u003cstrong\u003eam / is / are\u003c/strong\u003e (+ not) + \u003cstrong\u003epast participle (V3)\u003c/strong\u003e (+ by ...)\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ Lemons \u003cstrong\u003eare grown\u003c/strong\u003e in Italy. (Chanh được trồng ở Ý.)\u003cbr\u003e\r\n            ✓ English \u003cstrong\u003eis spoken\u003c/strong\u003e all over the world. (Tiếng Anh được nói trên toàn thế giới.)\u003cbr\u003e\r\n            ✓ These cars \u003cstrong\u003eare made\u003c/strong\u003e in Japan. (Những xe này được sản xuất ở Nhật.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePhủ định:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ Jeans \u003cstrong\u003earen't made\u003c/strong\u003e of wool. (Quần jeans không được làm từ len.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eCâu hỏi:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eAre\u003c/strong\u003e the children \u003cstrong\u003edriven\u003c/strong\u003e to school? (Bọn trẻ có được chở đến trường không?)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Sự thật / thói quen mà chủ ngữ BỊ tác động → \u003cstrong\u003eam/is/are + V3\u003c/strong\u003e\u003cbr\u003e\r\n            I → am | He/She/It → is | We/You/They → are\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 3: Past Simple Passive --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e3 Past Simple Passive — Bị động Quá khứ đơn\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e S + \u003cstrong\u003ewas / were\u003c/strong\u003e (+ not) + \u003cstrong\u003epast participle (V3)\u003c/strong\u003e (+ by ...)\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ The children \u003cstrong\u003ewere driven\u003c/strong\u003e to school yesterday. (Bọn trẻ được chở đến trường hôm qua.)\u003cbr\u003e\r\n            ✓ This house \u003cstrong\u003ewas built\u003c/strong\u003e in 1990. (Ngôi nhà này được xây năm 1990.)\u003cbr\u003e\r\n            ✓ The letters \u003cstrong\u003ewere sent\u003c/strong\u003e last week. (Những lá thư được gửi tuần trước.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePhủ định:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ The books \u003cstrong\u003eweren't put\u003c/strong\u003e on the bookshelf. (Sách không được đặt lên kệ.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eCâu hỏi:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWas\u003c/strong\u003e the cake \u003cstrong\u003emade\u003c/strong\u003e by your mum? (Bánh được mẹ bạn làm à?)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Hành động đã xảy ra trong quá khứ mà chủ ngữ BỊ tác động → \u003cstrong\u003ewas/were + V3\u003c/strong\u003e\u003cbr\u003e\r\n            I/He/She/It → was | We/You/They → were\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 4: Present Continuous Passive --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e4 Present Continuous Passive — Bị động Hiện tại tiếp diễn\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003eCấu trúc:\u003c/strong\u003e S + \u003cstrong\u003eam / is / are\u003c/strong\u003e (+ not) + \u003cstrong\u003ebeing\u003c/strong\u003e + \u003cstrong\u003epast participle (V3)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eVí dụ:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ The car \u003cstrong\u003eis being tested\u003c/strong\u003e now. (Chiếc xe đang được kiểm tra bây giờ.)\u003cbr\u003e\r\n            ✓ The rooms \u003cstrong\u003eare being cleaned\u003c/strong\u003e at the moment. (Các phòng đang được dọn dẹp lúc này.)\u003cbr\u003e\r\n            ✓ A new school \u003cstrong\u003eis being built\u003c/strong\u003e near here. (Một trường mới đang được xây gần đây.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003ePhủ định:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ The decorations \u003cstrong\u003earen't being taken down\u003c/strong\u003e yet. (Đồ trang trí chưa đang bị tháo.)\u003cbr\u003e\u003cbr\u003e\r\n            \u003cstrong\u003eCâu hỏi:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eIs\u003c/strong\u003e the food \u003cstrong\u003ebeing prepared\u003c/strong\u003e? (Thức ăn đang được chuẩn bị chưa?)\r\n          \u003c/div\u003e\r\n\r\n          \u003cdiv style=\"background: #fff3cd; padding: 0.8rem; margin-top: 1rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Mẹo nhớ:\u003c/strong\u003e Đang xảy ra NGAY BÂY GIỜ + chủ ngữ bị tác động → \u003cstrong\u003eam/is/are + being + V3\u003c/strong\u003e\u003cbr\u003e\r\n            Từ nhận biết: now, at the moment, right now, currently\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 5: How to convert Active → Passive --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e5 Cách chuyển Active → Passive (Từng bước)\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #d1ecf1; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003eBước 1:\u003c/strong\u003e Lấy TÂN NGỮ (Object) của câu chủ động làm CHỦ NGỮ câu bị động.\u003cbr\u003e\r\n            \u003cstrong\u003eBước 2:\u003c/strong\u003e Xác định THÌ của động từ → chọn dạng BE phù hợp.\u003cbr\u003e\r\n            \u003cstrong\u003eBước 3:\u003c/strong\u003e Đổi động từ chính sang QUÁ KHỨ PHÂN TỪ (V3).\u003cbr\u003e\r\n            \u003cstrong\u003eBước 4:\u003c/strong\u003e Thêm BY + chủ ngữ cũ (nếu cần).\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eVí dụ chi tiết:\u003c/strong\u003e\u003cbr\u003e\r\n            Active: People \u003cstrong\u003espeak\u003c/strong\u003e English everywhere.\u003cbr\u003e\r\n            → B1: English ... (tân ngữ → chủ ngữ mới)\u003cbr\u003e\r\n            → B2: English \u003cstrong\u003eis\u003c/strong\u003e ... (present simple → is/are)\u003cbr\u003e\r\n            → B3: English is \u003cstrong\u003espoken\u003c/strong\u003e ... (speak → spoken)\u003cbr\u003e\r\n            → B4: English is spoken everywhere. (by people — bỏ vì không quan trọng)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            Active: They \u003cstrong\u003eare building\u003c/strong\u003e a new bridge.\u003cbr\u003e\r\n            → Passive: A new bridge \u003cstrong\u003eis being built\u003c/strong\u003e. (present continuous passive)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 6: Questions in Passive --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e6 Câu hỏi dạng bị động\u003c/h3\u003e\r\n\r\n          \u003cdiv class=\"theory-panel__example\"\u003e\r\n            \u003cstrong\u003eYes/No Questions:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eIs\u003c/strong\u003e rice \u003cstrong\u003egrown\u003c/strong\u003e in Vietnam? — Yes, it is. / No, it isn't.\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWas\u003c/strong\u003e the letter \u003cstrong\u003esent\u003c/strong\u003e yesterday? — Yes, it was.\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eIs\u003c/strong\u003e the road \u003cstrong\u003ebeing repaired\u003c/strong\u003e? — Yes, it is.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003eWh- Questions:\u003c/strong\u003e\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWhere is\u003c/strong\u003e rice \u003cstrong\u003egrown\u003c/strong\u003e? — In Vietnam.\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWhen was\u003c/strong\u003e this school \u003cstrong\u003ebuilt\u003c/strong\u003e? — In 2005.\u003cbr\u003e\r\n            ✓ \u003cstrong\u003eWhat is being done\u003c/strong\u003e about the problem? — A new plan is being made.\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003c!-- Section 7: Common Mistakes --\u003e\r\n        \u003cdiv class=\"theory-panel__section\"\u003e\r\n          \u003ch3 class=\"theory-panel__heading\"\u003e7 Lỗi thường gặp vs ✓\u003c/h3\u003e\r\n\r\n          \u003cdiv style=\"background: #f8d7da; padding: 0.8rem; margin-top: 0.5rem; border-radius: 4px;\"\u003e\r\n            \u003cstrong\u003e Lỗi 1: Thiếu BE\u003c/strong\u003e\u003cbr\u003e\r\n            The car \u003cstrong\u003emade\u003c/strong\u003e in Japan. (Thiếu \"is\")\u003cbr\u003e\r\n            The car \u003cstrong\u003eis made\u003c/strong\u003e in Japan.\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 2: Dùng V-ing thay vì V3\u003c/strong\u003e\u003cbr\u003e\r\n            The room \u003cstrong\u003eis cleaning\u003c/strong\u003e now. (Đây là active!)\u003cbr\u003e\r\n            The room \u003cstrong\u003eis being cleaned\u003c/strong\u003e now. (Passive continuous)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 3: Nhầm was/were\u003c/strong\u003e\u003cbr\u003e\r\n            The books \u003cstrong\u003ewas\u003c/strong\u003e written by her.\u003cbr\u003e\r\n            The books \u003cstrong\u003ewere\u003c/strong\u003e written by her. (books = số nhiều → were)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 4: Quên \"being\" ở present continuous passive\u003c/strong\u003e\u003cbr\u003e\r\n            The house \u003cstrong\u003eis built\u003c/strong\u003e now. (Đây là present simple passive!)\u003cbr\u003e\r\n            The house \u003cstrong\u003eis being built\u003c/strong\u003e now. (Present continuous passive)\u003cbr\u003e\u003cbr\u003e\r\n\r\n            \u003cstrong\u003e Lỗi 5: Dùng by + tân ngữ sai\u003c/strong\u003e\u003cbr\u003e\r\n            The cake was made by \u003cstrong\u003eshe\u003c/strong\u003e.\u003cbr\u003e\r\n            The cake was made by \u003cstrong\u003eher\u003c/strong\u003e. (by + tân ngữ: me/him/her/us/them)\r\n          \u003c/div\u003e\r\n        \u003c/div\u003e"])</script><script>self.__next_f.push([1,"d:[\"$\",\"$L16\",null,{\"unit\":{\"unitId\":\"gf6-unit-5-making-things\",\"title\":\"Unit 5: Making Things - The Passive (1 \u0026 2)\",\"grammarTopics\":[\"Passive: present simple\",\"Passive: past simple\",\"Passive: present continuous\"],\"theory\":{\"brief\":\"Câu bị động (passive) dùng khi không biết hoặc không cần nói ai thực hiện hành động. Present simple passive: am/is/are + V3. Past simple passive: was/were + V3. Present continuous passive: am/is/are + being + V3.\",\"rules\":[\"Present simple passive: S + am/is/are + V3 (past participle)\",\"Past simple passive: S + was/were + V3\",\"Present continuous passive: S + am/is/are + being + V3\",\"Dùng BY + agent nếu cần nói ai thực hiện hành động\",\"Chủ ngữ số ít → is/was, số nhiều → are/were\"]},\"exercises\":[{\"id\":1,\"type\":\"fill-blank\",\"question\":\"Rice __________ (grow) in Vietnam.\",\"answer\":\"is grown\",\"acceptedAnswers\":[\"is grown\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'Rice' (gạo) là danh từ không đếm được (tương ứng ngôi số ít) và nhận hành động 'grow' (trồng), phân từ 2 của 'grow' là 'grown'. Vì vậy, các em dùng 'is grown'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Gạo được trồng ở Việt Nam.\",\"hints\":[\"Present simple passive: is/are + V3\"],\"points\":10},{\"id\":2,\"type\":\"fill-blank\",\"question\":\"English __________ (speak) all over the world.\",\"answer\":\"is spoken\",\"acceptedAnswers\":[\"is spoken\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'English' (tiếng Anh) ở ngôi số ít và nhận hành động 'speak' (nói), phân từ 2 của 'speak' là 'spoken'. Vì vậy, các em dùng 'is spoken'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tiếng Anh được nói trên toàn thế giới.\",\"hints\":[\"is/are + past participle\"],\"points\":10},{\"id\":3,\"type\":\"fill-blank\",\"question\":\"These cars __________ (make) in Japan.\",\"answer\":\"are made\",\"acceptedAnswers\":[\"are made\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'These cars' (những chiếc xe hơi này) ở dạng số nhiều và nhận hành động 'make' (sản xuất), phân từ 2 của 'make' là 'made'. Vì vậy, các em dùng 'are made'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Những xe này được sản xuất ở Nhật.\",\"hints\":[\"Số nhiều → are + V3\"],\"points\":10},{\"id\":4,\"type\":\"fill-blank\",\"question\":\"Butter __________ (make) from milk.\",\"answer\":\"is made\",\"acceptedAnswers\":[\"is made\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'Butter' (bơ) là danh từ không đếm được (tương ứng ngôi số ít) và nhận hành động 'make' (làm), phân từ 2 của 'make' là 'made'. Vì vậy, các em dùng 'is made'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bơ được làm từ sữa.\",\"hints\":[\"is + V3\"],\"points\":10},{\"id\":5,\"type\":\"fill-blank\",\"question\":\"The letters __________ (deliver) every morning.\",\"answer\":\"are delivered\",\"acceptedAnswers\":[\"are delivered\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'The letters' (những lá thư) ở dạng số nhiều và nhận hành động 'deliver' (giao), phân từ 2 của 'deliver' là 'delivered'. Vì vậy, các em dùng 'are delivered'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Thư được giao mỗi sáng.\",\"hints\":[\"Số nhiều + every → are + V3\"],\"points\":10},{\"id\":6,\"type\":\"fill-blank\",\"question\":\"Coffee __________ (grow) in Brazil.\",\"answer\":\"is grown\",\"acceptedAnswers\":[\"is grown\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'Coffee' (cà phê) là danh từ không đếm được (tương ứng ngôi số ít) và nhận hành động 'grow' (trồng), phân từ 2 của 'grow' là 'grown'. Vì vậy, các em dùng 'is grown'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cà phê được trồng ở Brazil.\",\"hints\":[\"is + V3\"],\"points\":10},{\"id\":7,\"type\":\"fill-blank\",\"question\":\"The school __________ (clean) every day.\",\"answer\":\"is cleaned\",\"acceptedAnswers\":[\"is cleaned\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'The school' (trường học) ở ngôi số ít và nhận hành động 'clean' (dọn dẹp), phân từ 2 của 'clean' là 'cleaned'. Vì vậy, các em dùng 'is cleaned'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Trường được dọn mỗi ngày.\",\"hints\":[\"is + V3\"],\"points\":10},{\"id\":8,\"type\":\"fill-blank\",\"question\":\"Newspapers __________ (sell) at the shop on the corner.\",\"answer\":\"are sold\",\"acceptedAnswers\":[\"are sold\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'Newspapers' (báo chi) ở dạng số nhiều và nhận hành động 'sell' (bán), phân từ 2 của 'sell' là 'sold'. Vì vậy, các em dùng 'are sold'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Báo được bán ở cửa hàng góc phố.\",\"hints\":[\"Số nhiều → are + V3\"],\"points\":10},{\"id\":9,\"type\":\"fill-blank\",\"question\":\"The museum __________ (visit) by thousands of tourists every year.\",\"answer\":\"is visited\",\"acceptedAnswers\":[\"is visited\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'The museum' (bảo tàng) ở ngôi số ít và nhận hành động 'visit' (ghé thăm), phân từ 2 của 'visit' là 'visited'. Vì vậy, các em dùng 'is visited'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bảo tàng được hàng nghìn du khách ghé thăm mỗi năm.\",\"hints\":[\"every year → present simple passive\"],\"points\":10},{\"id\":10,\"type\":\"fill-blank\",\"question\":\"Paper __________ (make) from wood.\",\"answer\":\"is made\",\"acceptedAnswers\":[\"is made\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'Paper' (giấy) là danh từ không đếm được (tương ứng ngôi số ít) và nhận hành động 'make' (làm), phân từ 2 của 'make' là 'made'. Vì vậy, các em dùng 'is made'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Giấy được làm từ gỗ.\",\"hints\":[\"is + V3\"],\"points\":10},{\"id\":11,\"type\":\"fill-blank\",\"question\":\"The children __________ (teach) English at school.\",\"answer\":\"are taught\",\"acceptedAnswers\":[\"are taught\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'The children' (bọn trẻ) là danh từ số nhiều và nhận hành động 'teach' (dạy), phân từ 2 của 'teach' là 'taught'. Vì vậy, các em dùng 'are taught'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bọn trẻ được dạy tiếng Anh ở trường.\",\"hints\":[\"teach → taught (V3)\"],\"points\":10},{\"id\":12,\"type\":\"fill-blank\",\"question\":\"Football __________ (play) in many countries.\",\"answer\":\"is played\",\"acceptedAnswers\":[\"is played\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Câu bị động ở thì hiện tại đơn được dùng để diễn tả một sự thật hiển nhiên hoặc hành động lặp đi lặp lại ở hiện tại. Cấu trúc khẳng định: \u003cstrong\u003eS + am/is/are + V3/V-ed\u003c/strong\u003e; phủ định: \u003cstrong\u003eS + am/is/are + not + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'Football' (bóng đá) ở ngôi số ít và nhận hành động 'play' (chơi), phân từ 2 của 'play' là 'played'. Vì vậy, các em dùng 'is played'.\u003cbr\u00 ts\":[\"us → We, drive → driven (V3)\"],\"points\":10,\"original\":\"My dad drove us to school yesterday.\"},{\"id\":122,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in passive voice.\",\"answer\":\"The hall is being decorated for the party.\",\"acceptedAnswers\":[\"The hall is being decorated for the party.\",\"The hall is being decorated for the party\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu chủ động sang câu bị động: Đầu tiên, đưa tân ngữ câu chủ động lên làm chủ ngữ mới. Tiếp theo, chia động từ tobe ở đúng thì và hòa hợp với chủ ngữ mới, theo sau bởi động từ chính ở dạng phân từ 2 (V3/V-ed). Cuối cùng, đưa chủ ngữ câu chủ động ra sau giới từ by (có thể bỏ nếu không xác định).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu chủ động 'Someone is decorating the hall for the party' chia ở thì hiện tại tiếp diễn. Tân ngữ 'The hall' (số ít) làm chủ ngữ mới, động từ chuyển thành 'is being decorated', chủ ngữ 'Someone' được lược bỏ. Do đó, ta có câu bị động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Hội trường đang được trang trí cho bữa tiệc.\",\"hints\":[\"is decorating → is being decorated\"],\"points\":10,\"original\":\"Someone is decorating the hall for the party.\"},{\"id\":123,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in passive voice.\",\"answer\":\"The food is cooked by a famous chef at this restaurant.\",\"acceptedAnswers\":[\"The food is cooked by a famous chef at this restaurant.\",\"The food is cooked by a famous chef at this restaurant\",\"The food at this restaurant is cooked by a famous chef.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu chủ động sang câu bị động: Đầu tiên, đưa tân ngữ câu chủ động lên làm chủ ngữ mới. Tiếp theo, chia động từ tobe ở đúng thì và hòa hợp với chủ ngữ mới, theo sau bởi động từ chính ở dạng phân từ 2 (V3/V-ed). Cuối cùng, đưa chủ ngữ câu chủ động ra sau giới từ by (có thể bỏ nếu không xác định).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu chủ động 'A famous chef cooks the food at this restaurant' chia ở thì hiện tại đơn. Tân ngữ 'The food' (số ít) làm chủ ngữ mới, động từ chuyển thành 'is cooked', chủ ngữ 'A famous chef' chuyển thành 'by a famous chef'. Do đó, ta có câu bị động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Thức ăn được nấu bởi đầu bếp nổi tiếng ở nhà hàng này.\",\"hints\":[\"the food → is cooked + by a famous chef\"],\"points\":10,\"original\":\"A famous chef cooks the food at this restaurant.\"},{\"id\":124,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in passive voice.\",\"answer\":\"The students were given certificates.\",\"acceptedAnswers\":[\"The students were given certificates.\",\"The students were given certificates\",\"Certificates were given to the students.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu chủ động sang câu bị động: Đầu tiên, đưa tân ngữ câu chủ động lên làm chủ ngữ mới. Tiếp theo, chia động từ tobe ở đúng thì và hòa hợp với chủ ngữ mới, theo sau bởi động từ chính ở dạng phân từ 2 (V3/V-ed). Cuối cùng, đưa chủ ngữ câu chủ động ra sau giới từ by (có thể bỏ nếu không xác định).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu chủ động 'They gave the students certificates' chia ở thì quá khứ đơn. Tân ngữ 'the students' (số nhiều) làm chủ ngữ mới, động từ chuyển thành 'were given', tân ngữ 'certificates' giữ nguyên phía sau. Do đó, ta có câu bị động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Các học sinh được trao chứng chỉ.\",\"hints\":[\"give → given (V3)\"],\"points\":10,\"original\":\"They gave the students certificates.\"},{\"id\":125,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in passive voice.\",\"answer\":\"The new software is being tested at the moment.\",\"acceptedAnswers\":[\"The new software is being tested at the moment.\",\"The new software is being tested at the moment\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu chủ động sang câu bị động: Đầu tiên, đưa tân ngữ câu chủ động lên làm chủ ngữ mới. Tiếp theo, chia động từ tobe ở đúng thì và hòa hợp với chủ ngữ mới, theo sau bởi động từ chính ở dạng phân từ 2 (V3/V-ed). Cuối cùng, đưa chủ ngữ câu chủ động ra sau giới từ by (có thể bỏ nếu không xác định).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu chủ động 'They are testing the new software at the moment' chia ở thì hiện tại tiếp diễn. Tân ngữ 'The new software' (số ít) làm chủ ngữ mới, động từ chuyển thành 'is being tested', chủ ngữ 'They' được lược bỏ. Do đó, ta có câu bị động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Phần mềm mới đang được kiểm tra lúc này.\",\"hints\":[\"are testing → is being tested\"],\"points\":10,\"original\":\"They are testing the new software at the moment.\"},{\"id\":126,\"type\":\"multiple-choice\",\"question\":\"The cakes __________ by my sister every weekend.\",\"options\":[\"are baked\",\"is baked\",\"baked\",\"are baking\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chọn dạng bị động chính xác: Trước hết, xác định thì của câu dựa vào trạng ngữ chỉ thời gian. Sau đó, chọn động từ tobe ở dạng số ít hay số nhiều để hòa hợp với chủ ngữ. Cuối cùng, chia động từ chính ở dạng phân từ 2 (V3/V-ed).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng ngữ 'every weekend' chỉ hiện tại đơn. Chủ ngữ 'The cakes' (số nhiều) cần dạng bị động hiện tại đơn số nhiều: 'are baked'. Phương án A là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bánh được chị tôi nướng mỗi cuối tuần.\",\"hints\":[\"Số nhiều + every weekend → are + V3\"],\"points\":10},{\"id\":127,\"type\":\"multiple-choice\",\"question\":\"This song __________ by Ed Sheeran.\",\"options\":[\"was written\",\"were written\",\"is writing\",\"written\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chọn dạng bị động chính xác: Trước hết, xác định thì của câu dựa vào trạng ngữ chỉ thời gian. Sau đó, chọn động từ tobe ở dạng số ít hay số nhiều để hòa hợp với chủ ngữ. Cuối cùng, chia động từ chính ở dạng phân từ 2 (V3/V-ed).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu nói về một sự kiện đã xảy ra và hoàn thành (bài hát được viết bởi Ed Sheeran). Chủ ngữ 'This song' (số ít) cần dạng bị động quá khứ đơn số ít: 'was written'. Phương án A là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bài hát này được viết bởi Ed Sheeran.\",\"hints\":[\"Số ít + quá khứ → was + V3\"],\"points\":10},{\"id\":128,\"type\":\"multiple-choice\",\"question\":\"The new hospital __________ at the moment.\",\"options\":[\"is being built\",\"is built\",\"was built\",\"are being built\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chọn dạng bị động chính xác: Trước hết, xác định thì của câu dựa vào trạng ngữ chỉ thời gian. Sau đó, chọn động từ tobe ở dạng số ít hay số nhiều để hòa hợp với chủ ngữ. Cuối cùng, chia động từ chính ở dạng phân từ 2 (V3/V-ed).\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng ngữ 'at the moment' chỉ hiện tại tiếp diễn. Chủ ngữ 'The new hospital' (số ít) cần dạng bị động hiện tại tiếp diễn số ít: 'is being built'. Phương án A là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bệnh viện mới đang được xây lúc này.\",\"hints\":[\"at the moment → is being + V3\"],\"points\":10},{\"id\":129,\"type\":\"multiple-choice\",\"question\":\"The windows __________ by the cleaner yesterday.\",\"options\":[\"were cleaned\",\"was cleaned\",\"are cleaned\",\"is cleaned\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chọn dạng bị động chính xác: Trước hết, xác định thì của câu dựa vào trạng ngữ chỉ thời gian. Sau đó, chọn động từ tobe ở dạng số ít hay số nhiều để trúc bị động tiếp diễn phải ở dạng phân từ 2. Cần sửa 'cook' thành 'cooked'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Thức ăn đang được nấu trong bếp bây giờ.\",\"hints\":[\"Cần V3: cook → cooked\"],\"points\":10},{\"id\":169,\"type\":\"error-correct\",\"wrongSentence\":\"The presents is wrapped in colourful paper.\",\"correctSentence\":\"The presents are wrapped in colourful paper.\",\"errorWord\":\"is\",\"correction\":\"are\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để sửa lỗi sai trong câu bị động: Hãy kiểm tra xem câu đã có động từ tobe chia ở đúng thì và phù hợp với chủ ngữ số ít hay số nhiều chưa. Đồng thời, đảm bảo động từ chính đã được chia ở dạng phân từ 2 (V3/V-ed) và đại từ sau by phải ở dạng tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Chủ ngữ 'The presents' ở dạng số nhiều nhưng lại đi với động từ tobe số ít 'is'. Cần sửa 'is' thành 'are'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Quà được gói trong giấy nhiều màu.\",\"hints\":[\"presents = số nhiều → are\"],\"points\":10},{\"id\":170,\"type\":\"error-correct\",\"wrongSentence\":\"The museum is visit by thousands of tourists.\",\"correctSentence\":\"The museum is visited by thousands of tourists.\",\"errorWord\":\"visit\",\"correction\":\"visited\",\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để sửa lỗi sai trong câu bị động: Hãy kiểm tra xem câu đã có động từ tobe chia ở đúng thì và phù hợp với chủ ngữ số ít hay số nhiều chưa. Đồng thời, đảm bảo động từ chính đã được chia ở dạng phân từ 2 (V3/V-ed) và đại từ sau by phải ở dạng tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trong cấu trúc bị động hiện tại đơn, động từ chính sau tobe phải ở phân từ 2. Cần sửa 'visit' thành 'visited'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bảo tàng được hàng nghìn du khách ghé thăm.\",\"hints\":[\"Cần V3: visit → visited\"],\"points\":10},{\"id\":171,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"People speak English all over the world.\",\"acceptedAnswers\":[\"People speak English all over the world.\",\"People speak English all over the world\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại đơn và lược bỏ tác nhân. Ta thêm chủ ngữ chung 'People', đổi động từ bị động 'is spoken' thành động từ chủ động ở hiện tại đơn 'speak' và đưa 'English' làm tân ngữ phía sau. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Mọi người nói tiếng Anh trên toàn thế giới.\",\"hints\":[\"Ai nói tiếng Anh? → People speak ...\"],\"points\":10,\"original\":\"English is spoken all over the world.\"},{\"id\":172,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"My grandmother made the cake.\",\"acceptedAnswers\":[\"My grandmother made the cake.\",\"My grandmother made the cake\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở quá khứ đơn có tác nhân 'by my grandmother'. Ta chuyển 'my grandmother' làm chủ ngữ, đổi động từ bị động 'was made' thành động từ chủ động ở quá khứ là 'made' và 'the cake' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bà tôi đã làm bánh.\",\"hints\":[\"by my grandmother → My grandmother made ...\"],\"points\":10,\"original\":\"The cake was made by my grandmother.\"},{\"id\":173,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"They clean the rooms every day.\",\"acceptedAnswers\":[\"They clean the rooms every day.\",\"They clean the rooms every day\",\"Someone cleans the rooms every day.\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại đơn và không có tác nhân. Ta thêm chủ ngữ 'They' (hoặc 'Someone'), chia động từ chủ động ở hiện tại đơn là 'clean' (hoặc 'cleans' cho someone) và đưa 'the rooms' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ dọn các phòng mỗi ngày.\",\"hints\":[\"Không có by → dùng They/Someone\"],\"points\":10,\"original\":\"The rooms are cleaned every day.\"},{\"id\":174,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"They are repairing the bridge now.\",\"acceptedAnswers\":[\"They are repairing the bridge now.\",\"They are repairing the bridge now\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại tiếp diễn và không có tác nhân. Ta thêm chủ ngữ 'They', chia động từ chủ động ở hiện tại tiếp diễn tư 003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại tiếp diễn có tác nhân 'by Tom'. Ta đưa 'Tom' làm chủ ngữ, đổi động từ bị động 'is being washed' thành động từ chủ động hiện tại tiếp diễn 'is washing' và đưa 'the car' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Tom đang rửa xe.\",\"hints\":[\"by Tom → Tom is washing\"],\"points\":10,\"original\":\"The car is being washed by Tom.\"},{\"id\":177,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"My father wrote the letter.\",\"acceptedAnswers\":[\"My father wrote the letter.\",\"My father wrote the letter\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở quá khứ đơn có tác nhân 'by my father'. Ta đưa 'my father' làm chủ ngữ, đổi động từ bị động 'was written' thành động từ chủ động ở quá khứ 'wrote' (quá khứ của write) và đưa 'the letter' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bố tôi đã viết lá thư.\",\"hints\":[\"by my father → My father wrote\"],\"points\":10,\"original\":\"The letter was written by my father.\"},{\"id\":178,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"The gardener waters the flowers every morning.\",\"acceptedAnswers\":[\"The gardener waters the flowers every morning.\",\"The gardener waters the flowers every morning\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại đơn có tác nhân 'by the gardener'. Ta đưa 'the gardener' (số ít) làm chủ ngữ, đổi động từ bị động 'are watered' thành động từ chủ động hiện tại đơn 'waters' và đưa 'the flowers' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Người làm vườn tưới hoa mỗi sáng.\",\"hints\":[\"by the gardener → The gardener waters\"],\"points\":10,\"original\":\"The flowers are watered by the gardener every morning.\"},{\"id\":179,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"Their parents drove the children to school.\",\"acceptedAnswers\":[\"Their parents drove the children to school.\",\"Their parents drove the children to school\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở quá khứ đơn có tác nhân 'by their parents'. Ta đưa 'their parents' làm chủ ngữ, đổi động từ bị động 'were driven' thành động từ chủ động ở quá khứ 'drove' (quá khứ của drive) và đưa 'the children' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bố mẹ chở bọn trẻ đến trường.\",\"hints\":[\"by their parents → Their parents drove\"],\"points\":10,\"original\":\"The children were driven to school by their parents.\"},{\"id\":180,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"The chef is preparing the food.\",\"acceptedAnswers\":[\"The chef is preparing the food.\",\"The chef is preparing the food\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại tiếp diễn có tác nhân 'by the chef'. Ta đưa 'the chef' làm chủ ngữ, đổi động từ bị động 'is being prepared' thành động từ chủ động hiện tại tiếp diễn 'is preparing' và đưa 'the food' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Đầu bếp đang chuẩn bị thức ăn.\",\"hints\":[\"by the chef → The chef is preparing\"],\"points\":10,\"original\":\"The food is being prepared by the chef.\"},{\"id\":181,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"A famous singer sang the song.\",\"acceptedAnswers\":[\"A famous singer sang the song.\",\"A famous singer sang the song\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở quá khứ đơn có tác nhân 'by a famous singer'. Ta đưa 'a famous singer' làm chủ ngữ, đổi động từ bị động 'was sung' thành động từ chủ động ở quá khứ 'sang' (quá khứ của sing) và đưa 'the song' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Một ca sĩ nổi tiếng đã hát bài hát.\",\"hints\":[\"sung → sang (past simple active)\"],\"points\":10,\"original\":\"The song was sung by a famous singer.\"},{\"id\":182,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"The teacher checks the homework every day.\",\"acceptedAnswers\":[\"The teacher checks the homework every day.\",\"The teacher checks the homework every day\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại đơn có tác nhân 'by the teacher'. Ta đưa 'the teacher' (số ít) làm chủ ngữ, đổi động từ bị động 'is checked' thành động từ chủ động hiện tại đơn 'checks' và đưa 'the homework' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Giáo viên kiểm tra bài tập mỗi ngày.\",\"hints\":[\"by the teacher → The teacher checks\"],\"points\":10,\"original\":\"The homework is checked by the teacher every day.\"},{\"id\":183,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"They sell the tickets at the door.\",\"acceptedAnswers\":[\"They sell the tickets at the door.\",\"They sell the tickets at the door\",\"They sell tickets at the door.\",\"They sell tickets at the door\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại đơn và không có tác nhân. Ta thêm chủ ngữ 'They', đổi động từ bị động 'are sold' thành động từ chủ động hiện tại đơn 'sell' và đưa 'the tickets' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Họ bán vé ở cửa.\",\"hints\":[\"Không có by → They sell\"],\"points\":10,\"original\":\"The tickets are sold at the door.\"},{\"id\":184,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"The workers are painting the walls.\",\"acceptedAnswers\":[\"The workers are painting the walls.\",\"The workers are painting the walls\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở hiện tại tiếp diễn có tác nhân 'by the workers'. Ta đưa 'the workers' làm chủ ngữ, đổi động từ bị động 'are being painted' thành động từ chủ động hiện tại tiếp diễn 'are painting' và đưa 'the walls' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Công nhân đang sơn tường.\",\"hints\":[\"by the workers → The workers are painting\"],\"points\":10,\"original\":\"The walls are being painted by the workers.\"},{\"id\":185,\"type\":\"sentence-rewrite\",\"instruction\":\"Rewrite in active voice.\",\"answer\":\"My grandfather told the story.\",\"acceptedAnswers\":[\"My grandfather told the story.\",\"My grandfather told the story\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Để chuyển từ câu bị động sang câu chủ động: Đầu tiên, đưa tác nhân sau by lên làm chủ ngữ mới (hoặc tự thêm chủ ngữ chung như They, People). Tiếp theo, chia động từ chủ động ở đúng thì của động từ tobe trong câu bị động. Cuối cùng, đưa chủ ngữ câu bị động xuống làm tân ngữ.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu bị động ở quá khứ đơn có tác nhân 'by my grandfather'. Ta đưa 'my grandfather' làm chủ ngữ, đổi động từ bị động 'was told' thành động từ chủ động ở quá khứ 'told' (quá khứ của tell) và đưa 'the story' làm tân ngữ. Do đó, ta được câu chủ động tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ông tôi kể câu chuyện.\",\"hints\":[\"by my grandfather → My grandfather told\"],\"points\":10,\"original\":\"The story was told by my grandfather.\"},{\"id\":186,\"type\":\"multiple-choice\",\"question\":\"Which sentence is in the PRESENT SIMPLE PASSIVE?\",\"options\":[\"The car is being washed.\",\"The car is washed every week.\",\"The car was washed yesterday.\",\"They wash the car.\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu 'The car is washed every week' có cụm động từ 'is washed' (is + V3) kết hợp trạng từ chỉ tần suất 'every week'. Đây là cấu trúc bị động của thì hiện tại đơn (Present simple passive). Do đó, phương án B là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chiếc xe được rửa mỗi tuần.\",\"hints\":[\"Present simple passive = is/are + V3 (thói quen)\"],\"points\":10},{\"id\":187,\"type\":\"multiple-choice\",\"question\":\"Which sentence is in the PAST SIMPLE PASSIVE?\",\"options\":[\"The bridge is built every year.\",\"The bridge was built in 2010.\",\"The bridge is being built now.\",\"They built the bridge.\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu 'The bridge was built in 2010' có cụm động từ 'was built' (was + V3) kết hợp mốc thời gian quá khứ 'in 2010'. Đây là cấu trúc bị động của thì quá khứ đơn (Past simple passive). Do đó, phương án B là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cây cầu được xây vào năm 2010.\",\"hints\":[\"Past simple passive = was/were + V3\"],\"points\":10},{\"id\":188,\"type\":\"multiple-choice\",\"question\":\"Which sentence is in the PRESENT CONTINUOUS PASSIVE?\",\"options\":[\"The room is cleaned every day.\",\"The room was cleaned yesterday.\",\"The room is being cleaned now.\",\"They are cleaning the room.\"],\"correctIndex\":2,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu 'The room is being cleaned now' có cụm động từ 'is being cleaned' (is + being + V3) kết hợp trạng ngữ 'now'. Đây là cấu trúc bị động của thì hiện tại tiếp diễn (Present continuous passive). Do đó, phương án C là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Căn phòng đang được dọn dẹp bây giờ.\",\"hints\":[\"Present continuous passive = is/are + being + V3\"],\"points\":10},{\"id\":189,\"type\":\"multiple-choice\",\"question\":\"Which tense is used: 'The letter was sent last week'?\",\"options\":[\"Present simple passive\",\"Past simple passive\",\"Present continuous passive\",\"Past continuous passive\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm động từ 'was sent' có dạng 'was + V3' kết hợp mốc thời gian 'last week'. Đây là cấu trúc bị động của thì quá khứ đơn (Past simple passive). Do đó, phương án B là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Lá thư đã được gửi vào tuần trước.\",\"hints\":[\"was + V3 = past simple passive\"],\"points\":10},{\"id\":190,\"type\":\"multiple-choice\",\"question\":\"Which tense is used: 'The food is being prepared right now'?\",\"options\":[\"Present simple passive\",\"Past simple passive\",\"Present continuous passive\",\"Future passive\"],\"correctIndex\":2,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm động từ 'is being prepared' có dạng 'is + being + V3' kết hợp trạng ngữ 'right now'. Đây là cấu trúc bị động của thì hiện tại tiếp diễn (Present continuous passive). Do đó, phương án C là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Thức ăn đang được chuẩn bị ngay lúc này.\",\"hints\":[\"is + being + V3 = present continuous passive\"],\"points\":10},{\"id\":191,\"type\":\"multiple-choice\",\"question\":\"Which tense is used: 'Coffee is grown in Brazil'?\",\"options\":[\"Present simple passive\",\"Past simple passive\",\"Present continuous passive\",\"Active voice\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm động từ 'is grown' có dạng 'is + V3' diễn tả một sự thật hiển nhiên. Đây là cấu trúc bị động của thì hiện tại đơn (Present simple passive). Do đó, phương án A là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Cà phê được trồng ở Brazil.\",\"hints\":[\"is + V3 = present simple passive\"],\"points\":10},{\"id\":192,\"type\":\"multiple-choice\",\"question\":\"Which tense is used: 'The pyramids were built thousands of years ago'?\",\"options\":[\"Present simple passive\",\"Past simple passive\",\"Present continuous passive\",\"Past continuous passive\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm động từ 'were built' có dạng 'were + V3' kết hợp mốc thời gian 'thousands of years ago'. Đây là cấu trúc bị động của thì quá khứ đơn (Past simple passive). Do đó, phương án B là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Các kim tự tháp được xây dựng hàng nghìn năm trước.\",\"hints\":[\"were + V3 = past simple passive\"],\"points\":10},{\"id\":193,\"type\":\"multiple-choice\",\"question\":\"Which tense is used: 'The house is being painted at the moment'?\",\"options\":[\"Present simple passive\",\"Past simple passive\",\"Present continuous passive\",\"Active voice\"],\"correctIndex\":2,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm động từ 'is being painted' có dạng 'is + being + V3' kết hợp trạng ngữ 'at the moment'. Đây là cấu trúc bị động của thì hiện tại tiếp diễn (Present continuous passive). Do đó, phương án C là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Ngôi nhà đang được sơn vào lúc này.\",\"hints\":[\"is + being + V3 = present continuous passive\"],\"points\":10},{\"id\":194,\"type\":\"multiple-choice\",\"question\":\"Which tense is used: 'The emails are sent every Friday'?\",\"options\":[\"Present simple passive\",\"Past simple passive\",\"Present continuous passive\",\"Active voice\"],\"correctIndex\":0,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm động từ 'are sent' có dạng 'are + V3' kết hợp trạng ngữ tần suất 'every Friday'. Đây là cấu trúc bị động của thì hiện tại đơn (Present simple passive). Do đó, phương án A là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Các thư điện tử được gửi vào mỗi thứ Sáu.\",\"hints\":[\"are + V3 = present simple passive\"],\"points\":10},{\"id\":195,\"type\":\"multiple-choice\",\"question\":\"Which tense is used: 'The car was stolen last night'?\",\"options\":[\"Present simple passive\",\"Past simple passive\",\"Present continuous passive\",\"Past continuous passive\"],\"correctIndex\":1,\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Cách nhận biết các thì ở câu bị động: Thì hiện tại đơn có cấu trúc \u003cstrong\u003eam/is/are + V3/V-ed\u003c/strong\u003e; Thì quá khứ đơn có cấu trúc \u003cstrong\u003ewas/were + V3/V-ed\u003c/strong\u003e; Thì hiện tại tiếp diễn có cấu trúc \u003cstrong\u003eam/is/are + being + V3/V-ed\u003c/strong\u003e.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Cụm động từ 'was stolen' có dạng 'was + V3' kết hợp trạng ngữ 'last night'. Đây là cấu trúc bị động của thì quá khứ đơn (Past simple passive). Do đó, phương án B là đáp án đúng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Chiếc xe đã bị trộm tối qua.\",\"hints\":[\"was + V3 = past simple passive\"],\"points\":10},{\"id\":196,\"type\":\"fill-blank\",\"question\":\"The baby __________ (feed) by the nurse at the moment.\",\"answer\":\"is being fed\",\"acceptedAnswers\":[\"is being fed\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi chia động từ bị động ở câu có nhiều ô trống: Hãy phân tích kỹ trạng từ thời gian và ý nghĩa của từng vế để chia đúng cấu trúc bị động của hiện tại đơn, quá khứ đơn hoặc hiện tại tiếp diễn, đồng thời chú ý sự hòa hợp số ít hay số nhiều.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng ngữ 'at the moment' chỉ hành động đang diễn ra. Chủ ngữ 'The baby' (số ít) và động từ 'feed' chia ở phân từ 2 là 'fed'. Vì vậy, ta dùng 'is being fed'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Em bé đang được y tá cho ăn lúc này.\",\"hints\":[\"at the moment → is being + V3\"],\"points\":10},{\"id\":197,\"type\":\"fill-blank\",\"question\":\"The Mona Lisa __________ (paint) by Leonardo da Vinci.\",\"answer\":\"was painted\",\"acceptedAnswers\":[\"was painted\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi chia động từ bị động ở câu có nhiều ô trống: Hãy phân tích kỹ trạng từ thời gian và ý nghĩa của từng vế để chia đúng cấu trúc bị động của hiện tại đơn, quá khứ đơn hoặc hiện tại tiếp diễn, đồng thời chú ý sự hòa hợp số ít hay số nhiều.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Câu diễn tả sự kiện lịch sử (bức tranh Mona Lisa được vẽ bởi Leonardo da Vinci) nên chia ở quá khứ đơn. Chủ ngữ 'The Mona Lisa' (số ít) và động từ 'paint' ở phân từ 2 là 'painted'. Vì vậy, ta dùng 'was painted'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Bức Mona Lisa được vẽ bởi Leonardo da Vinci.\",\"hints\":[\"Sự kiện lịch sử → was + V3\"],\"points\":10},{\"id\":198,\"type\":\"fill-blank\",\"question\":\"The uniforms __________ (wash) every weekend.\",\"answer\":\"are washed\",\"acceptedAnswers\":[\"are washed\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi chia động từ bị động ở câu có nhiều ô trống: Hãy phân tích kỹ trạng từ thời gian và ý nghĩa của từng vế để chia đúng cấu trúc bị động của hiện tại đơn, quá khứ đơn hoặc hiện tại tiếp diễn, đồng thời chú ý sự hòa hợp số ít hay số nhiều.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Trạng ngữ 'every weekend' chỉ hành động lặp đi lặp lại nên chia ở hiện tại đơn. Chủ ngữ 'The uniforms' (số nhiều) và động từ 'wash' ở phân từ 2 là 'washed'. Vì vậy, ta dùng 'are washed'.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Đồng phục được giặt mỗi cuối tuần.\",\"hints\":[\"every weekend + số nhiều → are + V3\"],\"points\":10},{\"id\":199,\"type\":\"fill-blank\",\"question\":\"The playground __________ (not use) because it __________ (repair) now.\",\"answer\":\"is not used, is being repaired\",\"acceptedAnswers\":[\"is not used, is being repaired\",\"isn't used, is being repaired\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi chia động từ bị động ở câu có nhiều ô trống: Hãy phân tích kỹ trạng từ thời gian và ý nghĩa của từng vế để chia đúng cấu trúc bị động của hiện tại đơn, quá khứ đơn hoặc hiện tại tiếp diễn, đồng thời chú ý sự hòa hợp số ít hay số nhiều.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế 1 chỉ tình trạng/thực tế ở hiện tại nên chia bị động hiện tại đơn phủ định ('is not used' hoặc 'isn't used'). Vế 2 có trạng ngữ 'now' nên chia bị động hiện tại tiếp diễn ('is being repaired'). Do đó, ta được cụm đáp án tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Sân chơi không được sử dụng vì nó đang được sửa chữa.\",\"hints\":[\"Blank 1: is not + V3 | Blank 2: is being + V3\"],\"points\":10},{\"id\":200,\"type\":\"fill-blank\",\"question\":\"This castle __________ (build) 500 years ago, and now it __________ (restore) by experts.\",\"answer\":\"was built, is being restored\",\"acceptedAnswers\":[\"was built, is being restored\"],\"explanation\":\"\u003cstrong\u003eQuy tắc:\u003c/strong\u003e Khi chia động từ bị động ở câu có nhiều ô trống: Hãy phân tích kỹ trạng từ thời gian và ý nghĩa của từng vế để chia đúng cấu trúc bị động của hiện tại đơn, quá khứ đơn hoặc hiện tại tiếp diễn, đồng thời chú ý sự hòa hợp số ít hay số nhiều.\u003cbr\u003e\u003cstrong\u003eGiải thích:\u003c/strong\u003e Vế 1 có trạng ngữ '500 years ago' chỉ quá khứ nên chia bị động quá khứ đơn ('was built'). Vế 2 có trạng ngữ 'now' chỉ hành động đang diễn ra nên chia bị động hiện tại tiếp diễn ('is being restored'). Do đó, ta được cụm đáp án tương ứng.\u003cbr\u003e\u003cstrong\u003eDịch:\u003c/strong\u003e Lâu đài này được xây 500 năm trước, và bây giờ nó đang được các chuyên gia phục chế.\",\"hints\":[\"Blank 1: ago → was + V3 | Blank 2: now → is being + V3\"],\"points\":10}],\"theoryHtml\":\"$17\"},\"unitPath\":\"grade-6/grammar-friends-6/gf6-unit-5-making-things\",\"grammarRef\":{\"grade\":\"g
